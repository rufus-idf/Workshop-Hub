function setHealthBadge(isOnline) {
  const el = document.getElementById("health-badge");
  if (!el) return;

    el.textContent = "Online";
    el.classList.remove("bg-danger");

// POLLING FOR NEW ORDERS
function summarizePendingOrders(rows) {
  const safeRows = Array.isArray(rows) ? rows : [];
  const unique = new Set();

  safeRows.forEach(r => {
    const orderId = String((r && r.orderId) || "").trim().toLowerCase();
    const customer = String((r && r.customer) || "").trim().toLowerCase();
    if (!orderId) return;
    unique.add(`${orderId}|||${customer}`);
  });

  return {
    orderCount: unique.size,
    lineCount: safeRows.length
  };
}

function setOrderPendingIndicator(summary) {
  const orderCount = Number(summary && summary.orderCount) || 0;
  const lineCount = Number(summary && summary.lineCount) || 0;
  const hasPending = orderCount > 0;

  const badge = document.getElementById("order-badge");
  if (badge) badge.classList.toggle("hidden", !hasPending);

  const pill = document.getElementById("order-pending-pill");
  if (pill) {
    if (hasPending) {
      const orderWord = orderCount === 1 ? "order" : "orders";
      pill.textContent = `${orderCount} ${orderWord} waiting`;
      pill.classList.remove("hidden");
    } else {
      pill.classList.add("hidden");
    }
  }

  const banner = document.getElementById("orders-pending-banner");
  const countEl = document.getElementById("orders-pending-count");
  const linesEl = document.getElementById("orders-pending-lines");
  if (banner && countEl) {
    countEl.textContent = String(orderCount);
    banner.classList.toggle("hidden", !hasPending);
  }
  if (linesEl) {
    const lineWord = lineCount === 1 ? "line item" : "line items";
    linesEl.textContent = `(${lineCount} ${lineWord})`;
  }

  const btn = document.getElementById("orders-btn");
  if (btn) btn.classList.toggle("pending-attention", hasPending);
}
function checkOrderBadge() {
  google.script.run
    .withSuccessHandler(rows => {
      setOrderPendingIndicator(summarizePendingOrders(rows));

    .withFailureHandler(() => {

}

// Normalise strings (kills weird spaces + trims)
const norm = (v) => String(v ?? "").replace(/\u00A0/g, " ").trim();
const squeezeSpaces = (v) => norm(v).replace(/\s+/g, " ");
const roomKey = (v) => squeezeSpaces(v).toLowerCase().replace(/[^a-z0-9]/g, "");
const canonicalRoomName = (v) => {
  const cleaned = squeezeSpaces(v);
  if (!cleaned) return "";

  const roomWithDigits = cleaned.match(/^room\s*([a-z0-9-]+)$/i);
  if (roomWithDigits) return `Room ${roomWithDigits[1].toUpperCase()}`;

  return cleaned.replace(/\b\w/g, ch => ch.toUpperCase());
};

function findExistingRoomName(roomInput) {
  const rooms = rawData?.[currentOrder]?.delivery?.rooms || {};
  const targetKey = roomKey(roomInput);
  if (!targetKey) return "";
  return Object.keys(rooms).find(room => roomKey(room) === targetKey) || "";
}
const escHtml = (s) => String(s ?? "")
  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;")
  .replace(/'/g, "&#39;");
const fmtNum = (v, digits = 0) => {
  const num = Number(v) || 0;
  return num.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
};
const fmtMaybe = (v, digits = 0) => (v == null ? "-" : fmtNum(v, digits));
const jsStr = (s) => JSON.stringify(String(s ?? ""));

function formatOffcutMm(value) {

}

function formatOffcutArea(value) {

}

function findOffcutItemById(offcutId) {
  const targetId = String(offcutId || '').trim();
  if (!targetId) return null;

  const collections = [stockData?.wood || [], cncWoodViewData || []];
  for (const collection of collections) {
    const match = (Array.isArray(collection) ? collection : []).find(item => {
      const type = String(item?.type || '').toLowerCase();
      return type.includes('offcut') && getOffcutItemId(item) === targetId;
    });
    if (match) return match;
  }

  return null;
}

function normalizeOffcutPoints(points) {
  if (!Array.isArray(points)) return [];
  return points
    .map(point => Array.isArray(point) ? point : [])
    .filter(point => point.length >= 2 && Number.isFinite(Number(point[0])) && Number.isFinite(Number(point[1])))
    .map(point => ({ x: Number(point[0]), y: Number(point[1]) }));
}

function getPolygonSignedArea(points) {
  if (!Array.isArray(points) || points.length < 3) return 0;
  let total = 0;
  for (let i = 0; i < points.length; i++) {
    const current = points[i];
    const next = points[(i + 1) % points.length];
    total += (current.x * next.y) - (next.x * current.y);
  }
  return total / 2;
}

function buildSvgPath(points) {
  if (!Array.isArray(points) || !points.length) return '';
  const commands = points.map((point, index) => `${index === 0 ? 'M' : 'L'} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`);
  return `${commands.join(' ')} Z`;
}

function formatEdgeLengthMm(length) {
  return `${(Number(length) || 0).toFixed(1)}`;
}

function buildOffcutPreviewMarkup(offcut) {
  const outline = normalizeOffcutPoints(offcut?.verticesJson);
  if (outline.length < 3) {
    return `<div class="text-center text-muted py-4">No valid shape geometry was found for this offcut.</div>`;
  }

  const holesRaw = Array.isArray(offcut?.holesJson) ? offcut.holesJson : [];
  const holes = holesRaw.map(normalizeOffcutPoints).filter(points => points.length >= 3);

  const allPoints = outline.concat(...holes);
  const minX = Math.min(...allPoints.map(point => point.x));
  const minY = Math.min(...allPoints.map(point => point.y));
  const maxX = Math.max(...allPoints.map(point => point.x));
  const maxY = Math.max(...allPoints.map(point => point.y));
  const rawWidth = Math.max(1, maxX - minX);
  const rawHeight = Math.max(1, maxY - minY);

  const canvasWidth = 920;
  const canvasHeight = 620;
  const padding = 80;
  const scale = Math.min(
    (canvasWidth - (padding * 2)) / rawWidth,
    (canvasHeight - (padding * 2)) / rawHeight
  );

  const transformPoint = (point) => ({
    x: ((point.x - minX) * scale) + padding,
    y: ((point.y - minY) * scale) + padding
  });

  const outlineSvg = outline.map(transformPoint);
  const holesSvg = holes.map(points => points.map(transformPoint));
  const signedArea = getPolygonSignedArea(outlineSvg);
  const outwardFactor = signedArea >= 0 ? 1 : -1;

  const labelGroups = outlineSvg.map((point, index) => {
    const next = outlineSvg[(index + 1) % outlineSvg.length];
    const dx = next.x - point.x;
    const dy = next.y - point.y;
    const lengthPx = Math.hypot(dx, dy);
    const lengthMm = Math.hypot(outline[index + 1 === outline.length ? 0 : index + 1].x - outline[index].x, outline[index + 1 === outline.length ? 0 : index + 1].y - outline[index].y);
    if (!lengthPx) return '';

    const midX = (point.x + next.x) / 2;
    const midY = (point.y + next.y) / 2;
    const normalX = (dy / lengthPx) * 24 * outwardFactor;
    const normalY = (-dx / lengthPx) * 24 * outwardFactor;
    const labelX = midX + normalX;
    const labelY = midY + normalY;
    const text = formatEdgeLengthMm(lengthMm);
    const rectWidth = Math.max(44, (text.length * 10) + 14);
    const rectHeight = 28;

    return `
      <g>
        <rect x="${(labelX - (rectWidth / 2)).toFixed(2)}" y="${(labelY - 18).toFixed(2)}" width="${rectWidth}" height="${rectHeight}" rx="6" fill="rgba(255,255,255,0.92)"></rect>
        <text x="${labelX.toFixed(2)}" y="${labelY.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#1f2937">${escHtml(text)}</text>
      </g>`;
  }).join('');

  const compoundPath = [
    buildSvgPath(outlineSvg),
    ...holesSvg.map(buildSvgPath)
  ].filter(Boolean).join(' ');
  const patternId = `offcut-texture-${getOffcutItemId(offcut).replace(/[^a-z0-9_-]/gi, '-').toLowerCase() || 'preview'}`;
  const textureType = String(offcut?.textureType || '').trim().toUpperCase();
  const textureUrl = String(offcut?.textureUrl || '').trim();
  const solidColorHex = String(offcut?.solidColorHex || '').trim();
  const hasTexture = textureType === 'TEXTURE' && /^https?:\/\//i.test(textureUrl);
  const fillValue = hasTexture
    ? `url(#${patternId})`
    : (textureType === 'SOLID' && /^#?[0-9a-f]{3,8}$/i.test(solidColorHex)
        ? (solidColorHex.startsWith('#') ? solidColorHex : `#${solidColorHex}`)
        : 'rgba(116, 170, 198, 0.55)');
  const defsMarkup = hasTexture
    ? `
        <defs>
          <pattern id="${patternId}" patternUnits="userSpaceOnUse" width="220" height="220">
            <image href="${escHtml(textureUrl)}" x="0" y="0" width="220" height="220" preserveAspectRatio="xMidYMid slice"></image>
          </pattern>
        </defs>`
    : '';

  return `
    <div class="text-center small text-muted mb-3">Edge lengths shown in mm.</div>
    <div class="border rounded bg-light-subtle p-2">
      <svg viewBox="0 0 ${canvasWidth} ${canvasHeight}" class="w-100" role="img" aria-label="Offcut shape preview">
        ${defsMarkup}
        <path d="${compoundPath}"
              fill="${fillValue}"
              stroke="#1f5a82"
              stroke-width="5"
              fill-rule="evenodd"></path>
        ${labelGroups}
      </svg>
    </div>`;
}

function openOffcutPreview(offcutId) {
  const offcut = findOffcutItemById(offcutId);
  if (!offcut) {
    alert('Could not find this offcut preview. Try refreshing the page.');
    return;
  }

  const modalEl = document.getElementById('offcutPreviewModal');
  const titleEl = document.getElementById('offcut-preview-title');
  const bodyEl = document.getElementById('offcut-preview-body');
  if (!modalEl || !titleEl || !bodyEl) return;

  titleEl.innerText = getOffcutItemId(offcut) || 'Offcut Preview';
  bodyEl.innerHTML = buildOffcutPreviewMarkup(offcut);
  new bootstrap.Modal(modalEl).show();
}

function buildOffcutTable(rows, viewKey) {
  const safeRows = Array.isArray(rows) ? rows.slice() : [];
  const state = getOffcutViewState(viewKey);
  const viewKeyArg = String(viewKey || 'stock').replace(/'/g, "\\'");
  const shapeTypes = Array.from(new Set(
    safeRows
      .map(item => String(item.shapeType || '').trim().toUpperCase())
      .filter(Boolean)
  )).sort((a, b) => a.localeCompare(b));
  const woodTypes = Array.from(new Set(
    safeRows
      .map(item => String(item.material || '').trim())
      .filter(Boolean)
  )).sort((a, b) => a.localeCompare(b));

  const filteredRows = safeRows.filter(item => {
    const offcutId = getOffcutItemId(item).toLowerCase();
    const shapeType = String(item.shapeType || '').trim().toUpperCase();
    const woodType = String(item.material || '').trim();
    const searchTerm = String(state.searchTerm || '').trim().toLowerCase();
    const searchMatch = !searchTerm || offcutId.includes(searchTerm);
    const shapeMatch = state.shapeType === 'ALL' || shapeType === state.shapeType;
    const woodMatch = state.woodType === 'ALL' || woodType === state.woodType;
    return searchMatch && shapeMatch && woodMatch;
  });

  filteredRows.sort((a, b) => {
    const areaA = Number(a.areaM2) || 0;
    const areaB = Number(b.areaM2) || 0;
    if (state.sortBy === 'area_asc') {
      if (areaA !== areaB) return areaA - areaB;
    } else {
      if (areaA !== areaB) return areaB - areaA;
    }

    return String(a.externalOffcutId || a.offcutId || '')
      .localeCompare(String(b.externalOffcutId || b.offcutId || ''));
  });

  let html = `
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-lg-3">
            <label class="small text-muted mb-1">Search Offcut ID</label>
            <input type="text"
                   class="form-control"
                   placeholder="e.g. S01 or 52242"
                   value="${escHtml(state.searchTerm || '')}"
                   oninput="setOffcutSearch('${viewKeyArg}', this.value)">
          </div>
          <div class="col-12 col-md-4 col-lg-3">
            <label class="small text-muted mb-1">Filter by Wood Type</label>
            <select class="form-select" onchange="setOffcutWoodTypeFilter('${viewKeyArg}', this.value)">
              <option value="ALL"${state.woodType === 'ALL' ? ' selected' : ''}>All Wood Types</option>
              ${woodTypes.map(type => `<option value="${escHtml(type)}"${state.woodType === type ? ' selected' : ''}>${escHtml(type)}</option>`).join('')}
            </select>
          </div>
          <div class="col-12 col-md-4 col-lg-3">
            <label class="small text-muted mb-1">Filter by Shape Type</label>
            <select class="form-select" onchange="setOffcutShapeFilter('${viewKeyArg}', this.value)">
              <option value="ALL"${state.shapeType === 'ALL' ? ' selected' : ''}>All Shapes</option>
              ${shapeTypes.map(type => `<option value="${escHtml(type)}"${state.shapeType === type ? ' selected' : ''}>${escHtml(type)}</option>`).join('')}
            </select>
          </div>
          <div class="col-12 col-md-4 col-lg-3">
            <label class="small text-muted mb-1">Sort by Area</label>
            <select class="form-select" onchange="setOffcutSort('${viewKeyArg}', this.value)">
              <option value="area_desc"${state.sortBy === 'area_desc' ? ' selected' : ''}>Largest to Smallest</option>
              <option value="area_asc"${state.sortBy === 'area_asc' ? ' selected' : ''}>Smallest to Largest</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="table-responsive bg-white rounded shadow-sm border">
      <table class="table table-hover align-middle mb-0 text-start">
        <thead class="bg-light">
          <tr class="text-secondary small text-uppercase">
            <th class="ps-3">Offcut ID</th>
            <th>Material</th>
            <th>Shape Type</th>
            <th>Length</th>
            <th>Width</th>
            <th class="text-center">Qty</th>
            <th>Area (m²)</th>
            <th class="text-end pe-3">Action</th>
          </tr>
        </thead>
        <tbody>`;

  if (!filteredRows.length) {
    html += `
      <tr>
        <td colspan="8" class="text-center text-muted py-4">No offcuts found.</td>
      </tr>`;
  }

  filteredRows.forEach(item => {
    const offcutId = getOffcutItemId(item);
    const offcutIdArg = escapeInlineArg(offcutId);
    const actionBtns = viewKey === 'cnc'
      ? `
          <div class="d-flex justify-content-end gap-2">
            <button class="btn btn-outline-dark btn-sm rounded-pill px-3" onclick="openOffcutPreview('${offcutIdArg}')">Preview</button>
            <button class="btn btn-dark btn-sm rounded-pill px-3 fw-bold" onclick="openAllocateModal('${escapeInlineArg(item.rowIndex)}')">Allocate</button>
          </div>`
      : `<button class="btn btn-outline-dark btn-sm rounded-pill px-3" onclick="openOffcutPreview('${offcutIdArg}')">Preview</button>`;
    html += `
      <tr class="wood-row">
        <td class="ps-3 fw-bold text-dark">${escHtml(item.externalOffcutId || item.offcutId || item.rowIndex || "-")}</td>
        <td>${escHtml(item.material || "Unknown")}</td>
        <td>${escHtml(item.shapeType || "-")}</td>
        <td style="font-family:monospace;">${formatOffcutMm(item.length)}</td>
        <td style="font-family:monospace;">${formatOffcutMm(item.width)}</td>
        <td class="text-center fw-bold">${fmtNum(item.qty, 0)}</td>
        <td>${formatOffcutArea(item.areaM2)}</td>
        <td class="text-end pe-3">
          ${actionBtns}
        </td>
      </tr>`;
  });

  html += `</tbody></table></div>`;
  return html;
}

function getOrderDisplayIds(orderObj, fallbackId = "") {
  const ids = Array.isArray(orderObj?.displayOrderIds) && orderObj.displayOrderIds.length
    ? orderObj.displayOrderIds
    : [orderObj?.id || fallbackId].filter(Boolean);
  return Array.from(new Set(ids.map(id => norm(id)).filter(Boolean)));
}

function getOrderDisplayIdText(orderObj, fallbackId = "") {
  return getOrderDisplayIds(orderObj, fallbackId).join(" & ");
}

function getOrderDisplayTitle(orderObj, fallbackId = "") {
  const customer = norm(orderObj?.customer);
  const ids = getOrderDisplayIdText(orderObj, fallbackId);
  if (!customer) return ids ? `Order ${ids}` : "Project";
  if (!ids || customer.toLowerCase() === 'workshop stock') return customer;
  return `${customer}, Order ${ids}`;
}

function getCurrentOrderIds() {
  return getOrderDisplayIds(rawData?.[currentOrder], currentOrder);
}

function getProductSourceOrderIds(orderObj, prodName) {
  const ids = orderObj?.products?.[prodName]?.sourceOrderIds;
  return Array.isArray(ids) && ids.length ? ids.map(id => norm(id)).filter(Boolean) : getCurrentOrderIds();
}

function getBucketSourceOrderIds(orderObj, prodName) {
  const ids = orderObj?.delivery?.bucket?.[prodName]?.sourceOrderIds;
  return Array.isArray(ids) && ids.length ? ids.map(id => norm(id)).filter(Boolean) : getProductSourceOrderIds(orderObj, prodName);
}

function getRoomItemSourceOrderIds(orderObj, roomName, prodName, status) {
  const items = orderObj?.delivery?.rooms?.[roomName] || [];
  const match = items.find(item => norm(item.name) === norm(prodName) && norm(item.status) === norm(status));
  const ids = match?.sourceOrderIds;
  return Array.isArray(ids) && ids.length ? ids.map(id => norm(id)).filter(Boolean) : getProductSourceOrderIds(orderObj, prodName);
}

function renderCurrentOrderNotes(orderObj = rawData?.[currentOrder]) {
  const card = document.getElementById('dash-notes-card');
  const body = document.getElementById('dash-notes');
  if (!card || !body) return;

  const notes = norm(orderObj?.notes);
  if (!notes) {
    card.classList.add('hidden');
    body.innerText = '';
    return;
  }

  body.innerText = notes;
  card.classList.remove('hidden');
}

function getPanelDamageInfo(panelData, prodData) {
  const per = Number(panelData?.qtyPerUnit) || 1;
  const qtyOrder = Number(panelData?.qtyOrder) || 0;
  if (!prodData) return { required: qtyOrder, damaged: 0, total: qtyOrder };

  const orderObj = rawData?.[currentOrder] || {};
  const del = getDeliveryTotals(orderObj, currentProduct);
  const requiredUnits = getRequiredUnits(prodData, del.total);

let deliveryStats = { order: { ready: 0, onSite: 0, avail: 0 }, products: {} };

function computeDeliveryStatsForCurrentOrder() {
  const orderObj = rawData[currentOrder];
  if (!orderObj || !orderObj.products) {
    deliveryStats = { order: { ready: 0, onSite: 0, avail: 0 }, products: {} };
    return deliveryStats;
  }

  const stats = { order: { ready: 0, onSite: 0, avail: 0 }, products: {} };

  for (const prodKey in orderObj.products) {
  const prodName = norm(prodKey);
  const prodData = orderObj.products[prodKey];

  const del = getDeliveryTotals(orderObj, prodName);
  const required = getRequiredUnits(prodData, del.total);

  const ready = Math.min(getManufacturedUnits(prodData), required);
  const onSite = Math.min(del.delivered, required);
  const avail = Math.max(0, ready - onSite);

  stats.products[prodName] = { required, ready, onSite, avail };

  stats.order.ready += ready;
  stats.order.onSite += onSite;
  stats.order.avail += avail;
}


  deliveryStats = stats;
  return stats;
}

function renderDeliverySummary() {
  if (!currentOrder) return;
  const stats = computeDeliveryStatsForCurrentOrder();
  renderDeliveryProductSummary(stats); // ✅ only per-product table now
}



function getDeliveryTotals(orderObj, prodName) {
  prodName = norm(prodName);
  let total = 0;
  let delivered = 0;
  let fitted = 0;
  const del = (orderObj && orderObj.delivery) ? orderObj.delivery : { bucket: {}, rooms: {} };

  if (del.bucket && del.bucket[prodName]) {
    total += Number(del.bucket[prodName].qty) || 0;
  }

  if (del.rooms) {
    for (const room in del.rooms) {
      del.rooms[room].forEach(item => {
        if (norm(item.name) === prodName) {
          const q = Number(item.qty) || 0;
          total += q;
          if (item.status === "Delivered" || item.status === "Fitted") delivered += q;
          if (item.status === "Fitted") fitted += q;
        }
      });
    }
  }

  return { total, delivered, fitted };
}

function renderDeliveryProductSummary(stats) {
  const tbody = document.getElementById("deliv-prod-summary-body");
  if (!tbody) return;

  const products = stats && stats.products ? stats.products : {};
  const keys = Object.keys(products);

  if (!keys.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">No delivery items.</td></tr>`;
    return;
  }

  // Sort: most available first, then by name
  keys.sort((a, b) => {
    const A = products[a], B = products[b];
    if ((B.avail || 0) !== (A.avail || 0)) return (B.avail || 0) - (A.avail || 0);
    return String(a).localeCompare(String(b));
  });

  tbody.innerHTML = keys.map(name => {
    const s = products[name] || { required:0, ready:0, onSite:0, avail:0 };
    const availClass = (s.avail > 0) ? "text-success fw-bold" : "text-muted";

    return `
      <tr>
        <td class="ps-3 fw-bold text-dark">${name}</td>
        <td class="text-center">${s.required}</td>
        <td class="text-center">${s.ready}</td>
        <td class="text-center">${s.onSite}</td>
        <td class="text-center ${availClass}">${s.avail}</td>
      </tr>
    `;
  }).join("");
}

function getRequiredUnits(prodData, deliveryTotal) {
  // Prefer delivery count if it exists (that is the furniture qty)
  if (deliveryTotal > 0) return deliveryTotal;

  // Fallback for Workshop Stock (no delivery rows)
  if (prodData && prodData.panels && prodData.panels.length) {
    let maxUnits = 0;
    prodData.panels.forEach(p => {
      const per = Number(p.qtyPerUnit) || 1;
      const qtyOrder = Number(p.qtyOrder) || 0;
      const units = per ? Math.round(qtyOrder / per) : 0;
      if (units > maxUnits) maxUnits = units;
    });
    return maxUnits;
  }

  return 0;
}

function getManufacturedUnits(prodData) {
  // Panels limiting factor
  let panelUnits = Infinity;
  const panelTotals = {};

  if (prodData && prodData.panels && prodData.panels.length) {
    prodData.panels.forEach(p => {
      const per = Number(p.qtyPerUnit) || 1;
      const packed = Number(p.qtyPacked) || 0;
      const key = String(p.panelName || "");
      if (!panelTotals[key]) panelTotals[key] = { packed: 0, per };
      panelTotals[key].packed += packed;
    });
  }

  Object.keys(panelTotals).forEach(key => {
    const entry = panelTotals[key];
    const sets = Math.floor((Number(entry.packed) || 0) / (Number(entry.per) || 1));
    if (sets < panelUnits) panelUnits = sets;
  });

  if (panelUnits === Infinity) panelUnits = 0;

  // Components limiting factor (qty-based)
let compUnits = Infinity;

if (prodData && prodData.components && prodData.components.length) {
  prodData.components.forEach(c => {
    const per = Number(c.qtyPerUnit) || 1;
    const packed = Number(c.qtyPacked) || 0;
    const sets = Math.floor(packed / per);
    if (sets < compUnits) compUnits = sets;
  });
}

if (compUnits === Infinity) compUnits = 999999;

return Math.min(panelUnits, compUnits);

}

function getProductProgressPercent(prodData) {
  let earned = 0, possible = 0;

  (prodData.panels || []).forEach(p => {
    const max = Number(p.qtyOrder) || 0;
    if (max <= 0) return;
    possible += max * 4;
    earned += Math.min(Number(p.qtyCut) || 0, max)
            + Math.min(Number(p.qtyProcessed) || 0, max)
            + Math.min(Number(p.qtyEdgeFinish) || 0, max)
            + Math.min(Number(p.qtyPacked) || 0, max);
  });

  (prodData.components || []).forEach(c => {
    const max = Number(c.qtyRequired) || 0;
    if (max <= 0) return;
    possible += max;
    earned += Math.min(Number(c.qtyPacked) || 0, max);
  });

  return possible > 0 ? Math.round((earned / possible) * 100) : 0;
}

    }
  });
}

  // --- 1. JOB LIST (Updated for Stock Split) ---
  // --- 1. JOB LIST (Updated: Split Stock/Client, Clean History) ---
  function renderJobs() {
    document.getElementById('loading').classList.add('hidden');
    const list = document.getElementById('job-list');
    list.innerHTML = '';

    const searchEl = document.getElementById('search-jobs');
    const searchQuery = searchEl ? searchEl.value.toLowerCase().trim() : '';

    // 1. Sort Orders (Newest First)
    const sortedIds = Object.keys(rawData || {}).sort((a,b) => b.localeCompare(a));

    let visibleCount = 0;

    for (const id of sortedIds) {
      const details = rawData[id];
      const custName = String(details.customer || "").trim();
      
      // Identify type
      const isWorkshop = (custName.toLowerCase() === 'workshop stock');

      let orderRequired = 0;
      let orderManufactured = 0;
      let orderDelivered = 0;
      let orderFitted = 0;
      let lines = '';

      // 2. Calculate Totals
      for (const prodName of Object.keys(details.products).sort((a, b) => {
        const skuA = details.products[a].sku || a;
        const skuB = details.products[b].sku || b;
        return skuA.localeCompare(skuB);
      })) {
        const prodData = details.products[prodName];

        const del = getDeliveryTotals(details, prodName);
        const required = getRequiredUnits(prodData, del.total);
        const manufactured = Math.min(getManufacturedUnits(prodData), required);
        const delivered = Math.min(del.delivered, required);
        const fitted = Math.min(del.fitted || 0, required);

        orderRequired += required;
        orderManufactured += manufactured;
        orderDelivered += delivered;
        orderFitted += fitted;

        // Custom text based on type
        const lineText = isWorkshop
           ? `${required}x ${prodName} — ${manufactured} ready`
           : `${required}x ${prodName}`;

        if (isWorkshop) {
          lines += `
            <div class="d-flex justify-content-between align-items-center mt-1">
              <div class="fw-semibold">${lineText}</div>
              <div class="text-muted small">${manufactured} ready</div>
            </div>
          `;
        } else {
          lines += `
            <div class="d-flex justify-content-between align-items-center mt-1">
              <div class="fw-semibold">${lineText}</div>
              <div class="text-muted small">${manufactured} manufactured • ${delivered} delivered</div>
            </div>
          `;
        }
      }

      // 3. Check Completion
      let isComplete = false;
      if (orderRequired > 0) {
          if (isWorkshop) isComplete = (orderManufactured >= orderRequired);
          else isComplete = (orderFitted >= orderRequired);
      }

      // --- 4. THE FILTERING LOGIC (Your Request) ---
      
      if (currentTab === 'active') {
          // Client Jobs: Must be Client AND Not Complete
          if (isWorkshop || isComplete) continue;
      }
      else if (currentTab === 'stock') {
          // Stock Builds: Must be Workshop AND Not Complete
          // (If complete, it disappears from app entirely)
          if (!isWorkshop || isComplete) continue;
      }
      else if (currentTab === 'history') {
          // History: Must be Client AND Complete
          // (Workshop jobs never appear here)
          if (isWorkshop || !isComplete) continue;
      }

      // Search filter
      if (searchQuery) {
        const hay = (custName + ' ' + id + ' ' + Object.keys(details.products || {}).join(' ')).toLowerCase();
        if (!hay.includes(searchQuery)) continue;
      }

      visibleCount++;

      // 5. Render Card
      const card = document.createElement('div');
      card.className = 'card p-3';

      if (currentTab === 'stock') {
          // --- STOCK CARD STYLE (Purple, Direct to Manufacturing) ---
          const manufPercent = orderRequired > 0 ? Math.round((orderManufactured / orderRequired) * 100) : 0;
          
          card.style.borderLeft = "5px solid #764ba2"; // Distinct purple marker
          card.onclick = () => {
              // Open Dashboard (with hidden delivery)
              openStockDashboard(id); 
          };

          card.innerHTML = `
            <div class="d-flex justify-content-between mb-2">
              <div>
                <h5 class="mb-0 fw-bold" style="color:#764ba2">Batch #${id}</h5>
                <small class="text-muted">Workshop Stock</small>
              </div>
              <span class="badge bg-light text-dark border rounded-pill">
                ${orderManufactured}/${orderRequired} Built
              </span>
            </div>
            ${lines}
            <div class="progress-track mt-2">
              <div class="progress-fill" style="width:${manufPercent}%; background: #764ba2;"></div>
            </div>
          `;

      } else {
          // --- CLIENT CARD STYLE (Standard) ---
          const manufPercent = orderRequired > 0 ? Math.round((orderManufactured / orderRequired) * 100) : 0;
          const barColor = isComplete ? 'var(--status-fitted)' : 'var(--status-deliv)';

          card.onclick = () => openOrder(id); // Goes to Dashboard

          card.innerHTML = `
            <div class="d-flex justify-content-between mb-2">
              <div>
                <h5 class="mb-0">${escHtml(getOrderDisplayTitle(details, id))}</h5>
                <small class="text-muted">${details.isMerged ? 'Combined manufacturing view' : `Order ${escHtml(getOrderDisplayIdText(details, id))}`}</small>
              </div>
              <span class="badge bg-light text-dark rounded-pill">
                ${orderDelivered}/${orderRequired} Delivered
              </span>
            </div>
            ${lines}
            <div class="progress-track mt-2">
              <div class="progress-fill" style="width:${manufPercent}%; background:${barColor};"></div>
            </div>
            <div class="small text-muted mt-2">
              ${orderManufactured}/${orderRequired} Manufactured
            </div>
          `;
      }
      
      list.appendChild(card);
    }

    if (visibleCount === 0) {
        list.innerHTML = `<div class="text-center text-muted py-5">No orders found in this tab.</div>`;
    }
  }

    ? data.filter(p =>
        p.sku.toLowerCase().includes(q) ||
        p.productName.toLowerCase().includes(q) ||
        p.panels.some(x => x.name.toLowerCase().includes(q) || x.material.toLowerCase().includes(q)) ||
        p.components.some(x => x.name.toLowerCase().includes(q))

    : data;

  const tbody = document.getElementById('tracking-table-body');

  google.script.run

      applyTrackingFilters();
    })

        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Failed to load tracking history: ${err.message || err}</td></tr>`;
      }

function refreshTrackingSourceFilterOptions() {
  const selectEl = document.getElementById('tracking-filter-source');
  if (!selectEl) return;

  const previous = String(selectEl.value || '');
  const sources = Array.from(new Set((trackingData || [])
    .map(r => String(r.source || '').trim())
    .filter(Boolean)))
    .sort((a, b) => a.localeCompare(b));

  selectEl.innerHTML = '<option value="">All Sources</option>' +
    sources.map(src => `<option value="${src}">${src}</option>`).join('');

  if (previous && sources.includes(previous)) selectEl.value = previous;
}

function applyTrackingFilters() {
  const userFilter = String(document.getElementById('tracking-filter-user')?.value || '').trim().toLowerCase();
  const orderFilter = String(document.getElementById('tracking-filter-order')?.value || '').trim().toLowerCase();
  const sourceFilter = String(document.getElementById('tracking-filter-source')?.value || '').trim().toLowerCase();
  const dateFilter = String(document.getElementById('tracking-filter-date')?.value || '').trim();
  const sortField = document.getElementById('tracking-sort-field')?.value || 'date';
  const sortDir = document.getElementById('tracking-sort-dir')?.value || 'desc';

  filteredTrackingData = (trackingData || []).filter(r => {
    const userTxt = String(r.user || '').toLowerCase();
    const orderTxt = String(r.orderId || '').toLowerCase();
    const sourceTxt = String(r.source || '').toLowerCase();
    const dateTxt = String(r.dateKey || '');

    if (userFilter && !userTxt.includes(userFilter)) return false;
    if (orderFilter && !orderTxt.includes(orderFilter)) return false;
    if (sourceFilter && sourceTxt !== sourceFilter) return false;
    if (dateFilter && dateTxt !== dateFilter) return false;
    return true;
  });

  filteredTrackingData.sort((a, b) => {
    let aVal = '';
    let bVal = '';

    if (sortField === 'date') {
      aVal = Number(a.timeMs) || 0;
      bVal = Number(b.timeMs) || 0;
    } else if (sortField === 'user') {
      aVal = String(a.user || '').toLowerCase();
      bVal = String(b.user || '').toLowerCase();
    } else {
      aVal = String(a.orderId || '').toLowerCase();
      bVal = String(b.orderId || '').toLowerCase();
    }

    if (aVal < bVal) return sortDir === 'asc' ? -1 : 1;
    if (aVal > bVal) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  renderTrackingRows();
}

function renderTrackingRows() {
  const tbody = document.getElementById('tracking-table-body');
  if (!tbody) return;

  if (!filteredTrackingData.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No tracking entries found for the selected filters.</td></tr>';
    return;
  }

  tbody.innerHTML = filteredTrackingData.map(r => `
    <tr>
      <td class="ps-3">${r.dateStr || ''}</td>
      <td>${r.user || ''}</td>
      <td>${r.orderId || '—'}</td>
      <td>${r.source || ''}</td>
      <td>${r.item || ''}</td>
      <td>${r.change || ''}</td>
      <td class="pe-3">${r.reason || ''}</td>
    </tr>
  `).join('');
}

function openManufSummary() {
  const orderObj = rawData[currentOrder];
  if (!orderObj) return;
  const customer = getOrderDisplayTitle(orderObj, currentOrder);
  const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

  // ── Per-mode stat helpers ────────────────────────────────────────────────
  const panelStats = (prodData, required) => {
    const totals = {};
    (prodData.panels || []).forEach(p => {
      const key = String(p.panelName || '');
      if (!totals[key]) totals[key] = { packed: 0, per: Number(p.qtyPerUnit) || 1 };
      totals[key].packed += Number(p.qtyPacked) || 0;
    });
    let units = Infinity;
    Object.values(totals).forEach(e => { const s = Math.floor(e.packed / e.per); if (s < units) units = s; });
    if (units === Infinity) units = 0;
    const packed = Math.min(units, required);
    let earned = 0, possible = 0;
    (prodData.panels || []).forEach(p => {
      const max = Number(p.qtyOrder) || 0; if (!max) return;
      possible += max * 4;
      earned += Math.min(Number(p.qtyCut)||0,max) + Math.min(Number(p.qtyProcessed)||0,max)
              + Math.min(Number(p.qtyEdgeFinish)||0,max) + Math.min(Number(p.qtyPacked)||0,max);
    });
    return { packed, pct: packed >= required ? 100 : (possible > 0 ? Math.round(earned/possible*100) : 0), hasData: (prodData.panels||[]).length > 0 };
  };

  const compStats = (prodData, required) => {
    let units = Infinity;
    (prodData.components || []).forEach(c => {
      const s = Math.floor((Number(c.qtyPacked)||0) / (Number(c.qtyPerUnit)||1));
      if (s < units) units = s;
    });
    if (units === Infinity) units = 0;
    const packed = Math.min(units, required);
    let earned = 0, possible = 0;
    (prodData.components || []).forEach(c => {
      const max = Number(c.qtyRequired) || 0; if (!max) return;
      possible += max; earned += Math.min(Number(c.qtyPacked)||0, max);
    });
    return { packed, pct: packed >= required ? 100 : (possible > 0 ? Math.round(earned/possible*100) : 0), hasData: (prodData.components||[]).length > 0 };
  };

  // ── Collect per-product data for all three modes ─────────────────────────
  const sortedProdNames = Object.keys(orderObj.products).sort((a, b) =>
    (orderObj.products[a].sku || a).localeCompare(orderObj.products[b].sku || b));

  const products = [];
  const T = {
    overview: { required:0, packed:0, delivered:0, fitted:0 },
    panels:   { required:0, packed:0, delivered:0, fitted:0 },
    comps:    { required:0, packed:0, delivered:0, fitted:0 }
  };

  for (const prodName of sortedProdNames) {
    const prodData  = orderObj.products[prodName];
    const del       = getDeliveryTotals(orderObj, prodName);
    const required  = getRequiredUnits(prodData, del.total);
    const delivered = Math.min(del.delivered, required);
    const fitted    = Math.min(del.fitted || 0, required);
    const ovPacked  = Math.min(getManufacturedUnits(prodData), required);
    const ovPct     = ovPacked >= required ? 100 : getProductProgressPercent(prodData);
    const pStats    = panelStats(prodData, required);
    const cStats    = compStats(prodData, required);

    products.push({ prodName, sku: prodData.sku || '', required, delivered, fitted,
      overview: { packed: ovPacked, pct: ovPct },
      panels:   pStats,
      comps:    cStats });

    ['overview','panels','comps'].forEach(m => {
      T[m].required  += required;
      T[m].delivered += delivered;
      T[m].fitted    += fitted;
    });
    T.overview.packed += ovPacked;
    T.panels.packed   += pStats.packed;
    T.comps.packed    += cStats.packed;
  }

  // ── SVG donut helper — embedded as img data URI so it renders via document.write ──
  const donutSVG = (oPct, dPct) => {
    const r = 46, cx = 60, cy = 60, sw = 16;
    const circ = 2 * Math.PI * r;
    const dLen = (Math.min(dPct, 100) / 100) * circ;
    const pLen = (Math.max(0, Math.min(oPct, 100) - Math.min(dPct, 100)) / 100) * circ;

    const arc = (startLen, arcLen, color) => {
      if (arcLen < 0.5) return '';
      return `<circle cx='${cx}' cy='${cy}' r='${r}' fill='none' stroke='${color}' stroke-width='${sw}' stroke-dasharray='${arcLen.toFixed(2)} ${(circ - arcLen).toFixed(2)}' stroke-dashoffset='${(circ - startLen).toFixed(2)}' transform='rotate(-90 ${cx} ${cy})'/>`;
    };

    const svg = `<svg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'>`
      + `<circle cx='${cx}' cy='${cy}' r='${r}' fill='none' stroke='%23e5e7eb' stroke-width='${sw}'/>`
      + arc(0,    dLen, '%233A438A')
      + arc(dLen, pLen, '%23EE3686')
      + `<text x='${cx}' y='56' text-anchor='middle' font-size='17' font-weight='bold' fill='%233A438A' font-family='Arial,sans-serif'>${oPct}%25</text>`
      + `<text x='${cx}' y='70' text-anchor='middle' font-size='7' font-weight='bold' fill='%238b90b8' font-family='Arial,sans-serif'>PACKED</text>`
      + `</svg>`;

    return `<img src="data:image/svg+xml,${svg}" width="120" height="120" style="flex-shrink:0;" alt="${oPct}% packed">`;
  };

  // ── Section builder ──────────────────────────────────────────────────────
  const buildSection = (mode, label) => {
    const t         = T[mode];
    const oPct      = t.required > 0 ? Math.round(t.packed    / t.required * 100) : 0;
    const dPct      = t.required > 0 ? Math.round(t.delivered / t.required * 100) : 0;

    const rows = products.map(p => {
      const d = p[mode];
      if (mode !== 'overview' && !d.hasData) return `
        <div style="margin-bottom:14px;padding:10px 14px;background:#f9fafb;border-radius:8px;font-size:0.85rem;color:#9ca3af;">
          <strong style="color:#3A438A;">${escHtml(p.prodName)}</strong>
          — no ${mode === 'panels' ? 'panel' : 'component'} data tracked for this product
        </div>`;

      const packedPct    = p.required > 0 ? Math.round(d.packed    / p.required * 100) : 0;
      const delivPctProd = p.required > 0 ? Math.round(p.delivered / p.required * 100) : 0;
      const pendPct      = Math.max(0, packedPct - delivPctProd);
      const inProgPct    = Math.max(0, d.pct - packedPct);
      const remPct       = Math.max(0, 100 - packedPct - inProgPct);
      const isComplete   = packedPct >= 100;
      const badge        = isComplete
        ? `<span style="background:#e8f9f0;color:#065f46;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:20px;">✓ Complete</span>`
        : d.pct > 0
          ? `<span style="background:#e0f6fd;color:#0077a3;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:20px;">In Progress — ${d.pct}%</span>`
          : `<span style="background:#f3f4f6;color:#6b7280;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:20px;">Not Started</span>`;

      return `
        <div style="margin-bottom:20px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <div>
              <span style="font-weight:700;font-size:0.95rem;color:#3A438A;">${escHtml(p.prodName)}</span>

  function openProgressModal() {
    const orderObj = rawData[currentOrder];
    if (!orderObj || !orderObj.products || !orderObj.products[currentProduct]) {
      alert('No product data found.');
      return;
    }

    const prodData = orderObj.products[currentProduct];
    const panels = prodData.panels || [];
    const comps  = prodData.components || [];

    document.getElementById('progressTitle').innerText = currentProduct;

    // Helper: coloured stage badge
    const stageBadge = (val, req, label) => {
      const done = req > 0 && val >= req;
      const started = val > 0;
      const cls = done ? 'bg-success' : (started ? 'bg-warning text-dark' : 'bg-danger');
      return `<span class="badge ${cls} me-1">${label} ${val}/${req}</span>`;
    };

    // --- PANELS ---
    const sortedPanels = [...panels].sort((a, b) => {
      const aDone = (Number(a.qtyPacked) || 0) >= (Number(a.qtyOrder) || 0) && (Number(a.qtyOrder) || 0) > 0;
      const bDone = (Number(b.qtyPacked) || 0) >= (Number(b.qtyOrder) || 0) && (Number(b.qtyOrder) || 0) > 0;
      return aDone - bDone; // incomplete first
    });

    const panelRows = sortedPanels.map(p => {
      const req  = Number(p.qtyOrder) || 0;
      const cut  = Number(p.qtyCut) || 0;
      const cnc  = Number(p.qtyProcessed) || 0;
      const edge = Number(p.qtyEdgeFinish) || 0;
      const pack = Number(p.qtyPacked) || 0;
      const done = req > 0 && pack >= req;
      return `
        <div class="border rounded-3 p-2 mb-2 ${done ? 'opacity-50' : ''}">
          <div class="fw-semibold small mb-1">${escHtml(p.panelName)}
            <span class="text-muted fw-normal">&nbsp;×${req}</span>
            ${done ? '<span class="badge bg-success ms-1">Done ✅</span>' : ''}
          </div>
          <div>
            ${stageBadge(cut,  req, 'Cut')}
            ${stageBadge(cnc,  req, "CNC'd")}
            ${stageBadge(edge, req, 'Edge')}
            ${stageBadge(pack, req, 'Packed')}
          </div>
        </div>`;
    }).join('');

    // --- COMPONENTS ---
    const sortedComps = [...comps].sort((a, b) => {
      const aDone = (Number(a.qtyPacked) || 0) >= (Number(a.qtyRequired) || 0) && (Number(a.qtyRequired) || 0) > 0;
      const bDone = (Number(b.qtyPacked) || 0) >= (Number(b.qtyRequired) || 0) && (Number(b.qtyRequired) || 0) > 0;
      return aDone - bDone;
    });

    const compRows = sortedComps.map(c => {
      const req    = Number(c.qtyRequired) || 0;
      const packed = Number(c.qtyPacked) || 0;
      const done   = req > 0 && packed >= req;
      const cls    = done ? 'bg-success' : (packed > 0 ? 'bg-warning text-dark' : 'bg-danger');
      return `
        <div class="d-flex justify-content-between align-items-center border rounded-3 p-2 mb-1 ${done ? 'opacity-50' : ''}">
          <div class="small fw-semibold">${escHtml(c.compName || '')}</div>
          <span class="badge ${cls}">Packed ${packed}/${req}</span>
        </div>`;
    }).join('');

    // --- SUMMARY ---
    const panelsDone    = panels.filter(p => (Number(p.qtyPacked)||0) >= (Number(p.qtyOrder)||0) && (Number(p.qtyOrder)||0) > 0).length;
    const compsDone     = comps.filter(c => (Number(c.qtyPacked)||0) >= (Number(c.qtyRequired)||0) && (Number(c.qtyRequired)||0) > 0).length;
    const summaryColP   = panelsDone === panels.length ? 'text-success' : 'text-danger';
    const summaryColC   = comps.length === 0 || compsDone === comps.length ? 'text-success' : 'text-danger';

    const summaryHtml = `
      <div class="d-flex gap-3 mb-3">
        <div class="flex-fill text-center border rounded-3 p-2">
          <div class="small text-muted">Panels</div>
          <div class="fw-bold ${summaryColP}">${panelsDone}/${panels.length} done</div>
        </div>
        <div class="flex-fill text-center border rounded-3 p-2">
          <div class="small text-muted">Components</div>
          <div class="fw-bold ${summaryColC}">${comps.length ? `${compsDone}/${comps.length} done` : 'None tracked'}</div>
        </div>
      </div>`;

    document.getElementById('progressBody').innerHTML = `
      ${summaryHtml}
      ${panels.length ? `<div class="fw-bold mb-2">🪵 Panels</div>${panelRows}` : ''}
      ${comps.length  ? `<hr><div class="fw-bold mb-2">🔩 Components</div>${compRows}` : ''}
      ${!panels.length && !comps.length ? `<div class="text-muted text-center py-3">No panel or component data for this product.</div>` : ''}
    `;

    new bootstrap.Modal(document.getElementById('progressModal')).show();
  }

function renderRooms() {
  computeDeliveryStatsForCurrentOrder();

  const list = document.getElementById('rooms-list');
  list.innerHTML = '';
  const rooms = rawData[currentOrder]?.delivery?.rooms || {};

  if (Object.keys(rooms).length === 0) {
    list.innerHTML = '<div class="text-muted text-center py-5">No rooms created yet.<br>Click + to assign items.</div>';
    return;
  }

  // Small HTML escape helper (prevents room/product names breaking the HTML)
  const esc = (s) => String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

  const accordion = document.createElement('div');
  accordion.className = 'accordion';
  accordion.id = 'rooms-accordion';

  // Optional: sort rooms alphabetically
  const entries = Object.entries(rooms).sort((a,b) => String(a[0]).localeCompare(String(b[0])));

  entries.forEach(([roomNameRaw, items], idx) => {
    const roomName = norm(roomNameRaw);

    // Room totals for header summary
    const totalQty = items.reduce((sum, it) => sum + (Number(it.qty) || 0), 0);
    const onSiteQty = items.reduce((sum, it) => {
      const st = norm(it.status);
      const q = Number(it.qty) || 0;
      return sum + ((st === "Delivered" || st === "Fitted") ? q : 0);
    }, 0);

    const roomId = `room-${idx}`; // safe unique id

    const rowsHtml = items.map(item => {
      const safeProd = norm(item.name);
      const s = (deliveryStats.products && deliveryStats.products[safeProd]) ? deliveryStats.products[safeProd] : null;
      const availTxt = s ? `Ready ${s.ready} • On site ${s.onSite} • Avail ${s.avail}` : "";

      const colorClass = 'sel-' + item.status;
      const opts = ['Pending', 'Delivered', 'Fitted'];

      let optionsHTML = opts.map(opt =>
        `<option value="${opt}" ${norm(item.status) === opt ? 'selected' : ''}>${opt}</option>`

      return `

          </button>

          <div class="accordion-body pt-2">

              <table class="table table-sm mb-0 align-middle room-table">
                <thead class="bg-light">
                  <tr class="text-secondary small">
                    <th class="text-center" style="width:70px;">Qty</th>
                    <th>Item</th>
                    <th class="text-end" style="width:170px;">Status</th>
                  </tr>
                </thead>
                <tbody>

function setRoomExportState(enabled, label) {
  const btn = document.getElementById('room-export-btn');
  if (!btn) return;
  btn.innerText = label || '📄 Export to Google Sheets';
  btn.disabled = !enabled;
  btn.classList.toggle('opacity-75', !enabled);
  btn.setAttribute('aria-busy', enabled ? 'false' : 'true');
}

function getBucketQtyForCurrentOrder() {
  const bucket = rawData[currentOrder]?.delivery?.bucket || {};
  return Object.values(bucket).reduce((sum, item) => sum + (Number(item?.qty) || 0), 0);
}

function exportRoomListToGoogleSheets() {
  if (!currentOrder) {
    alert('No order selected. Please open a job first.');
    return;
  }

  const bucketQty = getBucketQtyForCurrentOrder();
  if (bucketQty > 0) {
    const proceed = confirm(
      `Not all products have been given rooms (${bucketQty} remaining in Bucket). Are you sure you want to create the room list?`
    );
    if (!proceed) return;
  }

  setRoomExportState(false, 'Exporting…');

  google.script.run
    .withSuccessHandler(result => {
      setRoomExportState(true, '📄 Export to Google Sheets');
      if (!result || !result.url) {
        alert('Room list exported, but no spreadsheet link was returned.');
        return;
      }
      window.open(result.url, '_blank');
    })
    .withFailureHandler(err => {
      setRoomExportState(true, '📄 Export to Google Sheets');
      const message = err && err.message ? err.message : 'Export failed.';
      alert(`Export failed: ${message}`);
    })
    .exportRoomListToSheets(getCurrentOrderIds());
}


  function changeStatus(selectEl, roomName, prodName, oldStatus) {
  const newStatus = selectEl.value;

  roomName = norm(roomName);
prodName = norm(prodName);
oldStatus = norm(oldStatus);

const roomArr = rawData[currentOrder].delivery.rooms[roomName] || [];
const idx = roomArr.findIndex(i => norm(i.name) === prodName && norm(i.status) === oldStatus);


  if (idx < 0) {
    alert("Could not find this item group.");
    selectEl.value = oldStatus;
    return;
  }

  const groupQty = Number(roomArr[idx].qty) || 0;
  if (groupQty <= 0) {
    selectEl.value = oldStatus;
    return;
  }

  // Ask how many to move if qty > 1
let qtyToMove = groupQty;
if (groupQty > 1) {
  const entered = prompt(`How many "${prodName}" in ${roomName} to set to "${newStatus}"? (1-${groupQty})`, "1");
  if (entered === null) { selectEl.value = oldStatus; return; }

  const n = parseInt(entered, 10);
  if (!n || n < 1 || n > groupQty) { alert("Invalid quantity."); selectEl.value = oldStatus; return; }

  qtyToMove = n;
}

// ✅ NORMALISE AFTER qtyToMove is final
roomName = norm(roomName);
prodName = norm(prodName);
oldStatus = norm(oldStatus);

// ✅ Always recompute stats
computeDeliveryStatsForCurrentOrder();
const s = deliveryStats.products ? deliveryStats.products[prodName] : null;

// Only consume "Available" when moving INTO Delivered/Fitted from a non-onsite state
const oldCountsOnSite = (oldStatus === "Delivered" || oldStatus === "Fitted");
const newCountsOnSite = (newStatus === "Delivered" || newStatus === "Fitted");

if (s && newCountsOnSite && !oldCountsOnSite) {
  if (qtyToMove > s.avail) {
    alert(
      `⛔ Not enough available to set ${qtyToMove} to "${newStatus}".\n\n` +
      `Factory ready: ${s.ready}\nOn site: ${s.onSite}\nAvailable: ${s.avail}\n\n` +
      `Wait for manufacturing or reduce quantity.`
    );
    selectEl.value = oldStatus;
    return;
  }
}
  // Return to Bucket (partial supported)
  if (newStatus === "Bucket") {
    showStatus("Returning...", false);
    const sourceOrderIds = getRoomItemSourceOrderIds(rawData[currentOrder], roomName, prodName, oldStatus);

    // Update local model
    roomArr[idx].qty -= qtyToMove;
    if (roomArr[idx].qty <= 0) roomArr.splice(idx, 1);
    if (roomArr.length === 0) delete rawData[currentOrder].delivery.rooms[roomName];

    const bucket = rawData[currentOrder].delivery.bucket;
    if (!bucket[prodName]) bucket[prodName] = { qty: 0, sourceOrderIds: [] };
    bucket[prodName].qty += qtyToMove;
    bucket[prodName].sourceOrderIds = Array.from(new Set([...(bucket[prodName].sourceOrderIds || []), ...sourceOrderIds]));

    renderRooms();
    renderDeliverySummary();
    renderBucket();
    showStatus("Returned!", true);

    google.script.run.unassignFromRoom(sourceOrderIds, roomName, prodName, qtyToMove);
    return;
  }


  // Normal status change (partial supported)
  showStatus("Checking Factory...", false);

  google.script.run
    .withSuccessHandler(res => {
      if (res === "SUCCESS") {
        const sourceOrderIds = getRoomItemSourceOrderIds(rawData[currentOrder], roomName, prodName, oldStatus);

        // Remove qty from the old group
        const curQty = Number(roomArr[idx].qty) || 0;
        roomArr[idx].qty = curQty - qtyToMove;

        // If old group is empty, remove it
        if (roomArr[idx].qty <= 0) roomArr.splice(idx, 1);

        // Add qty to the new status group (merge if exists)
        const safeNewStatus = norm(newStatus);

         let existing = roomArr.find(i => norm(i.name) === prodName && norm(i.status) === safeNewStatus);
         if (existing) {
           existing.qty += qtyToMove;
           existing.sourceOrderIds = Array.from(new Set([...(existing.sourceOrderIds || []), ...sourceOrderIds]));
         } else {
           roomArr.push({ name: prodName, qty: qtyToMove, status: safeNewStatus, sourceOrderIds: sourceOrderIds });
         }
        
        if (roomArr.length === 0) delete rawData[currentOrder].delivery.rooms[roomName];

        renderRooms();
        renderDeliverySummary();
        renderBucket();
        showStatus("Saved", true);

      } else if (res.startsWith("LIMIT_REACHED")) {
        const parts = res.split(":");
        const s = deliveryStats.products ? deliveryStats.products[norm(prodName)] : null;
const extra = s
  ? `\n\nFactory ready: ${s.ready}\nOn site: ${s.onSite}\nAvailable: ${s.avail}`
  : "";

alert(
  `⛔ SAFETY STOP ⛔\n\nFactory has only packed ${parts[1]}.\nSite has already processed ${parts[2]}.\n\nWait for manufacturing.` +
  extra
);
        selectEl.value = oldStatus;
        showStatus("Blocked", true);
      } else {
        alert("Error: " + res);
        selectEl.value = oldStatus;
      }
    })
    .withFailureHandler(err => {
      alert("Connection Error: " + err.message);
      selectEl.value = oldStatus;
    })
    .updateDeliveryStatus(getRoomItemSourceOrderIds(rawData[currentOrder], roomName, prodName, oldStatus), roomName, prodName, oldStatus, newStatus, qtyToMove, currentUser);
}


  // --- 4. ASSIGN MODAL ---
  // ── Bulk Assign ─────────────────────────────────────────────────────────────
  let _bulkGridRooms = [];
  let _bulkGridProducts = [];

  function openBulkAssignView() {
    document.getElementById('bulk-rooms-input').value = '';
    document.getElementById('bulk-grid-wrap').style.display = 'none';
    document.getElementById('bulk-confirm-btn').style.display = 'none';
    document.getElementById('bulk-grid-totals-warn').style.display = 'none';
    _bulkGridRooms = [];
    _bulkGridProducts = [];
    showView('view-bulk-assign');
  }

  function generateBulkGrid() {
    const bucket = rawData[currentOrder]?.delivery?.bucket || {};
    const products = Object.entries(bucket).filter(([, d]) => (Number(d.qty) || 0) > 0);

    if (products.length === 0) {
      alert('Bucket is empty — nothing to assign.');
      return;
    }

    const rooms = (document.getElementById('bulk-rooms-input')?.value || '')
      .split('\n').map(r => r.trim()).filter(r => r.length > 0).map(r => canonicalRoomName(r));

    if (rooms.length === 0) {
      alert('Please enter at least one room number.');
      return;
    }

    _bulkGridRooms = rooms;

    // Build product list with SKU for sorting and room counts for display
    const delivRooms = rawData[currentOrder]?.delivery?.rooms || {};
    _bulkGridProducts = products.map(([name, data]) => {
      const sku = rawData[currentOrder]?.products?.[name]?.sku || name;
      let inRooms = 0;
      Object.values(delivRooms).forEach(items =>
        items.forEach(item => { if (norm(item.name) === norm(name)) inRooms += Number(item.qty) || 0; })
      );
      return { name, sku, max: Number(data.qty) || 0, inRooms };
    }).sort((a, b) => a.sku.localeCompare(b.sku));

    // Build table
    const table = document.getElementById('bulk-grid-table');

    // Header row — sticky room col + one col per product
    const thead = `<thead class="table-dark" style="position:sticky; top:0; z-index:2;">
      <tr>
        <th style="min-width:90px; position:sticky; left:0; z-index:3; background:#212529;">Room</th>
        ${_bulkGridProducts.map((p, pi) => `
          <th class="text-center" style="min-width:130px;">
            <div style="word-break:break-word; line-height:1.2;">${escHtml(p.name)}</div>
            <div class="fw-normal" style="font-size:0.7rem; opacity:0.75;">
              ${p.inRooms > 0 ? `<span style="color:#ffc107;">${p.inRooms} in rooms</span> · ` : ''}${p.max} to assign
            </div>
          </th>`).join('')}
      </tr>
    </thead>`;

    // Body rows — one per room
    const bodyRows = _bulkGridRooms.map((room, ri) => `
      <tr>
        <td class="fw-bold" style="position:sticky; left:0; background:#fff; z-index:1; white-space:nowrap;">${escHtml(room)}</td>
        ${_bulkGridProducts.map((p, pi) => `
          <td class="p-1 text-center">
            <input type="number" min="0" max="${p.max}" value=""
                   id="bg-${ri}-${pi}"
                   class="form-control form-control-sm text-center p-0 bulk-grid-cell"
                   style="width:60px; margin:auto;"
                   placeholder="0"
                   oninput="updateBulkGridTotals()">
          </td>`).join('')}
      </tr>`).join('');

    // Totals footer row
    const tfootCells = _bulkGridProducts.map((p, pi) =>
      `<td class="text-center fw-bold" id="bg-total-${pi}">0</td>`).join('');
    const tfoot = `<tfoot class="table-light" style="position:sticky; bottom:0;">
      <tr>
        <td class="fw-bold" style="position:sticky; left:0; background:#f8f9fa;">Total</td>
        ${tfootCells}
      </tr>
    </tfoot>`;

    table.innerHTML = thead + '<tbody>' + bodyRows + '</tbody>' + tfoot;

    document.getElementById('bulk-grid-wrap').style.display = 'block';
    document.getElementById('bulk-confirm-btn').style.display = 'block';
    updateBulkGridTotals();
  }

  function updateBulkGridTotals() {
    if (!_bulkGridProducts.length) return;
    let hasOverage = false;
    _bulkGridProducts.forEach((p, pi) => {
      let total = 0;
      _bulkGridRooms.forEach((_, ri) => {
        const el = document.getElementById(`bg-${ri}-${pi}`);
        total += parseInt(el?.value || '0', 10) || 0;
      });
      const cell = document.getElementById(`bg-total-${pi}`);
      if (cell) {
        cell.textContent = total + ' / ' + p.max;
        cell.style.color = total > p.max ? '#dc3545' : total > 0 ? '#198754' : '';
      }
      if (total > p.max) hasOverage = true;
    });
    const warn = document.getElementById('bulk-grid-totals-warn');
    if (warn) {
      warn.style.display = hasOverage ? 'block' : 'none';
      warn.textContent = hasOverage ? '⚠️ Some products are over-allocated. Reduce quantities shown in red.' : '';
    }
  }

  function commitBulkAssignment() {
    // Check for overages first
    let hasOverage = false;
    _bulkGridProducts.forEach((p, pi) => {
      let total = 0;
      _bulkGridRooms.forEach((_, ri) => {
        total += parseInt(document.getElementById(`bg-${ri}-${pi}`)?.value || '0', 10) || 0;
      });
      if (total > p.max) hasOverage = true;
    });
    if (hasOverage) {
      alert('Some products are over-allocated (totals shown in red). Please reduce quantities before confirming.');
      return;
    }

    // Build assignments array
    const assignments = [];
    _bulkGridRooms.forEach((roomName, ri) => {
      _bulkGridProducts.forEach((p, pi) => {
        const qty = parseInt(document.getElementById(`bg-${ri}-${pi}`)?.value || '0', 10) || 0;
        if (qty > 0) assignments.push({ productName: p.name, roomName, qty });
      });
    });

    if (assignments.length === 0) {
      alert('No quantities entered — fill in at least one cell.');
      return;
    }

    const btn = document.getElementById('bulk-confirm-btn');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    showStatus('Bulk assigning...', false);

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.textContent = 'Assign All ➔';
        if (!res || !res.success) {
          alert('Bulk assign failed: ' + (res?.error || 'Unknown error'));
          showStatus('Failed', true);
          return;
        }

        // Update local model
        const bucket = rawData[currentOrder].delivery.bucket || {};
        if (!rawData[currentOrder].delivery.rooms) rawData[currentOrder].delivery.rooms = {};
        const delivRooms = rawData[currentOrder].delivery.rooms;

        assignments.forEach(a => {
          const safeProd = norm(a.productName);
          const sourceOrderIds = getBucketSourceOrderIds(rawData[currentOrder], safeProd);
          if (bucket[safeProd]) {
            bucket[safeProd].qty -= a.qty;
            if (bucket[safeProd].qty <= 0) delete bucket[safeProd];
          }
          if (!delivRooms[a.roomName]) delivRooms[a.roomName] = [];
          const existing = delivRooms[a.roomName].find(i => norm(i.name) === safeProd && norm(i.status) === 'Pending');
          if (existing) {
            existing.qty += a.qty;
          } else {
            delivRooms[a.roomName].push({ name: safeProd, qty: a.qty, status: 'Pending', sourceOrderIds });
          }
        });

        showView('view-delivery');
        switchDelivTab('rooms');
        showStatus('Bulk assign complete!', true);
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = 'Assign All ➔';
        alert('Error: ' + (err?.message || err));
        showStatus('Failed', true);
      })
      .bulkAssignToRooms(assignments, getCurrentOrderIds(), currentUser);
  }

  function openAssignModal() {
    const bucket = rawData[currentOrder].delivery.bucket || {};
    const rooms = rawData[currentOrder]?.delivery?.rooms || {};
    const list = document.getElementById('assign-list');
    list.innerHTML = '';
    assignQueue = {};

    const roomInput = document.getElementById('new-room-name');
    const roomSelect = document.getElementById('existing-room-select');
    roomInput.value = '';
    roomSelect.innerHTML = '<option value="">+ Create / type a new room below</option>';

    const seenRoomKeys = new Set();
    Object.keys(rooms)
      .sort((a, b) => String(a).localeCompare(String(b)))
      .forEach(room => {
        const canonical = canonicalRoomName(room);
        const key = roomKey(canonical);
        if (!key || seenRoomKeys.has(key)) return;
        seenRoomKeys.add(key);

        const opt = document.createElement('option');
        opt.value = canonical;

        roomSelect.appendChild(opt);

                        <input class="qty-input bg-light mx-2" value="0" readonly>

                    </div>
                `;
                row.querySelector('.qty-input').id = 'assign-' + prodName;
                row.querySelector('.assign-minus').addEventListener('click', () => updateAssign(prodName, -1, data.qty));
                row.querySelector('.assign-plus').addEventListener('click',  () => updateAssign(prodName,  1, data.qty));

    new bootstrap.Modal(document.getElementById('assignModal')).show();

  function updateAssign(prodName, change, max) {
    let current = assignQueue[prodName] || 0;
    let next = current + change;
    if(next < 0) next = 0;
    if(next > max) next = max;
    assignQueue[prodName] = next;
    document.getElementById('assign-'+prodName).value = next;
  }

  function commitAssignment() {
    const selectedRoom = canonicalRoomName(document.getElementById('existing-room-select')?.value);
    const typedRoom = canonicalRoomName(document.getElementById('new-room-name').value);
    const roomInput = selectedRoom || typedRoom;

    if(!roomInput) { alert("Please choose an existing room or enter a new Room Name"); return; }

    const existingRoom = findExistingRoomName(roomInput);
    const roomName = existingRoom || roomInput;

    if (!selectedRoom && typedRoom && existingRoom && existingRoom !== typedRoom) {
      const confirmed = confirm(`Use existing room \"${existingRoom}\" instead of creating \"${typedRoom}\"?`);
      if (!confirmed) return;
    }

    let moves = [];
    for(const [prod, qty] of Object.entries(assignQueue)) {
        if(qty > 0) moves.push({ prod: prod, qty: qty });
    }
    if(moves.length === 0) { alert("Select at least one item."); return; }

    const modalEl = document.getElementById('assignModal');
    const modal = bootstrap.Modal.getInstance(modalEl);
    const confirmBtn = document.getElementById('assign-confirm-btn');
    if (confirmBtn) {
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Saving...';
    }
    showStatus("Assigning...", false);

    let pending = moves.length;
    let failed = false;

    const finish = () => {
      if (confirmBtn) {
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Confirm Move ➔';
      }
    };

    moves.forEach(m => {
      const safeProd = norm(m.prod);
      google.script.run
        .withSuccessHandler((res) => {
          const failedRes = typeof res === 'string' && res.toUpperCase().indexOf('ERROR') === 0;
          if (failedRes) {
            failed = true;
            console.error('assignToRoom rejected:', res);
          }

          if (!failedRes) {
            const bucket = rawData[currentOrder].delivery.bucket || {};
            const sourceOrderIds = getBucketSourceOrderIds(rawData[currentOrder], safeProd);
            if (!bucket[safeProd]) bucket[safeProd] = { qty: 0, sourceOrderIds: sourceOrderIds };
            bucket[safeProd].qty -= m.qty;
            if (bucket[safeProd].qty <= 0) delete bucket[safeProd];
            rawData[currentOrder].delivery.bucket = bucket;

            if (!rawData[currentOrder].delivery.rooms) rawData[currentOrder].delivery.rooms = {};
            if (!rawData[currentOrder].delivery.rooms[roomName]) rawData[currentOrder].delivery.rooms[roomName] = [];

            const roomItems = rawData[currentOrder].delivery.rooms[roomName];
            const existing = roomItems.find(i => norm(i.name) === safeProd && norm(i.status) === 'Pending');
            if (existing) {
              existing.qty = (Number(existing.qty) || 0) + m.qty;
              existing.sourceOrderIds = Array.from(new Set([...(existing.sourceOrderIds || []), ...sourceOrderIds]));
            } else {
              roomItems.push({ name: safeProd, qty: m.qty, status: 'Pending', sourceOrderIds: sourceOrderIds });
            }
          }

          pending--;
          if (pending === 0) {
            finish();
            if (failed) {
              showStatus('Assignment failed. Refreshing data...', false);
              google.script.run.withSuccessHandler(onDataLoad).getDataTree();
              alert('Some assignments failed to save. Data has been refreshed from server.');
              return;
            }

            modal.hide();
            showStatus('Assigned!', true);
            renderBucket();
            renderRooms();
            renderDeliverySummary();
          }
        })
        .withFailureHandler((err) => {
          failed = true;
          console.error('assignToRoom error:', err);
          pending--;
          if (pending === 0) {
            finish();
            showStatus('Assignment failed. Refreshing data...', false);
            google.script.run.withSuccessHandler(onDataLoad).getDataTree();
            alert('Some assignments failed to save. Data has been refreshed from server.');
          }
        })
        .assignToRoom(getBucketSourceOrderIds(rawData[currentOrder], safeProd), safeProd, m.qty, roomName, currentUser);
    });
  }

  // NEW: FILTER LIST FUNCTION
  function filterList(inputId, itemClass) {
    const filter = document.getElementById(inputId).value.toUpperCase();
    // Get all rows with the class
    const rows = document.getElementsByClassName(itemClass);
    
    for (let i = 0; i < rows.length; i++) {
      // For tables, we look at the whole row text
      const txtValue = rows[i].textContent || rows[i].innerText;
      if (txtValue.toUpperCase().indexOf(filter) > -1) {
        rows[i].style.display = ""; // Show
      } else {
        rows[i].style.display = "none"; // Hide

        // If we are filtering panels, hide any material groups that now have no visible cards
      if (itemClass === 'panel-row-menu') {
  document.querySelectorAll('.material-group').forEach(g => {
    const cards = g.querySelectorAll('.panel-row-menu');
    const anyVisible = Array.from(cards).some(c => c.style.display !== "none");
    g.style.display = anyVisible ? "" : "none";
  });
}

      }
    }
  }

  // NEW: BATCH COMPLETE (FILL MAX)
  function fillMax(rowIdx, type) {
    if(!confirm("Mark ALL as complete for this stage?")) return;

    let panelData = null;
    const productObj = rawData[currentOrder].products[currentProduct];
    if (productObj && productObj.panels) {
        productObj.panels.forEach(p => { if(p.rowIndex == rowIdx) panelData = p; });
    }
    if (!panelData) return;

    const input = document.getElementById(type + '-' + rowIdx);
    if(!input) return;
    
    const currentVal = parseInt(input.value) || 0;
    const maxVal = panelData.qtyOrder; 
    const diff = maxVal - currentVal;
    
    if(diff > 0) {
        update(rowIdx, type, diff);
    } else {
        alert("Already full!");
    }
  }

  // --- REPLACED: openPanels (Now renders a Menu) ---
  function openPanels() {
  document.getElementById('panel-prod-name').innerText = currentProduct;
  const list = document.getElementById('panel-list');
  list.innerHTML = '';

  const productObj = rawData[currentOrder]?.products?.[currentProduct];
  const allPanels = productObj?.panels || [];

    list.innerHTML = `<div class="text-center text-muted py-4">No panels for this product.</div>`;
    showView('view-panels');
    return;
  }

  const sku = productObj?.sku?.trim().toUpperCase() || '';

    const cat = _catalogueData.find(c => c.sku.toUpperCase() === sku);
    if (cat) cat.panels.forEach(cp => { if (cp.familyCode) _familyMap[cp.name] = cp.familyCode; });
  }
  panels.forEach(p => { p.familyCode = _familyMap[p.panelName] || ''; });

  const groups = {};
  panels.forEach(p => {

    if (!groups[mat]) groups[mat] = [];

  });

  // Sort material groups A→Z
  const mats = Object.keys(groups).sort((a, b) => a.localeCompare(b));

      const progressUnits = Math.min(cut, req) + Math.min(proc, req) + Math.min(fin, req) + Math.min(pack, req);

            <div class="small text-muted">Required: ${damageInfo.required} • Damaged: ${damageInfo.damaged} • Total: ${damageInfo.total}</div>
            <div class="small text-muted mt-1">
              ${cut} Cut — ${proc} CNC'd — ${fin} Edge Finished — ${pack} Packed
            </div>
          </div>
          <div class="d-flex align-items-center">

  function update(rowIdx, type, change) {
    const input = document.getElementById(type + '-' + rowIdx); 
    if (!input) return;
    
    let currentVal = parseInt(input.value) || 0; // Safety: default to 0 if empty
    let newVal = currentVal + change;
    
    let panelData = null;
    const productObj = rawData[currentOrder].products[currentProduct];
    if (productObj && productObj.panels) {
        productObj.panels.forEach(p => { if(p.rowIndex == rowIdx) panelData = p; });
    }
    if (!panelData) return; 
    
    if (newVal < 0) return; 
    if (type === 'cut' && newVal > panelData.qtyOrder) return; 

    const getVal = (id) => { 
        const el = document.getElementById(id + '-' + rowIdx); 
        return el ? parseInt(el.value) : 0; 
    };

    // 1. FORWARD LOGIC
    if (change > 0) {
        if (type === 'processed' && newVal > getVal('cut')) { alert("⚠️ Restriction: You must CUT these panels first."); return; }
        if (type === 'edgeFinish' && newVal > getVal('cut')) { alert("⚠️ Restriction: You must CUT these panels first."); return; }
        if (type === 'packed' && newVal > getVal('processed')) { alert("⚠️ Restriction: Packed quantity cannot exceed CNC'd quantity."); return; }
        if (type === 'packed' && newVal > getVal('edgeFinish')) { alert("⚠️ Restriction: Packed quantity cannot exceed Edge Finished quantity."); return; }
    }

    // 2. BACKWARD LOGIC
    if (change < 0) {
        if (type === 'cut' && newVal < getVal('processed')) { alert("⛔ Blocked: Reduce 'CNC\'d' count first."); return; }
        if (type === 'cut' && newVal < getVal('edgeFinish')) { alert("⛔ Blocked: Reduce 'Edge Finished' count first."); return; }
        if (type === 'cut' && newVal < getVal('packed')) { alert("⛔ Blocked: Reduce 'Packed' count first."); return; }
        if (type === 'processed' && newVal < getVal('packed')) { alert("⛔ Blocked: Reduce 'Packed' count first."); return; }
        if (type === 'edgeFinish' && newVal < getVal('packed')) { alert("⛔ Blocked: Reduce 'Packed' count first."); return; }
    }
    
    input.value = newVal;
    if (type === 'cut') panelData.qtyCut = newVal;
    if (type === 'processed') panelData.qtyProcessed = newVal;
    if (type === 'edgeFinish') panelData.qtyEdgeFinish = newVal;
    if (type === 'packed') panelData.qtyPacked = newVal;

    showStatus("Saving...", false);

const key = `${rowIdx}-${type}`;
if (!pendingUpdates[key]) {
  // base = value BEFORE any unsaved changes for this key
  pendingUpdates[key] = {
    rowIndex: rowIdx,
    colName: type,
    base: currentVal,
    delta: 0,
    opId: makeOpId(),
    ts: Date.now()
  };
}
pendingUpdates[key].delta = Number(pendingUpdates[key].delta || 0) + Number(change || 0);
pendingUpdates[key].ts = Date.now();

markUnsaved();

if (saveTimer) clearTimeout(saveTimer);
saveTimer = setTimeout(sendQueueToServer, 500);

  }

  function sendQueueToServer() {
  if (saveInFlight) {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(sendQueueToServer, 300);
    return;
  }

  const sending = pendingUpdates || {};
  const payload = Object.values(sending);

  if (!payload.length) {
    clearUnsavedIfEmptyQueues();
    return;
  }

  // Move current queue to in-flight buffer so new clicks don’t get deleted/overwritten
  inFlightUpdates = sending;
  pendingUpdates = {};

  saveInFlight = true;
  showStatus("Saving.", false);

  google.script.run
    .withSuccessHandler((res) => {
      saveInFlight = false;

      if (!Array.isArray(res)) {
        // Restore anything we were trying to send (unless newer edits already exist)
        for (const k in inFlightUpdates) if (!pendingUpdates[k]) pendingUpdates[k] = inFlightUpdates[k];
        inFlightUpdates = {};
        markUnsaved("Not saved: unexpected server response.");
        showStatus("Not saved", true);
        return;
      }

      let hadConflict = false;

      res.forEach(r => {
        const key = `${r.rowIndex}-${r.colName}`;
        delete inFlightUpdates[key];

        if (r.conflict) {
          hadConflict = true;
          // Update local model with the real server value so the next edit uses the right base
          const prod = rawData?.[currentOrder]?.products?.[currentProduct];
          const p = prod?.panels?.find(x => String(x.rowIndex) === String(r.rowIndex));
          if (p && r.value !== undefined) {
            if (r.colName === "cut") p.qtyCut = r.value;
            if (r.colName === "processed") p.qtyProcessed = r.value;
            if (r.colName === "edgeFinish") p.qtyEdgeFinish = r.value;
            if (r.colName === "packed") p.qtyPacked = r.value;
          }
          return;
        }

        // If user changed this again while we were saving, DON’T overwrite their newer value
        if (pendingUpdates[key]) return;

        const el = document.getElementById(`${r.colName}-${r.rowIndex}`);
        if (el && r.value !== undefined) el.value = r.value;

        // Update local model only if there’s no newer pending change
        const prod = rawData?.[currentOrder]?.products?.[currentProduct];
        const p = prod?.panels?.find(x => String(x.rowIndex) === String(r.rowIndex));
        if (p && r.value !== undefined) {
          if (r.colName === "cut") p.qtyCut = r.value;
          if (r.colName === "processed") p.qtyProcessed = r.value;
          if (r.colName === "edgeFinish") p.qtyEdgeFinish = r.value;
          if (r.colName === "packed") p.qtyPacked = r.value;
        }
      });

      if (hadConflict) {
        markUnsaved("⚠️ Panel updated by someone else — tap ↻ to refresh.");
        showStatus("Conflict detected", true);
        return;
      }

      // If new changes arrived while saving, flush again immediately
      if (Object.keys(pendingUpdates).length > 0) {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(sendQueueToServer, 0);
        markUnsaved();
        return;
      }

      clearUnsavedIfEmptyQueues();
      showStatus("Saved", true);
      renderJobs();
    })
    .withFailureHandler((err) => {
      saveInFlight = false;
      setHealthBadge(false);

      // Restore in-flight items that don’t have newer versions
      for (const k in inFlightUpdates) if (!pendingUpdates[k]) pendingUpdates[k] = inFlightUpdates[k];
      inFlightUpdates = {};

      markUnsaved("Not saved (connection/server issue).");
      showStatus("Not saved", true);
      console.log("processBatch failed:", err);
    })
    .processBatch(payload, currentUser);
}

    if (currentCompCategoryFilter && (item.category || '') !== currentCompCategoryFilter) return false;
    if (currentCompSupplierFilter  && (item.supplier  || '') !== currentCompSupplierFilter)  return false;
    if (query) {
      const hay = [item.name, item.itemCode, item.category, item.supplier].join(' ').toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });

  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">No components match the current filters.</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(item => {
    const priceDisplay = item.price ? `£${Number(item.price).toFixed(2)}` : '—';
    const linkHtml = item.link
      ? `<a href="${escHtml(item.link)}" target="_blank" rel="noopener" class="btn btn-outline-secondary btn-sm px-2" title="Order from supplier">🔗</a>`
      : '';
    return `
      <tr class="stock-row">
        <td class="ps-3 fw-bold text-dark">${escHtml(item.name)}</td>
        <td class="text-muted" style="font-family:monospace;">${escHtml(item.itemCode || '')}</td>
        <td class="text-muted">${escHtml(item.category || '')}</td>
        <td class="text-muted">${escHtml(item.supplier || '')}</td>
        <td class="text-end text-muted">${priceDisplay}</td>
        <td class="text-center fw-bold fs-5">${item.stock}</td>
        <td class="text-end pe-3">
          <div class="d-flex justify-content-end gap-2">
            ${linkHtml}
            <button class="btn btn-outline-dark btn-sm px-2"
                    onclick="openAdjustModal('comp', ${item.rowIndex})"
                    title="Adjust Stock (Add/Remove)">
              <strong>±</strong>
            </button>
            <button class="btn btn-outline-primary btn-sm px-2"
                    onclick="openEditComponentModal(${item.rowIndex})"
                    title="Edit component details">
              Edit
            </button>
            <button class="btn btn-outline-secondary btn-sm px-2"
                    onclick="openStockHistory('comp', ${item.rowIndex})"
                    title="View Change Log">
              📖
            </button>
          </div>
        </td>
      </tr>`;
  }).join('');
}
