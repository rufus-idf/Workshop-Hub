          </table>` : `<p style="font-family:sans-serif; font-size:9pt; color:#999; margin:0; padding:6px 12px; font-style:italic;">No panel or component data in catalogue for this product</p>`}
        </div>`;
    }).join('');

    appendixHTML = `
      <div style="page-break-before:always; padding:20mm 15mm 15mm;">
        <h2 style="font-family:sans-serif; font-size:16pt; margin-bottom:4px;">Appendix — Workshop Loading Checklist</h2>
        <p style="font-family:sans-serif; font-size:9pt; color:#666; margin-bottom:20px;">Delivery ${esc(delivNo)} · ${esc(date)} · ${esc(customer)}</p>
        ${productBlocks}
      </div>`;
  }

  const notesSection = notes
    ? `<div style="margin-top:16px; padding:10px 12px; background:#fffbe6; border:1px solid #f5e06a; border-radius:4px;">
         <div style="font-size:8pt; font-weight:bold; color:#888; text-transform:uppercase; margin-bottom:4px;">Notes</div>
         <div style="font-size:10pt;">${esc(notes)}</div>
       </div>`
    : '';

  return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Delivery Note ${esc(delivNo)}</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  body { font-family:sans-serif; font-size:10pt; color:#1a1a1a; background:#fff; }
  table { border-collapse:collapse; width:100%; }
  th { text-align:left; }
  @media print {
    .no-print { display:none !important; }
    @page { margin:15mm; }
  }
</style>
</head>
<body>

<div class="no-print" style="position:fixed; top:12px; right:16px; z-index:999; display:flex; gap:8px;">
  <button onclick="window.print()" style="background:#111; color:#fff; border:none; padding:10px 22px; border-radius:20px; font-weight:bold; font-size:11pt; cursor:pointer;">🖨 Print / Save PDF</button>
  <button onclick="window.close()" style="background:#eee; color:#333; border:none; padding:10px 18px; border-radius:20px; font-size:11pt; cursor:pointer;">Close</button>
</div>

<!-- PAGE 1 -->
<div style="padding:20mm 15mm 15mm;">

  <!-- Header -->
  <table style="margin-bottom:16px;">
    <tr>
      <td style="width:55%;">
        ${logo ? `<img src="${logo}" style="max-height:64px; max-width:200px;" alt="Logo">` : `<div style="font-size:14pt; font-weight:bold;">${esc(COMPANY_NAME)}</div>`}
      </td>
      <td style="text-align:right; vertical-align:top;">
        <div style="font-weight:bold; font-size:11pt;">${esc(COMPANY_NAME)}</div>
        <div style="font-size:9pt; color:#555; margin-top:3px; line-height:1.5;">${esc(COMPANY_ADDR)}</div>
      </td>
    </tr>
  </table>

  <hr style="border:none; border-top:2px solid #111; margin-bottom:16px;">

  <!-- Title + Ref + Date -->
  <table style="margin-bottom:20px;">
    <tr>
      <td style="width:60%;">
        <div style="font-size:20pt; font-weight:bold; margin-bottom:4px;">Delivery Note</div>
        <div style="font-size:9pt; color:#888;">Reference: <strong style="color:#111;">${esc(delivNo)}</strong></div>
      </td>
      <td style="text-align:right; vertical-align:bottom;">
        <div style="font-size:8pt; color:#888; margin-bottom:2px;">Date</div>
        <div style="font-size:12pt; font-weight:bold;">${esc(date)}</div>
      </td>
    </tr>
  </table>

  <!-- Customer + Room breakdown side-by-side -->
  <table style="margin-bottom:20px; vertical-align:top;">
    <tr>
      <td style="width:40%; vertical-align:top; padding-right:20px;">
        <div style="font-size:8pt; font-weight:bold; color:#888; text-transform:uppercase; margin-bottom:6px;">Deliver To</div>
        <div style="font-size:12pt; font-weight:bold;">${esc(customer)}</div>
        ${address ? `<div style="font-size:9pt; color:#555; margin-top:6px; white-space:pre-line;">${esc(address)}</div>` : ''}
      </td>
      <td style="width:60%; vertical-align:top;">
        <div style="font-size:8pt; font-weight:bold; color:#888; text-transform:uppercase; margin-bottom:6px;">Room Breakdown</div>
        <table style="font-size:9pt; border:1px solid #ddd;">
          <thead><tr>
            <th style="padding:5px 10px; background:#f4f4f4; border-bottom:2px solid #ccc; border-right:1px solid #ddd; white-space:nowrap;">Room</th>
            <th style="padding:5px 10px; background:#f4f4f4; border-bottom:2px solid #ccc; border-right:1px solid #ddd;">Products</th>
            <th style="padding:5px 10px; background:#f4f4f4; border-bottom:2px solid #ccc; text-align:center; white-space:nowrap;">Items</th>
          </tr></thead>
          <tbody>${roomSummaryRows}</tbody>
        </table>
      </td>
    </tr>
  </table>

  <!-- Products summary -->
  <div style="font-size:8pt; font-weight:bold; color:#888; text-transform:uppercase; margin-bottom:6px;">Product Summary</div>
  <table style="font-size:10pt; margin-bottom:20px; border:1px solid #ddd;">
    <thead><tr style="background:#f4f4f4;">
      <th style="padding:7px 10px; border-bottom:2px solid #ccc; border-right:1px solid #ddd;">Product</th>
      <th style="padding:7px 10px; border-bottom:2px solid #ccc; border-right:1px solid #ddd; text-align:center; width:60px;">Qty</th>
      <th style="padding:7px 10px; border-bottom:2px solid #ccc; border-right:1px solid #ddd; text-align:center; width:80px;">Weight</th>
      <th style="padding:7px 10px; border-bottom:2px solid #ccc; color:#666;">Rooms</th>
    </tr></thead>
    <tbody>${productRows}</tbody>
  </table>

  ${totalWeightKg > 0 ? `
  <div style="display:flex; justify-content:flex-end; margin-bottom:16px;">
    <div style="background:#1a1a1a; color:#fff; padding:8px 20px; border-radius:6px; font-size:10pt;">
      <span style="opacity:0.7; font-size:8.5pt; text-transform:uppercase; letter-spacing:0.06em;">Total Delivery Weight</span>
      <span style="font-weight:bold; font-size:14pt; margin-left:12px;">${totalWeightKg} kg</span>
    </div>
  </div>` : ''}

  ${notesSection}

  <!-- Signatures -->
  <table style="margin-top:30px; width:100%;">
    <tr>
      <td style="width:47%; vertical-align:top; padding-right:20px;">
        <div style="font-size:8pt; font-weight:bold; color:#888; text-transform:uppercase; margin-bottom:8px;">Delivered By (Driver / Fitter)</div>
        <div style="border-bottom:1px solid #333; height:55px; margin-bottom:6px;"></div>
        <div style="font-size:8pt; color:#888;">Name &amp; Signature</div>
        <div style="border-bottom:1px solid #ccc; height:30px; margin-top:18px; margin-bottom:4px;"></div>
        <div style="font-size:8pt; color:#888;">Date</div>
      </td>
      <td style="width:6%;"></td>
      <td style="width:47%; vertical-align:top;">
        <div style="font-size:8pt; font-weight:bold; color:#888; text-transform:uppercase; margin-bottom:8px;">Received By (Customer)</div>
        <div style="border-bottom:1px solid #333; height:55px; margin-bottom:6px;"></div>
        <div style="font-size:8pt; color:#888;">Name &amp; Signature</div>
        <div style="border-bottom:1px solid #ccc; height:30px; margin-top:18px; margin-bottom:4px;"></div>
        <div style="font-size:8pt; color:#888;">Date</div>
      </td>
    </tr>
  </table>

  <div style="margin-top:30px; font-size:8pt; color:#aaa; text-align:center; border-top:1px solid #eee; padding-top:10px;">
    ${esc(COMPANY_NAME)} · ${esc(COMPANY_ADDR)} · ${esc(delivNo)}
  </div>

</div>

${appendixHTML}

</body>
</html>`;
}

function openDeliveryNoteWindow(html) {
  const win = window.open('', '_blank', 'width=920,height=750,resizable=yes');
  if (!win) {
    alert('Pop-up blocked. Please allow pop-ups for this site and try again.');
    return;
  }
  win.document.open();
  win.document.write(html);
  win.document.close();
}

// --- STARTUP: session check ---
(function() {
  const saved = localStorage.getItem('whub_user');
  if (saved) {
    currentUser = saved;
    _applyUserToHeader(saved);
    showView('view-jobs');
    startPoll();
    google.script.run.heartbeatPresence(saved);
    google.script.run.withSuccessHandler(renderPresence).withFailureHandler(() => {}).getActiveUsers();
    google.script.run
      .withSuccessHandler(tasks => { actionListData = tasks; refreshActionBadge(); })
      .getActionList();
  }
  // If no saved user, view-login is already visible and view-jobs is hidden
})();

</script>
