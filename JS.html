function saveEditedComponent() {
  const payload = {
    rowIndex: Number(document.getElementById('edit-comp-row-index').value),
    itemCode: document.getElementById('edit-comp-itemcode').value,
    name: document.getElementById('edit-comp-name').value,
    category: document.getElementById('edit-comp-category').value,
    supplier: document.getElementById('edit-comp-supplier').value,
    stock: Number(document.getElementById('edit-comp-stock').value),
    onOrder: Number(document.getElementById('edit-comp-onorder').value),
    price: Number(document.getElementById('edit-comp-price').value),
    link: document.getElementById('edit-comp-link').value
  };

  if (!payload.name.trim()) { alert("Component name is required."); return; }
  if (![payload.stock, payload.onOrder, payload.price].every(v => Number.isFinite(v) && v >= 0)) {
    alert("Stock, On Order and Price must be zero or positive numbers.");
    return;
  }

  showStatus("Saving component...", false);
  google.script.run
    .withSuccessHandler(() => {
      const modal = bootstrap.Modal.getInstance(document.getElementById('editComponentModal'));
      if (modal) modal.hide();
      google.script.run.withSuccessHandler(d => {
        stockData = d;
        openComponentStock(false);
        showStatus("Saved", true);
      }).getInventoryData();
    })
    .withFailureHandler(err => {
      alert(err && err.message ? err.message : err);
      showStatus("Error", false);
    })
    .updateComponentItem(payload, currentUser);
}

function commitAddItem() {
  const type = document.getElementById('addItemModal-type').value;
  let data = {};

  if (type === 'wood') {
    const material   = (document.getElementById('add-wood-material').value   || '').trim();
    const colourCode = (document.getElementById('add-wood-colourcode').value || '').trim();
    const sizeSel    = (document.getElementById('add-wood-size').value        || '');
    const priceVal   = (document.getElementById('add-wood-price').value       || '').trim();

    if (!material)   { alert("Material is required.");    return; }
    if (!colourCode) { alert("Colour Code is required."); return; }
    if (!sizeSel)    { alert("Please select a size.");    return; }
    if (!priceVal)   { alert("Price is required.");       return; }

    let length, width;
    if (sizeSel === '2800x2070') { length = 2800; width = 2070; }
    else if (sizeSel === '3050x1220') { length = 3050; width = 1220; }
    else {
      length = (document.getElementById('add-wood-length').value || '').trim();
      width  = (document.getElementById('add-wood-width').value  || '').trim();
      if (!length || !width) { alert("Please enter custom Length and Width."); return; }
      length = Number(length); width = Number(width);
    }

    data = {
      material, colourCode, length, width,
      qty:     Number(document.getElementById('add-wood-qty').value)     || 0,
      onOrder: Number(document.getElementById('add-wood-onorder').value) || 0,
      price:   Number(priceVal)
    };
  }

  if (type === 'comp') {
    const name     = (document.getElementById('add-comp-name').value || '').trim();
    const itemCode = (document.getElementById('add-comp-code').value || '').trim();
    const priceVal = (document.getElementById('add-comp-price').value || '').trim();

    const catSel = document.getElementById('add-comp-category-sel').value;
    const category = catSel === '__new__'
      ? (document.getElementById('add-comp-category-new').value || '').trim()
      : catSel;

    const supSel = document.getElementById('add-comp-supplier-sel').value;
    const supplier = supSel === '__new__'
      ? (document.getElementById('add-comp-supplier-new').value || '').trim()
      : supSel;

    if (!name)     { alert("Item Name is required.");                              return; }
    if (!itemCode) { alert("Item Code is required.");                              return; }
    if (!category) { alert("Category is required (select one or add a new one."); return; }
    if (!supplier) { alert("Supplier is required (select one or add a new one.)"); return; }
    if (!priceVal) { alert("Price is required.");                                  return; }

    data = {
      name, itemCode, category, supplier,
      stock:   Number(document.getElementById('add-comp-stock').value)   || 0,
      onOrder: Number(document.getElementById('add-comp-onorder').value) || 0,
      price:   Number(priceVal),
      link:    ((document.getElementById('add-comp-link') || {}).value || '').trim()
    };
  }

  if (type === 'edge') {
    const material = (document.getElementById('add-edge-material').value || '').trim();
    const priceVal = (document.getElementById('add-edge-price').value    || '').trim();

    const thickSel = document.getElementById('add-edge-thickness-sel').value;
    let thickness;
    if (!thickSel) { alert("Thickness is required."); return; }
    if (thickSel === 'other') {
      const v = (document.getElementById('add-edge-thickness-custom').value || '').trim();
      if (!v) { alert("Please enter a custom thickness."); return; }
      thickness = Number(v);
    } else { thickness = Number(thickSel); }

    const rollSel = document.getElementById('add-edge-rolllength-sel').value;
    let rollLength;
    if (!rollSel) { alert("Roll Length is required."); return; }
    if (rollSel === 'other') {
      const v = (document.getElementById('add-edge-rolllength-custom').value || '').trim();
      if (!v) { alert("Please enter a custom roll length."); return; }
      rollLength = Number(v);
    } else { rollLength = Number(rollSel); }

    if (!material) { alert("Material is required."); return; }
    if (!priceVal) { alert("Price is required.");    return; }

    data = {
      material, thickness, rollLength,
      rolls:   Number(document.getElementById('add-edge-rolls').value)   || 0,
      onOrder: Number(document.getElementById('add-edge-onorder').value) || 0,
      price:   Number(priceVal)
    };
  }

  bootstrap.Modal.getInstance(document.getElementById('addItemModal')).hide();
  showStatus("Saving...", false);

  const refresh = () => {
    google.script.run.withSuccessHandler(d => {
      stockData = d;
      if (type === 'wood') openWoodStock(false);
      if (type === 'comp') openComponentStock(false);
      if (type === 'edge') openEdgeStock(false);
      showStatus("Item added!", true);
    }).getInventoryData();
  };

  const onError = err => { showStatus("Error", false); alert("Error: " + (err.message || err)); };

  if (type === 'wood') google.script.run.withSuccessHandler(refresh).withFailureHandler(onError).addWoodItem(data);
  if (type === 'comp') google.script.run.withSuccessHandler(refresh).withFailureHandler(onError).addComponentItem(data);
  if (type === 'edge') google.script.run.withSuccessHandler(refresh).withFailureHandler(onError).addEdgeBandItem(data);
}

// --- LIVE SYNC POLL ---

const _POLL_VIEWS = new Set(['view-single-panel', 'view-panels', 'view-comps', 'view-manuf-list', 'view-delivery']);

function startPoll() {
  stopPoll();
  _pollTimer = setTimeout(_doPoll, 30000);
}

function stopPoll() {
  if (_pollTimer) { clearTimeout(_pollTimer); _pollTimer = null; }
}

function _doPoll() {
  _pollTimer = setTimeout(_doPoll, 30000); // always reschedule before the async call

  // Heartbeat + presence refresh on every tick (lightweight cache ops)
  if (currentUser) {
    google.script.run.heartbeatPresence(currentUser);
    google.script.run
      .withSuccessHandler(renderPresence)
      .withFailureHandler(() => {})
      .getActiveUsers();
  }

  // Full data refresh only when in a manufacturing/delivery view with no pending changes
  if (!_POLL_VIEWS.has(currentViewId) || hasPendingChanges()) return;
  google.script.run
    .withSuccessHandler(freshData => {
      if (!freshData || hasPendingChanges()) return;
      _applyPollData(freshData);
    })
    .withFailureHandler(() => {}) // silently ignore poll failures
    .getDataTree();
}

function renderPresence(users) {
  const bar = document.getElementById('presence-bar');
  if (!bar) return;
  if (!Array.isArray(users) || users.length === 0) { bar.innerHTML = ''; return; }
  bar.innerHTML = users.map(name =>

function _applyPollData(freshData) {
  rawData = freshData;

  if (currentViewId === 'view-single-panel' && currentOrder && currentProduct) {
    // Soft-update: only touch inputs the user hasn't dirtied
    const panels = freshData[currentOrder]?.products?.[currentProduct]?.panels || [];
    const colMap = { cut: 'qtyCut', processed: 'qtyProcessed', edgeFinish: 'qtyEdgeFinish', packed: 'qtyPacked' };
    panels.forEach(p => {
      Object.entries(colMap).forEach(([colName, propName]) => {
        if (pendingUpdates[`${p.rowIndex}-${colName}`] || inFlightUpdates[`${p.rowIndex}-${colName}`]) return;
        const el = document.getElementById(`${colName}-${p.rowIndex}`);
        if (el && String(el.value) !== String(p[propName] ?? 0)) el.value = p[propName] ?? 0;
      });
    });
  } else {
    // All other pollable views have no editable inputs — full re-render is safe
    rerenderCurrentView();
  }
}

function renderActionList() {
  const body = document.getElementById('action-list-body');
  if (!body) return;

  const filterAssignee = (document.getElementById('action-filter-assignee') || {}).value || '';
  const showCompleted = _actionTab === 'completed';

  let tasks = actionListData.filter(t => showCompleted ? t.status === 'Completed' : t.status !== 'Completed');
  if (filterAssignee) tasks = tasks.filter(t => t.assignedTo.split(',').map(n => n.trim()).includes(filterAssignee));

  if (!showCompleted) {
    const pOrder = { 'High': 0, 'Medium': 1, 'Low': 2 };
    const sOrder = { 'Not Started': 0, 'In Progress': 1 };
    tasks.sort((a, b) => {
      const pd = (pOrder[a.priority] ?? 3) - (pOrder[b.priority] ?? 3);
      return pd !== 0 ? pd : (sOrder[a.status] ?? 2) - (sOrder[b.status] ?? 2);
    });
  }

  const emptyMsg = showCompleted
    ? `<div style="font-size:2.5rem;">📋</div><div class="fw-bold mt-2">${filterAssignee ? `No completed tasks for ${escHtml(filterAssignee)}` : 'No completed tasks yet'}</div>`
    : `<div style="font-size:2.5rem;">✅</div><div class="fw-bold mt-2">${filterAssignee ? `No open tasks for ${escHtml(filterAssignee)}` : 'No open tasks'}</div><div class="small mt-1">All caught up!</div>`;

  if (tasks.length === 0) {
    body.innerHTML = `<div class="text-center text-muted py-5">${emptyMsg}</div>`;
    return;
  }

  const priorityBadge = p => {
    if (p === 'High')   return '<span class="badge bg-danger">High</span>';
    if (p === 'Medium') return '<span class="badge bg-warning text-dark">Medium</span>';
    if (p === 'Low')    return '<span class="badge bg-success">Low</span>';
    return `<span class="badge bg-secondary">${escHtml(p)}</span>`;
  };
  const statusBadge = s => {
    if (s === 'In Progress') return '<span class="badge bg-primary">In Progress</span>';
    if (s === 'Completed')   return '<span class="badge bg-success">Completed</span>';
    return '<span class="badge bg-secondary">Not Started</span>';
  };

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const parseDMY = str => {
    if (!str) return null;
    const p = str.split('/');
    return p.length === 3 ? new Date(p[2], p[1] - 1, p[0]) : null;
  };

  body.innerHTML = tasks.map(t => {
    const due      = parseDMY(t.dueDate);
    const overdue  = !showCompleted && due && due < today;
    const dueSoon  = !showCompleted && due && !overdue && (due - today) / 864e5 <= 2;
    const dueLine  = due
      ? `<div class="small mt-1 ${overdue ? 'text-danger fw-bold' : dueSoon ? 'text-warning fw-bold' : 'text-muted'}">
           ${overdue ? '⚠️ Overdue — ' : dueSoon ? '⏰ Due soon — ' : ''}Due: ${escHtml(t.dueDate)}
         </div>`
      : '';

    const actionBtns = showCompleted ? '' : `
      <div class="d-flex gap-2 mt-3">
        ${t.status === 'Not Started' ? `<button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="setTaskStatus(${t.rowIndex}, 'In Progress')">▶ Start</button>` : ''}
        <button class="btn btn-success btn-sm rounded-pill px-3 fw-bold" onclick="setTaskStatus(${t.rowIndex}, 'Completed')">✓ Complete</button>
      </div>`;

    return `
      <div class="card border-0 shadow-sm mb-3 p-3 ${showCompleted ? 'opacity-75' : ''}">
        <div class="d-flex justify-content-between align-items-start gap-2">
          <div class="flex-grow-1" style="min-width:0;">
            <div class="fw-bold text-dark mb-1">${escHtml(t.task)}</div>
            <div class="small text-muted">
              👤 <strong>${escHtml(t.assignedTo)}</strong> &nbsp;·&nbsp;
              Assigned by ${escHtml(t.assignedBy)} &nbsp;·&nbsp; ${escHtml(t.date)}
            </div>
            ${dueLine}
          </div>
          <div class="d-flex flex-column align-items-end gap-1 flex-shrink-0">
            ${priorityBadge(t.priority)}
            ${statusBadge(t.status)}
          </div>
        </div>
        ${actionBtns}
      </div>`;
  }).join('');
}

                  return panelMaterial && itemMaterial && (panelMaterial.includes(itemMaterial) || itemMaterial.includes(panelMaterial));

          });

          const productNamesToShow = matchingProductNames.length ? matchingProductNames : Object.keys(products);

          const checkboxContainer = document.getElementById('alloc-product-checkboxes');

  function commitAdjustment() {

  const target = document.getElementById('adj-target') ? document.getElementById('adj-target').value : 'stock';

  let finalReason = selectVal;

  if (isNaN(change) || change === 0) { alert("Please enter a valid quantity (e.g. 10 or -5)."); return; }
  if (!selectVal) { alert("Please select a Reason."); return; }

  if (selectVal === 'Other') {
    const manualText = document.getElementById('adj-reason-manual').value.trim();
    if (!manualText) { alert("Please type a reason in the text box."); return; }
    finalReason = manualText;
  }

  bootstrap.Modal.getInstance(document.getElementById('adjustStockModal')).hide();
  showStatus("Updating...", false);

  const refresh = () => {
    google.script.run.withSuccessHandler(d => {

      if (type === 'wood') openWoodStock(false);
      if (type === 'comp') openComponentStock(false);
      if (type === 'edge') openEdgeStock(false);
      showStatus("Saved", true);
    }).getInventoryData();
  };

  // WOOD
  if (type === 'wood') {
    if (target === 'onorder') {
      google.script.run.withSuccessHandler(refresh).withFailureHandler(err => alert(err.message)).adjustWoodOnOrder(rowIndex, change);
    } else {
      google.script.run.withSuccessHandler(refresh).withFailureHandler(err => alert(err.message)).adjustWoodStock(rowIndex, change, finalReason, currentUser);
    }
    return;
  }

  // EDGE — uses a lightweight refresh that skips the external offcut spreadsheet
  if (type === 'edge') {
    const edgeRefresh = () => {
      google.script.run
        .withSuccessHandler(edgeData => { stockData.edge = edgeData; openEdgeStock(false); showStatus("Saved", true); })
        .withFailureHandler(err => { showStatus('Error', false); alert(err.message || err); })
        .getEdgeInventoryOnly();
    };
    if (target === 'onorder') {
      google.script.run.withSuccessHandler(edgeRefresh).withFailureHandler(err => alert(err.message)).adjustEdgeOnOrder(rowIndex, change);
    } else {
      google.script.run.withSuccessHandler(edgeRefresh).withFailureHandler(err => alert(err.message)).adjustEdgeStock(rowIndex, change, finalReason, currentUser);
    }
    return;
  }

  // COMPONENTS
  if (type === 'comp') {
    if (target === 'onorder') {
      google.script.run.withSuccessHandler(refresh).withFailureHandler(err => alert(err.message)).adjustComponentOnOrder(rowIndex, change);
    } else {
      google.script.run.withSuccessHandler(refresh).withFailureHandler(err => alert(err.message)).adjustComponentStock(rowIndex, change, finalReason, currentUser);
    }
    return;
  }

  alert("Unknown stock type");

  function filterStockByJob() {
  const orderId = currentOrder;
  const bannerSlot = document.getElementById('cnc-filter-banner-slot');
  if (bannerSlot) bannerSlot.innerHTML = "";

  // Safety: if stock not loaded yet
  if (!stockData.wood || !Array.isArray(stockData.wood)) {
    cncWoodViewData = [];
    renderWoodStock(cncWoodViewData, 'cnc');
    return;
  }

  // If no active order context, show all stock
  if (!orderId || !rawData[orderId]) {
    cncWoodViewData = stockData.wood;
    renderWoodStock(cncWoodViewData, 'cnc');
    return;
  }

  // 1) Materials needed for this job (from panels)
  const requiredMaterials = new Set();

  if (rawData[orderId] && rawData[orderId].products) {
    const products = rawData[orderId].products;
    for (const productKey in products) {
      if (products[productKey].panels) {
        products[productKey].panels.forEach(p => {
          if (p.material) {
            const mat = String(p.material).trim().toLowerCase();
            if (mat.length > 2) requiredMaterials.add(mat);
          }
        });
      }
    }
  }

  const reqArray = Array.from(requiredMaterials);

  // 2) Filter wood stock by material match
  const filteredList = stockData.wood.filter(item => {
    const stockMat = String(item.material).trim().toLowerCase();
    if (stockMat.length < 2) return false;

    return reqArray.some(req => stockMat.includes(req) || req.includes(stockMat));
  });

  // 3) Render + banner
  if (filteredList.length > 0) {
    cncWoodViewData = filteredList;
    renderWoodStock(cncWoodViewData, 'cnc');

    if (bannerSlot) {
      bannerSlot.innerHTML = `
        <div class="alert alert-success py-2 mb-2 small shadow-sm">
          Found ${filteredList.length} items for <strong>${rawData[orderId].customer}</strong>
        </div>`;
    }
  } else {
    cncWoodViewData = stockData.wood;
    renderWoodStock(cncWoodViewData, 'cnc');

    if (bannerSlot) {
      bannerSlot.innerHTML = `
        <div class="alert alert-warning py-2 mb-2 small shadow-sm">
          <strong>No Match Found!</strong> Showing all stock.<br>
          Job Needs: "<em>${reqArray.join(', ')}</em>"
        </div>`;
    }
  }
}

  if (listEl) listEl.innerHTML = `<div class="text-center text-muted py-4"><div class="spinner-border"></div></div>`;

  let _rows = null, _surplus = {}, _rowsDone = false, _surplusDone = false;

    setOrderPendingIndicator(summarizePendingOrders(_rows));
    renderShopifyOrdersModal(_rows, _surplus);
  };

  google.script.run
    .withSuccessHandler(rows => {

        .withSuccessHandler(s => { _surplus = s || {}; _surplusDone = true; tryRender(); })

        .getSurplusSummaryBySkus(skus);

function renderShopifyOrdersModal(rows, surplusSummary) {
  const listEl = document.getElementById("shopify-orders-list");
  if (!listEl) return;

  if (!rows.length) {
    listEl.innerHTML = `<div class="text-muted text-center py-3">No pending orders.</div>`;

    // Auto-close if nothing left
    if (shopifyOrdersModalInst) {
      setTimeout(() => shopifyOrdersModalInst.hide(), 600);
    }
    reloadAllData();
    return;
  }

  // Group by orderId + customer
  const groups = {};
  rows.forEach(r => {
    const key = `${r.orderId}|||${r.customer}`;
    if (!groups[key]) groups[key] = { orderId: r.orderId, customer: r.customer, lines: [] };
    groups[key].lines.push(r);
  });

  const keys = Object.keys(groups).sort((a,b) => {
    const A = groups[a], B = groups[b];
    return String(B.orderId).localeCompare(String(A.orderId)); // newest first
  });

  const esc = (s) => String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  const accordId = "shopify-orders-accordion";
  let html = `<div class="accordion" id="${accordId}">`;

  keys.forEach((k, idx) => {
    const g = groups[k];
    const lines = g.lines;

    const collapseId = `so-collapse-${idx}`;
    const headingId = `so-heading-${idx}`;

    // Totals for header (clear and unambiguous)
    const totalOrdered = lines.reduce((s, r) => s + (Number(r.qtyOrdered) || 0), 0);
    const totalAllocated = lines.reduce((s, r) => s + (Number(r.allocatedFromStock) || 0), 0);
    const totalToBuild = Math.max(0, totalOrdered - totalAllocated);

    const noteList = Array.from(new Set(lines.map(r => norm(r.notes)).filter(Boolean)));
    const notesHtml = noteList.length
      ? `<div class="alert alert-light border small text-secondary mb-3"><strong class="text-dark">Notes:</strong><div class="mt-1" style="white-space:pre-wrap;">${noteList.map(note => esc(note)).join('<hr class="my-2">')}</div></div>`
      : "";

    const pendingRowIndices = lines
      .filter(r => Math.max(0, (Number(r.qtyOrdered) || 0) - (Number(r.allocatedFromStock) || 0)) > 0)
      .map(r => Number(r.rowIndex));
    const allDone = pendingRowIndices.length === 0;

    const rowsHtml = lines.map(r => {
      const rowIndex = Number(r.rowIndex);
      const ordered = Number(r.qtyOrdered) || 0;
      const inStock = Number(r.availableInStock) || 0;
      const allocated = Number(r.allocatedFromStock) || 0;
      const toBuild = Math.max(0, ordered - allocated);
      const suggested = Number(r.recommendedAllocate) || 0;

      const busy = shopifyBusyRows.has(rowIndex);
      const disableAlloc = busy || (inStock <= 0) || (toBuild <= 0);
      const disableApprove = busy;

      const skuUpper = (r.sku || '').toUpperCase();
      const surplusQty = (surplusSummary && surplusSummary[skuUpper]) || 0;

      return `
        <tr style="${busy ? "opacity:0.6;" : ""}">
          <td>
            <div class="fw-bold">${esc(r.productName)}</div>
            <div class="small text-muted">SKU ${esc(r.sku)}</div>

            <div class="small mt-1">
              <span class="badge bg-dark me-1">Ordered ${ordered}</span>
              <span class="badge bg-primary me-1">Allocated ${allocated}</span>
              <span class="badge bg-warning text-dark">To Build ${toBuild}</span>
            </div>

            ${surplusQty > 0 ? `<div class="small mt-2" style="color:#00B0E9;font-weight:600;">♻️ ${surplusQty} surplus panel(s) available — import first, then use <em>Allocate Panels</em> on the project dashboard</div>` : ''}

            <div class="small text-muted mt-2">
              ✅ Approve will <strong>import the full order</strong> but will <strong>pre-fill progress</strong> for the Allocated qty.
            </div>
          </td>

          <td class="text-center">
            <span class="badge ${inStock > 0 ? "bg-success" : "bg-secondary"}">${inStock}</span>
          </td>

          <td class="text-end" style="white-space:nowrap;">
            <div class="d-flex gap-1 justify-content-end flex-wrap">
              <button class="btn btn-outline-dark btn-sm rounded-pill"
                      onclick="approveShopifyLine(${rowIndex}, this)"
                      ${disableApprove ? "disabled" : ""}>
                Import (Build ${toBuild})
              </button>

              <button class="btn btn-dark btn-sm rounded-pill"
                      onclick="allocateShopifyLine(${rowIndex}, ${inStock}, ${toBuild}, ${suggested})"
                      ${disableAlloc ? "disabled" : ""}>
                Allocate Stock
              </button>
            </div>
          </td>
        </tr>
      `;
    }).join("");

    html += `
      <div class="accordion-item border-0 mb-2 room-acc">
        <h2 class="accordion-header" id="${headingId}">
          <div class="d-flex align-items-center gap-2">
            <button class="accordion-button collapsed room-acc-btn flex-grow-1"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#${collapseId}"
                  aria-expanded="false"
                  aria-controls="${collapseId}">
              <div class="d-flex w-100 justify-content-between align-items-center">
                <div class="fw-bold text-dark">${esc(g.customer)} — #${esc(g.orderId)}</div>
                <div class="d-flex gap-2 flex-wrap justify-content-end align-items-center">
                  <span class="badge bg-dark">Ordered ${totalOrdered}</span>
                  <span class="badge bg-primary">Allocated ${totalAllocated}</span>
                  <span class="badge bg-warning text-dark">To Build ${totalToBuild}</span>
                </div>
              </div>
            </button>
            <div class="d-flex gap-1 flex-shrink-0">
              <button class="btn btn-outline-dark btn-sm rounded-pill"
                      type="button"
                      onclick='openSmartOrder(${jsStr(g.orderId)})'>
                🧠 Smart Order
              </button>
              <button class="btn btn-success btn-sm rounded-pill"
                      type="button"
                      onclick='importAllForOrder(${JSON.stringify(pendingRowIndices)})'
                      ${allDone ? "disabled" : ""}>
                Import All (${pendingRowIndices.length})
              </button>
            </div>
          </div>
        </h2>

        <div id="${collapseId}" class="accordion-collapse collapse"
             aria-labelledby="${headingId}"
             data-bs-parent="#${accordId}">
          <div class="accordion-body pt-2">
            ${notesHtml}
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                  <tr class="text-secondary small">
                    <th>SKU / Breakdown</th>
                    <th class="text-center" style="width:120px;">In Stock</th>
                    <th class="text-end" style="width:260px;">Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>

            <div class="small text-muted mt-2">
              You can close this anytime and continue later — imported lines disappear automatically.
            </div>
          </div>
        </div>
      </div>
    `;
  });

  html += `</div>`;
  listEl.innerHTML = html;
}

  setSmartOrderExportState(false, "Exporting…");

  google.script.run
    .withSuccessHandler(result => {

        || lowerMsg.includes("access") || lowerMsg.includes("permission")
        || lowerMsg.includes("oauth");
      const hintHtml = authHint
        ? `<div class="alert alert-warning mt-3">

            run <code>authorizeSmartOrderAccess</code> once, and complete the Google authorization flow.

        : "";

function allocateShopifyLine(shopifyRowIndex, inStock, remainingToAllocate, suggested) {
  const maxAlloc = Math.min(Number(inStock) || 0, Number(remainingToAllocate) || 0);
  if (maxAlloc <= 0) { alert("No stock available to allocate for this line."); return; }

  const def = Math.min(Number(suggested) || maxAlloc, maxAlloc);
  const entered = prompt(`Allocate how many from stock now? (1-${maxAlloc})`, String(def));
  if (entered === null) return;

  const qty = parseInt(entered, 10);
  if (!qty || qty < 1 || qty > maxAlloc) { alert("Invalid quantity."); return; }

  shopifyBusyRows.add(shopifyRowIndex);
  showStatus("Allocating...", false);

  google.script.run
    .withSuccessHandler(() => {
      showStatus("Allocated!", true);
      shopifyBusyRows.delete(shopifyRowIndex);

      // refresh stock + orders list + app UI
      refreshShopifyOrdersModal();
      reloadAllData();
    })
    .withFailureHandler(err => {
      shopifyBusyRows.delete(shopifyRowIndex);
      alert("Allocation failed: " + err.message);
      showStatus("Error", true);
      refreshShopifyOrdersModal();
    })
    .allocateFinishedGoodsToOrder(shopifyRowIndex, qty);
}

function chooseShopifyMergeTarget(context) {
  const safe = context || {};
  const customer = norm(safe.customer) || 'This customer';
  const existingTargetId = norm(safe.existingMergeTargetId);
  const candidates = Array.isArray(safe.candidates) ? safe.candidates : [];

  const getCandidateLabel = (candidate) => Array.isArray(candidate?.displayOrderIds) && candidate.displayOrderIds.length
    ? candidate.displayOrderIds.join(' & ')
    : norm(candidate?.targetOrderId);

  if (existingTargetId) {
    const existingCandidate = candidates.find(candidate => norm(candidate.targetOrderId) === existingTargetId)
      || { targetOrderId: existingTargetId, displayOrderIds: [existingTargetId] };
    const label = getCandidateLabel(existingCandidate);
    const keepMerged = confirm(
      `This Shopify order is already linked to existing order #${label}.

` +
      `Press OK to keep importing it into #${label}, or Cancel to stop this import.`
    );
    return keepMerged ? existingTargetId : null;
  }

  if (!candidates.length) return "";

  if (candidates.length === 1) {
    const label = getCandidateLabel(candidates[0]);
    const shouldMerge = confirm(
      `${customer} already has an active manufacturing order (#${label}).

` +
      `Press OK to merge this into order #${label}, or Cancel to keep it as a separate order.`
    );
    return shouldMerge ? norm(candidates[0].targetOrderId) : "";
  }

  const options = ['0. Keep as a separate order'];
  candidates.forEach((candidate, idx) => {
    options.push(`${idx + 1}. Merge with existing order #${getCandidateLabel(candidate)}`);
  });

  const promptText = [
    `${customer} already has active manufacturing orders.`,
    '',
    ...options,
    '',
    'Enter the number of your choice:'
  ].join('\n');

  const entered = prompt(promptText, '0');
  if (entered === null) return null;

  const choice = parseInt(entered, 10);
  if (Number.isNaN(choice) || choice < 0 || choice > candidates.length) {
    alert('Invalid choice. Import cancelled.');
    return null;
  }

  return choice === 0 ? '' : norm(candidates[choice - 1].targetOrderId);
}

function approveShopifyLine(shopifyRowIndex, btnElement) {
  if (!confirm("Approve & import this line into Manufacturing/Delivery now?")) return;

  if (btnElement) {
    btnElement.disabled = true;
    btnElement.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Importing...';
  }

  shopifyBusyRows.add(shopifyRowIndex);
  showStatus("Checking merge options...", false);

  const resetButton = (label = "Import (Build)") => {
    if (!btnElement) return;
    btnElement.disabled = false;
    btnElement.innerText = label;
  };

  google.script.run
    .withSuccessHandler(context => {
      const mergeTargetOrderId = chooseShopifyMergeTarget(context);
      if (mergeTargetOrderId === null) {
        shopifyBusyRows.delete(shopifyRowIndex);
        showStatus("Cancelled", true);
        resetButton();
        return;
      }

      showStatus("Importing...", false);
      google.script.run
        .withSuccessHandler(res => {
          shopifyBusyRows.delete(shopifyRowIndex);

          if (!String(res).startsWith("SUCCESS") && String(res) !== "Already imported") {
            alert("Import result: " + res);
            resetButton('Retry Import');
            return;
          }

          const importedMsg = String(res).startsWith('SUCCESS|MERGED|')
            ? `Imported and merged into Order #${String(res).split('|')[2]}.`
            : 'Imported!';
          showStatus(importedMsg, true);
          refreshShopifyOrdersModal();
          reloadAllData();
        })
        .withFailureHandler(err => {
          shopifyBusyRows.delete(shopifyRowIndex);
          alert("Approve/Import failed: " + err.message);
          showStatus("Error", true);
          resetButton('Import (Retry)');
        })
        .approveAndImportShopifyRow(shopifyRowIndex, mergeTargetOrderId || "");
    })
    .withFailureHandler(err => {
      shopifyBusyRows.delete(shopifyRowIndex);
      alert("Could not check merge options: " + err.message);
      showStatus("Error", true);
      resetButton('Import (Retry)');
    })
    .getShopifyMergeOptions(shopifyRowIndex);
}


function importAllForOrder(rowIndices) {
  const pending = (rowIndices || []).filter(ri => !shopifyBusyRows.has(ri));
  if (pending.length === 0) {
    showStatus("Nothing left to import.", true);
    return;
  }

  if (!confirm(`Import all ${pending.length} line(s) for this order?\nThis will add all pending products to the Hub.`)) return;

  showStatus("Checking import options...", false);

  // Get merge context once (using first row), apply same answer to all lines
  google.script.run
    .withSuccessHandler(context => {
      const mergeTargetOrderId = chooseShopifyMergeTarget(context);
      if (mergeTargetOrderId === null) {
        showStatus("Cancelled.", true);
        return;
      }
      importNextInBatch(pending, 0, mergeTargetOrderId, 0);
    })
    .withFailureHandler(err => {
      alert("Could not check merge options: " + err.message);
      showStatus("Error", true);
    })
    .getShopifyMergeOptions(pending[0]);
}

function importNextInBatch(rowIndices, idx, mergeTargetOrderId, successCount) {
  if (idx >= rowIndices.length) {
    showStatus(`Done! Imported ${successCount} of ${rowIndices.length} line(s).`, true);
    refreshShopifyOrdersModal();
    reloadAllData();
    return;
  }

  const rowIndex = rowIndices[idx];
  shopifyBusyRows.add(rowIndex);
  showStatus(`Importing ${idx + 1} of ${rowIndices.length}...`, false);

  google.script.run
    .withSuccessHandler(res => {
      shopifyBusyRows.delete(rowIndex);
      const ok = String(res).startsWith("SUCCESS") || String(res) === "Already imported";
      if (!ok) alert(`Import result for line ${idx + 1}: ${res}`);
      importNextInBatch(rowIndices, idx + 1, mergeTargetOrderId, successCount + (ok ? 1 : 0));
    })
    .withFailureHandler(err => {
      shopifyBusyRows.delete(rowIndex);
      alert(`Import error on line ${idx + 1}: ${err.message}`);
      importNextInBatch(rowIndices, idx + 1, mergeTargetOrderId, successCount);
    })
    .approveAndImportShopifyRow(rowIndex, mergeTargetOrderId || "");
}

  function mergeWorkshopStockOrders() {
  const wsKey = "WORKSHOP";
  const ws = {
    id: wsKey,
    customer: "Workshop Stock",
    products: {},
    delivery: { bucket: {}, rooms: {} },
    memberOrderIds: [],
    displayOrderIds: [wsKey],
    mergeTargetOrderId: wsKey,
    isMerged: false
  };

  const keys = Object.keys(rawData || {});
  const toRemove = [];

  keys.forEach(orderId => {
    const o = rawData[orderId];
    if (!o) return;

    if (norm(o.customer).toLowerCase() === "workshop stock") {
      toRemove.push(orderId);
      ws.memberOrderIds = Array.from(new Set([...(ws.memberOrderIds || []), ...(o.memberOrderIds || [orderId])].map(id => norm(id)).filter(Boolean)));

      for (const prodKey in (o.products || {})) {
        if (!ws.products[prodKey]) ws.products[prodKey] = { panels: [], components: [], sourceOrderIds: [] };

        const src = o.products[prodKey];
        if (src.panels && src.panels.length) ws.products[prodKey].panels.push(...src.panels);
        if (src.components && src.components.length) ws.products[prodKey].components.push(...src.components);
        ws.products[prodKey].sourceOrderIds = Array.from(new Set([
          ...(ws.products[prodKey].sourceOrderIds || []),
          ...((src && src.sourceOrderIds) || [orderId])
        ].map(id => norm(id)).filter(Boolean)));
      }
    }
  });

  toRemove.forEach(k => delete rawData[k]);

  if (Object.keys(ws.products).length) rawData[wsKey] = ws;
}

function getCompByRow(rowIndex) {
  const comps = rawData[currentOrder].products[currentProduct].components || [];
  return comps.find(c => c.rowIndex === rowIndex);

// NEW HELPER: Find component anywhere (Global Search)
function findComponentGlobally(rowIndex) {
  if (!rawData) return null;
  // Search every order -> every product -> every component list
  for (const ord of Object.values(rawData)) {
    if (!ord.products) continue;
    for (const prod of Object.values(ord.products)) {
      if (prod.components) {
        const found = prod.components.find(c => String(c.rowIndex) === String(rowIndex));
        if (found) return found;
      }
    }
  }
  return null;
}

function queueCompDelta(rowIndex, delta) {
  const key = String(rowIndex);

  if (!pendingCompUpdates[key]) {
    pendingCompUpdates[key] = {
      rowIndex,
      mode: "inc",
      delta: 0,
      opId: makeOpId(),
      ts: Date.now()
    };
  }

  // If a SET is already queued, don’t switch modes; just adjust the target
  if (pendingCompUpdates[key].mode === "set") {
    pendingCompUpdates[key].value = Number(pendingCompUpdates[key].value || 0) + Number(delta || 0);
  } else {
    pendingCompUpdates[key].delta = Number(pendingCompUpdates[key].delta || 0) + Number(delta || 0);
  }

  pendingCompUpdates[key].ts = Date.now();
  showStatus("Saving...", false);
  markUnsaved();

  if (compSaveTimer) clearTimeout(compSaveTimer);
  compSaveTimer = setTimeout(sendCompQueueToServer, 400);
}

function queueCompSet(rowIndex, base, value) {
  const key = String(rowIndex);

  pendingCompUpdates[key] = {
    rowIndex,
    mode: "set",
    base: Number(base || 0),
    value: Number(value || 0),
    opId: makeOpId(),
    ts: Date.now()
  };

  showStatus("Saving...", false);
  markUnsaved();

  if (compSaveTimer) clearTimeout(compSaveTimer);
  compSaveTimer = setTimeout(sendCompQueueToServer, 400);
}


function sendCompQueueToServer() {
  if (compSaveInFlight) {
    if (compSaveTimer) clearTimeout(compSaveTimer);
    compSaveTimer = setTimeout(sendCompQueueToServer, 300);
    return;
  }

  const sending = pendingCompUpdates || {};
  const payload = Object.values(sending);

  if (!payload.length) {
    clearUnsavedIfEmptyQueues();
    return;
  }

  inFlightCompUpdates = sending;
  pendingCompUpdates = {};

  compSaveInFlight = true;
  showStatus("Saving.", false);

  google.script.run
    .withSuccessHandler((res) => {
      compSaveInFlight = false;

      if (!Array.isArray(res)) {
        for (const k in inFlightCompUpdates) if (!pendingCompUpdates[k]) pendingCompUpdates[k] = inFlightCompUpdates[k];
        inFlightCompUpdates = {};
        markUnsaved("Not saved: unexpected server response.");
        showStatus("Not saved", true);
        return;
      }

      res.forEach(r => {
        const key = String(r.rowIndex);
        delete inFlightCompUpdates[key];

        if (r.conflict) {
          // Re-queue what we attempted if there’s no newer edit already
          if (!pendingCompUpdates[key]) pendingCompUpdates[key] = sending[key];
          markUnsaved("Conflict: someone else updated components. Reload & retry.");
          return;
        }

        if (r.outOfStock) {
          const available = (r.available !== undefined) ? ` Available: ${r.available}.` : "";
          alert(`Out of stock for this component.${available}`);
          const el = document.getElementById(`comp-packed-${r.rowIndex}`);
          if (el && r.current !== undefined) el.value = r.current;

          const c = getCompByRow(r.rowIndex);
          if (c && r.current !== undefined) c.qtyPacked = r.current;
          return;
        }

        // If user changed again while saving, don't overwrite UI
        if (pendingCompUpdates[key]) return;

        const el = document.getElementById(`comp-packed-${r.rowIndex}`);
        if (el && r.value !== undefined) el.value = r.value;

        const c = getCompByRow(r.rowIndex);
        if (c && r.value !== undefined) c.qtyPacked = r.value;
      });

      if (Object.keys(pendingCompUpdates).length > 0) {
        if (compSaveTimer) clearTimeout(compSaveTimer);
        compSaveTimer = setTimeout(sendCompQueueToServer, 0);
        markUnsaved();
        return;
      }

      clearUnsavedIfEmptyQueues();
      showStatus("Saved", true);
    })
    .withFailureHandler((err) => {
      compSaveInFlight = false;
      setHealthBadge(false);

      for (const k in inFlightCompUpdates) if (!pendingCompUpdates[k]) pendingCompUpdates[k] = inFlightCompUpdates[k];
      inFlightCompUpdates = {};

      markUnsaved("Not saved (connection/server issue).");
      showStatus("Not saved", true);
      console.log("Component save failed:", err);
    })
    .processComponentBatch(payload, currentUser);
}



function compStep(e, rowIndex, dir) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const c = getCompByRow(rowIndex);
  if (!c) return;

  const per = Number(c.qtyPerUnit) || 1;
  const req = Number(c.qtyRequired) || 0;
  const cur = Number(c.qtyPacked) || 0;

  let next = cur + (dir * per);
  if (next < 0) next = 0;
  if (req > 0 && next > req) next = req;

  c.qtyPacked = next;

  const input = document.getElementById('comp-packed-' + rowIndex);
  if (input) input.value = next;

  queueCompDelta(rowIndex, next - cur);

}

function compSetExact(e, rowIndex, rawVal) {
  if (e) { e.stopPropagation(); }

  const c = getCompByRow(rowIndex);
  if (!c) return;

  const req = Number(c.qtyRequired) || 0;
  const cur = Number(c.qtyPacked) || 0;

  let next = parseInt(rawVal, 10);
  if (isNaN(next)) next = 0;

  if (next < 0) next = 0;
  if (req > 0 && next > req) next = req;

  c.qtyPacked = next;
  queueCompSet(rowIndex, cur, next);
}


function calcPanelGate(prodData, requiredUnits) {
  const panels = (prodData && prodData.panels) ? prodData.panels : [];
  let minUnits = Infinity;
  let limiter = null;

  const lines = panels.map(p => {
    const per = Number(p.qtyPerUnit) || 1;
    const packed = Number(p.qtyPacked) || 0;
    const required = Number(p.qtyOrder) || 0;
    const units = Math.floor(packed / per);

    if (units < minUnits) {
      minUnits = units;
      limiter = { name: p.panelName, packed, required, per, units };
    }

    return { type: "Panel", name: p.panelName, packed, required, per, units };
  });

  if (minUnits === Infinity) minUnits = 0;
  const ready = Math.min(minUnits, requiredUnits);

  return { ready, limiter, lines };
}

function calcCompGate(prodData, requiredUnits) {
  const comps = (prodData && prodData.components) ? prodData.components : [];
  let minUnits = Infinity;
  let limiter = null;

  const lines = comps.map(c => {
    const per = Number(c.qtyPerUnit) || 1;
    const packed = Number(c.qtyPacked) || 0;
    const required = Number(c.qtyRequired) || 0;
    const units = Math.floor(packed / per);

    if (units < minUnits) {
      minUnits = units;
      limiter = { name: c.compName, packed, required, per, units };
    }

    return { type: "Component", name: c.compName, packed, required, per, units };
  });

  // If no components exist, treat as "not limiting"
  if (minUnits === Infinity) minUnits = 999999;
  const ready = Math.min(minUnits, requiredUnits);

  return { ready, limiter, lines };
}

function openGateModal(evt, prodName) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }

  const orderObj = rawData[currentOrder];
  if (!orderObj || !orderObj.products || !orderObj.products[prodName]) return;

  const prodData = orderObj.products[prodName];

  // Required units for this product
  const del = getDeliveryTotals(orderObj, prodName);
  const requiredUnits = getRequiredUnits(prodData, del.total);

  const panelGate = calcPanelGate(prodData, requiredUnits);
  const compGate = calcCompGate(prodData, requiredUnits);

  // Build stock lookup by item code and name
  const compStockLookup = {};
  (stockData && stockData.components || []).forEach(item => {
    if (item.itemCode) compStockLookup[item.itemCode.toLowerCase()] = Number(item.stock) || 0;
    if (item.name) {
      const nk = item.name.toLowerCase();
      if (!(nk in compStockLookup)) compStockLookup[nk] = Number(item.stock) || 0;
    }
  });

  // All blockers (panels + components below threshold)
  const blockers = []
    .concat(panelGate.lines, compGate.lines)
    .filter(x => x.units < requiredUnits)
    .sort((a, b) => a.units - b.units);

  // UI text
  document.getElementById("gateTitle").innerText = `${prodName} (Req: ${requiredUnits})`;

  const panelLine = panelGate.limiter
    ? `${panelGate.ready} / ${requiredUnits} (limiting: ${panelGate.limiter.name})`
    : `${panelGate.ready} / ${requiredUnits}`;

  const compLine = compGate.limiter && compGate.ready < requiredUnits
    ? `${compGate.ready} / ${requiredUnits} (limiting: ${compGate.limiter.name})`
    : `${compGate.ready} / ${requiredUnits}${(prodData.components && prodData.components.length) ? "" : " (no components tracked)"}`;

  // Full component breakdown
  const compRows = (prodData.components || []).map(c => {
    const per = Number(c.qtyPerUnit) || 1;
    const packed = Number(c.qtyPacked) || 0;
    const required = Number(c.qtyRequired) || 0;
    const units = Math.floor(packed / per);
    const ok = units >= requiredUnits;
    const skuKey = (c.sku || '').toLowerCase();
    const nameKey = (c.compName || '').toLowerCase();
    const avail = (skuKey && skuKey in compStockLookup)
      ? compStockLookup[skuKey]
      : (nameKey in compStockLookup ? compStockLookup[nameKey] : null);
    const availText = avail !== null ? `Stock: ${avail}` : 'Stock: —';
    return `
      <div class="d-flex align-items-center justify-content-between border rounded-3 p-2 mb-1 ${ok ? 'bg-light' : ''}">
        <div>
          <div class="fw-semibold small">${escHtml(c.compName || '')}${c.sku ? ` <span class="text-muted fw-normal">(${escHtml(c.sku)})</span>` : ''}</div>
          <div class="small text-muted">Packed ${packed} / Need ${required} &nbsp;·&nbsp; ${per} per unit</div>
        </div>
        <div class="text-end small ms-2">
          <div class="${ok ? 'text-success fw-bold' : 'text-danger fw-bold'}">${units} units</div>
          <div class="text-muted">${availText}</div>
        </div>
      </div>
    `;
  }).join('');

  let blockersHtml = "";
  if (!blockers.length) {
    blockersHtml = `<div class="text-success fw-bold">✅ No blockers — fully manufactured</div>`;
  } else {
    blockersHtml = blockers.map(b => {
      const label = (b.type === "Panel") ? "Panel" : "Component";
      return `
        <div class="border rounded-3 p-2 mb-2 border-danger">
          <div class="fw-bold text-danger">${label}: ${escHtml(b.name)}</div>
          <div class="small text-muted">
            Packed ${b.packed} / Required ${b.required} &nbsp;·&nbsp; ${b.units} unit(s) complete
          </div>
        </div>
      `;
    }).join("");
  }

  document.getElementById("gateBody").innerHTML = `
    <div class="mb-3">
      <div class="fw-bold">Panels ready:</div>
      <div class="text-muted">${panelLine}</div>
    </div>

    <div class="mb-3">
      <div class="fw-bold">Components ready:</div>
      <div class="text-muted">${compLine}</div>
    </div>

    <hr>

function findProductKey(orderId, productName) {
  const orderObj = rawData[orderId];
  if (!orderObj || !orderObj.products) return null;

  const target = norm(productName);
  for (const key in orderObj.products) {
    if (norm(key) === target) return key;
  }
  return null;
}

function getCutUnits(prodData) {
  let minUnits = Infinity;
  const panels = (prodData && prodData.panels) ? prodData.panels : [];

  if (!panels.length) return 0;

  panels.forEach(p => {
    const per = Number(p.qtyPerUnit) || 1;
    const cut = Number(p.qtyCut) || 0;
    const units = Math.floor(cut / per);
    if (units < minUnits) minUnits = units;
  });

  if (minUnits === Infinity) return 0;
  return minUnits;
}

function panelMatchesMaterial(panel, allocatedMaterial) {
  if (!allocatedMaterial) return true; // no filter if material unknown
  const pm = String(panel?.material || '').trim().toLowerCase();
  const am = String(allocatedMaterial || '').trim().toLowerCase();
  return pm && am && (pm.includes(am) || am.includes(pm));
}

function updateCncCutSummary() {
  if (!cncCutCtx) return;

  const orderObj = rawData[cncCutCtx.orderId];
  const lines = cncCutCtx.products.map(({ productKey, prodData }) => {
    const del = getDeliveryTotals(orderObj, productKey);
    const requiredUnits = getRequiredUnits(prodData, del.total);
    const cutUnits = Math.min(getCutUnits(prodData), requiredUnits);
    return `${productKey}: ${cutUnits}/${requiredUnits}`;
  });

  const el = document.getElementById("cncCutSummary");
  if (el) el.innerText = lines.join(' | ');
}

function cncCutAdd(rowIndex, inc) {
  if (!cncCutCtx) return;

  // Search across all products in the current session
  let p = null;
  for (const prod of cncCutCtx.products) {
    p = (prod.prodData.panels || []).find(x => Number(x.rowIndex) === Number(rowIndex));
    if (p) break;
  }
  if (!p) return;

  const req = Number(p.qtyOrder) || 0;
  const cur = Number(p.qtyCut) || 0;

  // Safety: you can't set Cut below any later stage
  const minAllowed = Math.max(
    Number(p.qtyProcessed) || 0,
    Number(p.qtyEdgeFinish) || 0,
    Number(p.qtyPacked) || 0
  );

  let next = cur + (Number(inc) || 0);

  if (next > req) {
    showStatus("Max reached", true);
    return;
  }

  if (next < minAllowed) {
    showStatus("Blocked: reduce later stages first", true);
    return;
  }

  if (next < 0) next = 0;

  // update local model
  p.qtyCut = next;

  // update UI for that row
  const cutEl = document.getElementById("cnc-cut-" + rowIndex);
  const remEl = document.getElementById("cnc-rem-" + rowIndex);
  if (cutEl) cutEl.innerText = next;
  if (remEl) remEl.innerText = Math.max(0, req - next);

  updateCncCutSummary();

  // queue save
  const key = `${rowIndex}-cut`;
if (!pendingCncCutUpdates[key]) {
  pendingCncCutUpdates[key] = {
    rowIndex,
    colName: "cut",
    base: cur,
    delta: 0,
    opId: makeOpId(),
    ts: Date.now()
  };
}
pendingCncCutUpdates[key].delta = Number(pendingCncCutUpdates[key].delta || 0) + Number(inc || 0);
pendingCncCutUpdates[key].ts = Date.now();

showStatus("Saving...", false);
markUnsaved();

if (cncSaveTimer) clearTimeout(cncSaveTimer);
cncSaveTimer = setTimeout(sendCncCutQueueToServer, 500);

}


function cncMarkPanelCut(rowIndex) {
  if (!cncCutCtx) return;

  let p = null;
  for (const prod of cncCutCtx.products) {
    p = (prod.prodData.panels || []).find(x => Number(x.rowIndex) === Number(rowIndex));
    if (p) break;
  }
  if (!p) return;

  const req = Number(p.qtyOrder) || 0;
  const cur = Number(p.qtyCut) || 0;
  const rem = req - cur;

  if (rem <= 0) { showStatus("Already fully cut", true); return; }

  cncCutAdd(rowIndex, rem);
}

function sendCncCutQueueToServer() {
  if (cncSaveInFlight) {
    if (cncSaveTimer) clearTimeout(cncSaveTimer);
    cncSaveTimer = setTimeout(sendCncCutQueueToServer, 300);
    return;
  }

  const sending = pendingCncCutUpdates || {};
  const payload = Object.values(sending);

  if (!payload.length) {
    clearUnsavedIfEmptyQueues();
    return;
  }

  inFlightCncCutUpdates = sending;
  pendingCncCutUpdates = {};

  cncSaveInFlight = true;
  showStatus("Saving.", false);

  google.script.run
    .withSuccessHandler((res) => {
      cncSaveInFlight = false;

      if (!Array.isArray(res)) {
        for (const k in inFlightCncCutUpdates) if (!pendingCncCutUpdates[k]) pendingCncCutUpdates[k] = inFlightCncCutUpdates[k];
        inFlightCncCutUpdates = {};
        markUnsaved("Not saved: unexpected server response.");
        showStatus("Not saved", true);
        return;
      }

      res.forEach(r => {
        const key = `${r.rowIndex}-cut`;
        delete inFlightCncCutUpdates[key];

        if (pendingCncCutUpdates[key]) return; // newer click exists

        const el = document.getElementById(`cnc-cut-${r.rowIndex}`);
        if (el && r.value !== undefined) el.innerText = r.value;

        let p = null;
        if (cncCutCtx) {
          for (const prod of cncCutCtx.products) {
            p = (prod.prodData.panels || []).find(x => String(x.rowIndex) === String(r.rowIndex));
            if (p) break;
          }
        }
        if (p && r.value !== undefined) p.qtyCut = r.value;
      });

      if (Object.keys(pendingCncCutUpdates).length > 0) {
        if (cncSaveTimer) clearTimeout(cncSaveTimer);
        cncSaveTimer = setTimeout(sendCncCutQueueToServer, 0);
        markUnsaved();
        return;
      }

      clearUnsavedIfEmptyQueues();
      showStatus("Saved", true);
    })
    .withFailureHandler((err) => {
      cncSaveInFlight = false;
      setHealthBadge(false);

      for (const k in inFlightCncCutUpdates) if (!pendingCncCutUpdates[k]) pendingCncCutUpdates[k] = inFlightCncCutUpdates[k];
      inFlightCncCutUpdates = {};

      markUnsaved("Not saved (connection/server issue).");
      showStatus("Not saved", true);
      console.log("CNC save failed:", err);
    })
    .processBatch(payload);
}

  // --- BARCODE SCANNER LISTENER ---
  let scanBuffer = "";
  let scanTimer = null;

  document.addEventListener('keydown', (e) => {
    // 1. If we are typing in a search box, don't interfere (unless it's Enter)
    const activeTag = document.activeElement.tagName;
    if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') {
        if (e.key === 'Enter') {
            // If the user hit Enter in a search box, they might be scanning into it.
            // We grab the value, process it, and clear the input.
            const val = document.activeElement.value.trim();
            if (val.length > 5) { // Assuming barcodes are long
                processBarcode(val);
                document.activeElement.value = ""; 
                document.activeElement.blur(); // Unfocus
            }
        }
        return; 
    }

    // 2. Buffer the keystrokes
    if (e.key === 'Enter') {
      if (scanBuffer.length > 3) {
        processBarcode(scanBuffer);
      }
      scanBuffer = "";
    } else {
      // Ignore control keys (Shift, Ctrl, etc.)
      if (e.key.length === 1) {
        scanBuffer += e.key;
      }
    }

    // 3. Clear buffer if typing is too slow (manual typing vs scanner speed)
    if (scanTimer) clearTimeout(scanTimer);
    scanTimer = setTimeout(() => { scanBuffer = ""; }, 300); // 300ms timeout
  });

  function processBarcode(scannedId) {
    showStatus("Scanning...", false);
    
    // Clean the scan (some scanners add spaces or special chars)
    scannedId = scannedId.trim();

    // --- SEARCH ALGORITHM ---
    // We look for a Panel where: OrderID + "-" + SKU + "-" + PanelName(Safe) === scannedId
    
    let found = false;

    // Loop through Orders
    for (const [ordId, ordData] of Object.entries(rawData)) {
        
        // Loop through Products
        for (const [prodName, prodData] of Object.entries(ordData.products)) {
            
            // We need the SKU. 
            // NOTE: Assuming your rawData tree has SKU. 
            // If not, we try to reconstruct it or check partial match.
            // Let's assume the SKU is stored in the product object.
            // If it's missing, we grab it from the first component or panel row if available.
            // But for now, let's look at the PANELS.

            if (prodData.panels) {
                for (const p of prodData.panels) {
                    
                    // We reconstruct the ID the same way the Sheet does:
                    // Sheet Formula: Order + "-" + SKU + "-" + PanelName(with _ for spaces)
                    
                    // Note: We need the SKU for this panel.
                    // In your getDataTree(), ensure 'sku' is passed in the panel object or product object.
                    // Assuming 'p.sku' exists or 'prodData.sku' exists. 
                    // Let's try to match strict pattern first.
                    
                    // Fallback: If we don't have SKU easily, we can try to match the TAIL of the string.
                    // Scanned: "1006-CAB600-Side_Panel"
                    // Target: PanelName = "Side Panel" -> "Side_Panel"
                    // Order: 1006
                    
                    const safeName = p.panelName.replace(/ /g, "_");
                    
                    // Check if the Scanned ID *ENDS WITH* "-[SafeName]" AND *STARTS WITH* "[OrderId]-"
                    // This is safer than guessing the SKU position if we aren't sure of data structure.
                    
                    if (scannedId.endsWith("-" + safeName) && scannedId.startsWith(ordId + "-")) {
                         found = true;
                         
                         // 1. Set Context
                         currentOrder = ordId;
                         currentProduct = prodName;
                         
                         // 2. Set UI Text
                         document.getElementById('dash-customer').innerText = getOrderDisplayTitle(rawData[ordId], ordId);
                         document.getElementById('manuf-customer').innerText = getOrderDisplayTitle(rawData[ordId], ordId);
                         document.getElementById('fork-product-name').innerText = prodName;
                         document.getElementById('panel-prod-name').innerText = prodName;

                         // 3. Navigate
                         showStatus("Found: " + p.panelName, true);
                         openSinglePanel(p.rowIndex);
                         return;
                    }
                }
            }
        }
    }

    if (!found) {
        alert("❌ Barcode not found:\n" + scannedId);
        showStatus("Not Found", true);
    }
  }

  function run(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)[fnName](...args);
  });
}

  document.getElementById('optim-max-weight').value  = '';

function runDelivOptimisation() {
  const maxWeight = parseFloat(document.getElementById('optim-max-weight').value);
  if (!maxWeight || maxWeight <= 0) { alert('Please enter a valid van capacity in kg.'); return; }

  const orderObj = rawData[currentOrder];
  if (!orderObj) return;

  const norm = v => String(v ?? '').replace(/\s+/g, ' ').trim();

  // ── Collect all pending items ────────────────────────────────────────────
  const pendingMap = {}; // productName → { name, qty, kgPerUnit }

  const addPending = (name, qty) => {
    if (!qty || qty < 1) return;
    const sku       = orderObj.products?.[name]?.sku?.trim().toUpperCase() || '';
    const kgPerUnit = (sku && _productWeights[sku]) ? _productWeights[sku] : 0;
    if (!pendingMap[name]) pendingMap[name] = { name, qty: 0, kgPerUnit };
    pendingMap[name].qty += qty;
  };

  // Bucket (all unassigned = undelivered)
  Object.entries(orderObj.delivery?.bucket || {}).forEach(([name, d]) => addPending(name, d.qty || 0));

  // Rooms — Pending status only
  Object.values(orderObj.delivery?.rooms || {}).forEach(items => {
    items.forEach(item => { if (norm(item.status) === 'Pending') addPending(item.name, item.qty || 0); });
  });

  const pending = Object.values(pendingMap);
  if (!pending.length) {
    document.getElementById('optim-results').innerHTML =
      `<div class="alert alert-success mb-0">All items for this order have been delivered. Nothing to schedule.</div>`;
    return;
  }

  // Split into weighted (can pack) and unweighted (no weight data — list separately)
  const weighted   = pending.filter(p => p.kgPerUnit > 0);
  const unweighted = pending.filter(p => p.kgPerUnit === 0);

  // ── First-Fit Decreasing bin packing ────────────────────────────────────
  // Expand weighted items to individual units, sort heaviest first
  const units = [];
  weighted.forEach(p => {
    for (let i = 0; i < p.qty; i++) units.push({ name: p.name, weight: p.kgPerUnit });
  });
  units.sort((a, b) => b.weight - a.weight);

  // Check if any single item exceeds capacity
  const oversized = units.filter(u => u.weight > maxWeight);

  // Pack into vans
  const vans = []; // [{ items:[{name,weight}], totalWeight }]
  units.forEach(unit => {
    if (unit.weight > maxWeight) return; // handle oversized separately
    let placed = false;
    for (const van of vans) {
      if (van.totalWeight + unit.weight <= maxWeight) {
        van.items.push(unit);
        van.totalWeight = parseFloat((van.totalWeight + unit.weight).toFixed(1));
        placed = true;
        break;
      }
    }
    if (!placed) vans.push({ items: [unit], totalWeight: parseFloat(unit.weight.toFixed(1)) });
  });

  // Consolidate each van: group units by product name
  const trips = vans.map((van, i) => {
    const grouped = {};
    van.items.forEach(u => {
      if (!grouped[u.name]) grouped[u.name] = { name: u.name, qty: 0, kgPerUnit: u.weight };
      grouped[u.name].qty++;
    });
    return { tripNum: i + 1, products: Object.values(grouped), totalWeight: van.totalWeight };
  });

  // ── Render ───────────────────────────────────────────────────────────────
  const totalKnownWeight = weighted.reduce((s, p) => s + p.kgPerUnit * p.qty, 0);
  const pct = w => Math.round((w / maxWeight) * 100);
  const barColor = w => w / maxWeight > 0.9 ? '#EE3686' : w / maxWeight > 0.6 ? '#f59e0b' : '#3A438A';

  const tripCards = trips.map(t => {
    const rows = t.products
      .sort((a, b) => b.kgPerUnit * b.qty - a.kgPerUnit * a.qty)
      .map(p => `
        <div class="d-flex justify-content-between align-items-center py-1 border-bottom" style="font-size:0.85rem;">
          <span>${escHtml(p.name)}</span>
          <span class="text-muted ms-3 text-nowrap">×${p.qty} &nbsp;·&nbsp; <strong>${(p.kgPerUnit * p.qty).toFixed(1)} kg</strong></span>
        </div>`).join('');

    const fill = pct(t.totalWeight);
    const color = barColor(t.totalWeight);

    return `
      <div class="card border-0 shadow-sm mb-3 overflow-hidden">
        <div style="height:4px; background:${color}; width:${Math.min(fill,100)}%;"></div>
        <div class="card-body pb-2">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold">Trip ${t.tripNum}</span>
            <span class="badge rounded-pill" style="background:${color};color:#fff;font-size:0.75rem;">
              ${t.totalWeight} kg / ${maxWeight} kg &nbsp;(${fill}%)
            </span>
          </div>
          ${rows}
        </div>
      </div>`;
  }).join('');

  const summaryBar = `
    <div class="card border-0 bg-light rounded-3 p-3 mb-3">
      <div class="row text-center g-0">
        <div class="col border-end">
          <div class="fw-bold fs-4" style="color:#3A438A;">${trips.length}</div>
          <div class="small text-muted">Trip${trips.length !== 1 ? 's' : ''} needed</div>
        </div>
        <div class="col border-end">
          <div class="fw-bold fs-4" style="color:#3A438A;">${pending.reduce((s,p)=>s+p.qty,0)}</div>
          <div class="small text-muted">Total units</div>
        </div>
        <div class="col">
          <div class="fw-bold fs-4" style="color:#3A438A;">${totalKnownWeight.toFixed(0)} kg</div>
          <div class="small text-muted">Known weight</div>
        </div>
      </div>
    </div>`;

  const oversizedBlock = oversized.length ? `
    <div class="alert alert-danger py-2 mb-3" style="font-size:0.82rem;">
      <strong>⚠ Items exceeding van capacity (${maxWeight} kg):</strong>
      ${[...new Set(oversized.map(u => u.name))].map(n => {
        const u = oversized.find(x => x.name === n);
        return `<div class="mt-1">${escHtml(n)} — ${u.weight} kg per unit</div>`;
      }).join('')}
      <div class="mt-1 text-muted">These cannot be loaded within the weight limit and are excluded from the schedule.</div>
    </div>` : '';

  const unweightedBlock = unweighted.length ? `
    <div class="alert alert-warning py-2 mb-3" style="font-size:0.82rem;">
      <strong>⚠ Items with no weight data — schedule manually:</strong>
      ${unweighted.map(p => `<div class="mt-1">${escHtml(p.name)} ×${p.qty}</div>`).join('')}
    </div>` : '';

  document.getElementById('optim-results').innerHTML =
    summaryBar + oversizedBlock + unweightedBlock + tripCards;
}

function openMarkDeliveredModal(idx) {
  const s = _schedulesList[idx];
  if (!s) return;

  computeDeliveryStatsForCurrentOrder();

  // Parse items — only the new "room|||name|||qty" format supports batch delivery
  const delivItems = s.rooms
    .filter(r => r.includes('|||'))
    .map(encoded => {
      const [room, name, qty] = encoded.split('|||');
      return { room: room || '', name: name || '', qty: Number(qty) || 1 };
    });

  if (!delivItems.length) {
    alert('This delivery was saved in an older format that does not support batch marking. Please update statuses manually in the Rooms tab.');
    return;
  }

  // Assess each item against current rawData + delivery stats
  const itemDetails = delivItems.map(item => {
    const roomItems = rawData[currentOrder]?.delivery?.rooms?.[item.room] || [];
    const pendingQty = roomItems
      .filter(i => norm(i.name) === norm(item.name) && norm(i.status) === 'Pending')
      .reduce((s, i) => s + (Number(i.qty) || 0), 0);

    const stats = deliveryStats.products?.[norm(item.name)];
    const avail  = stats ? stats.avail : 0;

    return {
      ...item,
      pendingQty,
      avail,
      alreadyDone:      pendingQty === 0,
      blockedByPacking: pendingQty > 0 && avail < pendingQty,
      canDeliver:       pendingQty > 0 && avail >= pendingQty
    };
  });

  const readyItems    = itemDetails.filter(i => i.canDeliver);
  const blockedItems  = itemDetails.filter(i => i.blockedByPacking);
  const allDoneItems  = itemDetails.filter(i => i.alreadyDone);

  document.getElementById('deliv-mark-subtitle').textContent = `Delivery ${escHtml(s.delivNo)} · ${escHtml(s.date)}`;

  if (allDoneItems.length === itemDetails.length) {
    document.getElementById('deliv-mark-body').innerHTML =
      '<div class="text-center text-muted py-4"><div style="font-size:2rem">✅</div><div class="fw-bold mt-2">All items already delivered</div></div>';
    document.getElementById('deliv-mark-confirm-btn').disabled = true;
  } else {
    let html = '<div class="small text-muted mb-3">Review items on this delivery:</div>';
    itemDetails.forEach(item => {
      let badge, sub;
      if (item.alreadyDone) {
        badge = '<span class="badge bg-success">Already Delivered</span>';
        sub   = '';
      } else if (item.blockedByPacking) {
        badge = '<span class="badge bg-warning text-dark">⚠ Not Packed</span>';
        sub   = `<div class="small text-danger mt-1">Only ${item.avail} of ${item.pendingQty} unit(s) packed — wait for manufacturing</div>`;
      } else {
        badge = '<span class="badge bg-dark">Ready ✓</span>';
        sub   = '';
      }
      html += `
        <div class="d-flex justify-content-between align-items-start py-2 border-bottom">
          <div>
            <div class="fw-bold">${escHtml(item.name)}</div>
            <div class="small text-muted">Room ${escHtml(item.room)} · ×${item.qty}</div>
            ${sub}
          </div>
          ${badge}
        </div>`;
    });
    if (blockedItems.length > 0) {
      html += `<div class="alert alert-warning small mt-3 mb-0">⚠️ ${blockedItems.length} item(s) cannot be marked delivered — not enough packed. Only <strong>${readyItems.length}</strong> ready item(s) will be updated.</div>`;
    }
    document.getElementById('deliv-mark-body').innerHTML = html;
    const confirmBtn = document.getElementById('deliv-mark-confirm-btn');
    confirmBtn.disabled  = readyItems.length === 0;
    confirmBtn.textContent = readyItems.length > 0 ? `Mark ${readyItems.length} Item(s) Delivered ✓` : 'Nothing to Mark';
    confirmBtn.onclick = () => executeMarkDelivered(readyItems);
  }

  new bootstrap.Modal(document.getElementById('delivMarkModal')).show();
}

function executeMarkDelivered(readyItems) {
  bootstrap.Modal.getInstance(document.getElementById('delivMarkModal'))?.hide();
  showStatus('Marking delivered...', false);

  const items = readyItems.map(item => ({
    sourceOrderIds: getRoomItemSourceOrderIds(rawData[currentOrder], item.room, item.name, 'Pending'),
    roomName:       item.room,
    prodName:       item.name,
    qty:            item.pendingQty
  }));

  google.script.run
    .withSuccessHandler(res => {
      if (res && res.error) { showStatus('Error', false); alert('Error: ' + res.error); return; }

      const results  = (res && res.results) || [];
      const successes = results.filter(r => r.result === 'SUCCESS').length;
      const blocked   = results.filter(r => r.result === 'BLOCKED').length;

      // Update rawData locally to match what GAS wrote
      results.forEach(r => {
        if (r.result !== 'SUCCESS') return;
        const roomArr = rawData[currentOrder]?.delivery?.rooms?.[norm(r.roomName)];
        if (!roomArr) return;
        const item = readyItems.find(i => norm(i.name) === norm(r.prodName) && norm(i.room) === norm(r.roomName));
        if (!item) return;
        const oldIdx = roomArr.findIndex(i => norm(i.name) === norm(r.prodName) && norm(i.status) === 'Pending');
        if (oldIdx < 0) return;
        const qtyMoved = item.pendingQty;
        const sourceIds = roomArr[oldIdx].sourceOrderIds || [];
        roomArr[oldIdx].qty -= qtyMoved;
        if (roomArr[oldIdx].qty <= 0) roomArr.splice(oldIdx, 1);
        const existing = roomArr.find(i => norm(i.name) === norm(r.prodName) && norm(i.status) === 'Delivered');
        if (existing) existing.qty += qtyMoved;
        else roomArr.push({ name: r.prodName, qty: qtyMoved, status: 'Delivered', sourceOrderIds: sourceIds });
      });

      renderRooms();
      renderDeliverySummary();
      renderSchedulesList();

      if (blocked > 0) showStatus(`${successes} delivered · ${blocked} blocked by packing`, true);
      else showStatus(`${successes} item(s) marked Delivered!`, true);
    })
    .withFailureHandler(err => {
      showStatus('Error', false);
      alert('Error: ' + (err.message || err));
    })
    .batchMarkDelivered(currentOrder, items, currentUser);
}

function saveAndGenerateDeliveryNote() {
  const dateVal  = (document.getElementById('new-deliv-date').value  || '').trim();
  const notesVal = (document.getElementById('new-deliv-notes').value || '').trim();
  if (!dateVal) { alert('Please select a delivery date.'); return; }

  const checked = [...document.querySelectorAll('.deliv-item-check:checked')];
  if (checked.length === 0) { alert('Please select at least one item for this delivery.'); return; }

  const selectedItems = checked.map(cb => _delivItemList[Number(cb.value)]).filter(Boolean);
  const customer      = norm(rawData[currentOrder]?.customer) || currentOrder;

  const [yyyy, mm, dd] = dateVal.split('-');
  const displayDate    = `${dd}/${mm}/${yyyy}`;

  // Encode items for storage: "room|||name|||qty" — GAS just stores the array joined by ","
  const roomsPayload = selectedItems.map(i => `${i.room}|||${i.name}|||${i.qty}`);

  const btn = document.getElementById('new-deliv-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  google.script.run
    .withSuccessHandler(delivNo => {
      if (btn) { btn.disabled = false; btn.innerHTML = 'Save &amp; Generate Delivery Note'; }
      showStatus('Delivery saved!', true);

      const productDetails = _buildProductDetailsFromItems(selectedItems);

      // Calculate total delivery weight from cached product weights
      let totalWeightKg = 0;
      selectedItems.forEach(item => {
        const sku = rawData[currentOrder]?.products?.[item.name]?.sku?.trim().toUpperCase();
        const kgPerUnit = sku ? (_productWeights[sku] || 0) : 0;
        totalWeightKg += kgPerUnit * item.qty;
      });
      totalWeightKg = parseFloat(totalWeightKg.toFixed(1));

      const _generate = () => {
        const html = generateDeliveryNoteHTML(delivNo, displayDate, notesVal, selectedItems, customer, _deliveryAddress || '', productDetails, totalWeightKg);
        openDeliveryNoteWindow(html);
        showView('view-delivery');
        switchDelivTab('schedules');
      };

      if (_catalogueData) {
        _generate();
      } else {
        google.script.run
          .withSuccessHandler(data => { _catalogueData = data || []; _generate(); })
          .withFailureHandler(() => _generate())
          .getProductCatalogue();
      }
    })
    .withFailureHandler(err => {
      if (btn) { btn.disabled = false; btn.innerHTML = 'Save &amp; Generate Delivery Note'; }
      showStatus('Error', false);
      alert('Error saving delivery: ' + (err.message || err));
    })
    .saveDeliverySchedule(currentOrder, customer, displayDate, roomsPayload, notesVal, currentUser);
}

function reOpenDeliveryNote(idx) {
  const s = _schedulesList[idx];
  if (!s) return;
  const customer = norm(rawData[currentOrder]?.customer) || currentOrder;

  // Parse stored items (new format: "room|||name|||qty"; old format: just room names)
  const selectedItems = s.rooms.map(encoded => {
    if (encoded.includes('|||')) {
      const [room, name, qty] = encoded.split('|||');
      return [{ room: room || '', name: name || '', qty: Number(qty) || 1 }];
    }
    // Legacy: whole-room entries — expand all items in that room
    return (rawData[currentOrder]?.delivery?.rooms?.[encoded] || [])
      .map(item => ({ room: encoded, name: item.name || '', qty: Number(item.qty) || 0 }));
  }).flat().filter(i => i.name);

  const productDetails = _buildProductDetailsFromItems(selectedItems);

  const doGenerate = () => {
    const html = generateDeliveryNoteHTML(s.delivNo, s.date, s.notes, selectedItems, customer, _deliveryAddress || '', productDetails);
    openDeliveryNoteWindow(html);
  };

  let pending = 0;
  const onDone = () => { pending--; if (pending === 0) doGenerate(); };
  if (!_deliveryAddress) pending++;
  if (!_catalogueData)   pending++;
  if (pending === 0) { doGenerate(); return; }

  if (!_deliveryAddress) {
    google.script.run
      .withSuccessHandler(addr => { _deliveryAddress = addr || ''; onDone(); })
      .withFailureHandler(() => onDone())
      .getOrderAddress(currentOrder);
  }
  if (!_catalogueData) {
    google.script.run
      .withSuccessHandler(data => { _catalogueData = data || []; onDone(); })
      .withFailureHandler(() => onDone())
      .getProductCatalogue();
  }
}

function _buildProductDetailsFromItems(selectedItems) {
  // Returns { productName: { qty, rooms: string[] } }
  const details = {};
  selectedItems.forEach(item => {
    if (!item.name) return;
    if (!details[item.name]) details[item.name] = { qty: 0, rooms: [] };
    details[item.name].qty += item.qty;
    if (!details[item.name].rooms.includes(item.room)) details[item.name].rooms.push(item.room);
  });
  return details;
}
