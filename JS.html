// POLLING FOR NEW ORDERS
function summarizePendingOrders(rows) {
  const safeRows = Array.isArray(rows) ? rows : [];
  const unique = new Set();

  safeRows.forEach(r => {
    const orderId = String((r && r.orderId) || "").trim().toLowerCase();
    const customer = String((r && r.customer) || "").trim().toLowerCase();
    if (!orderId) return;
    unique.add(`${orderId}|||${customer}`);
  });

  return {
    orderCount: unique.size,
    lineCount: safeRows.length
  };
}

function setOrderPendingIndicator(summary) {
  const orderCount = Number(summary && summary.orderCount) || 0;
  const lineCount = Number(summary && summary.lineCount) || 0;
  const hasPending = orderCount > 0;

  const badge = document.getElementById("order-badge");
  if (badge) badge.classList.toggle("hidden", !hasPending);

  const pill = document.getElementById("order-pending-pill");
  if (pill) {
    if (hasPending) {
      const orderWord = orderCount === 1 ? "order" : "orders";
      pill.textContent = `${orderCount} ${orderWord} waiting`;
      pill.classList.remove("hidden");
    } else {
      pill.classList.add("hidden");
    }
  }

  const banner = document.getElementById("orders-pending-banner");
  const countEl = document.getElementById("orders-pending-count");
  const linesEl = document.getElementById("orders-pending-lines");
  if (banner && countEl) {
    countEl.textContent = String(orderCount);
    banner.classList.toggle("hidden", !hasPending);
  }
  if (linesEl) {
    const lineWord = lineCount === 1 ? "line item" : "line items";
    linesEl.textContent = `(${lineCount} ${lineWord})`;
  }

  const btn = document.getElementById("orders-btn");
  if (btn) btn.classList.toggle("pending-attention", hasPending);
}

// Normalise strings (kills weird spaces + trims)
const norm = (v) => String(v ?? "").replace(/\u00A0/g, " ").trim();
const squeezeSpaces = (v) => norm(v).replace(/\s+/g, " ");
const roomKey = (v) => squeezeSpaces(v).toLowerCase().replace(/[^a-z0-9]/g, "");
const canonicalRoomName = (v) => {
  const cleaned = squeezeSpaces(v);
  if (!cleaned) return "";

  const roomWithDigits = cleaned.match(/^room\s*([a-z0-9-]+)$/i);
  if (roomWithDigits) return `Room ${roomWithDigits[1].toUpperCase()}`;

  return cleaned.replace(/\b\w/g, ch => ch.toUpperCase());
};

function findExistingRoomName(roomInput) {

  const targetKey = roomKey(roomInput);
  if (!targetKey) return "";
  return Object.keys(rooms).find(room => roomKey(room) === targetKey) || "";
}

const fmtNum = (v, digits = 0) => {

  return num.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
};
const fmtMaybe = (v, digits = 0) => (v == null ? "-" : fmtNum(v, digits));

let deliveryStats = { order: { ready: 0, onSite: 0, avail: 0 }, products: {} };

function computeDeliveryStatsForCurrentOrder() {
  const orderObj = rawData[currentOrder];
  if (!orderObj || !orderObj.products) {
    deliveryStats = { order: { ready: 0, onSite: 0, avail: 0 }, products: {} };
    return deliveryStats;
  }

  const stats = { order: { ready: 0, onSite: 0, avail: 0 }, products: {} };

  for (const prodKey in orderObj.products) {
  const prodName = norm(prodKey);
  const prodData = orderObj.products[prodKey];

  const del = getDeliveryTotals(orderObj, prodName);
  const required = getRequiredUnits(prodData, del.total);

  const ready = Math.min(getManufacturedUnits(prodData), required);
  const onSite = Math.min(del.delivered, required);
  const avail = Math.max(0, ready - onSite);

  stats.products[prodName] = { required, ready, onSite, avail };

  stats.order.ready += ready;
  stats.order.onSite += onSite;
  stats.order.avail += avail;
}


  deliveryStats = stats;
  return stats;
}

function renderDeliverySummary() {
  if (!currentOrder) return;
  const stats = computeDeliveryStatsForCurrentOrder();
  renderDeliveryProductSummary(stats); // ✅ only per-product table now
}



function getDeliveryTotals(orderObj, prodName) {
  prodName = norm(prodName);
  let total = 0;
  let delivered = 0;
  let fitted = 0;
  const del = (orderObj && orderObj.delivery) ? orderObj.delivery : { bucket: {}, rooms: {} };

  if (del.bucket && del.bucket[prodName]) {
    total += Number(del.bucket[prodName].qty) || 0;
  }

  if (del.rooms) {
    for (const room in del.rooms) {
      del.rooms[room].forEach(item => {
        if (norm(item.name) === prodName) {
          const q = Number(item.qty) || 0;
          total += q;
          if (item.status === "Delivered" || item.status === "Fitted") delivered += q;
          if (item.status === "Fitted") fitted += q;
        }
      });
    }
  }

  return { total, delivered, fitted };
}

function renderDeliveryProductSummary(stats) {
  const tbody = document.getElementById("deliv-prod-summary-body");
  if (!tbody) return;

  const products = stats && stats.products ? stats.products : {};
  const keys = Object.keys(products);

  if (!keys.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">No delivery items.</td></tr>`;
    return;
  }

  // Sort: most available first, then by name
  keys.sort((a, b) => {
    const A = products[a], B = products[b];
    if ((B.avail || 0) !== (A.avail || 0)) return (B.avail || 0) - (A.avail || 0);
    return String(a).localeCompare(String(b));
  });

  tbody.innerHTML = keys.map(name => {
    const s = products[name] || { required:0, ready:0, onSite:0, avail:0 };
    const availClass = (s.avail > 0) ? "text-success fw-bold" : "text-muted";

    return `
      <tr>
        <td class="ps-3 fw-bold text-dark">${name}</td>
        <td class="text-center">${s.required}</td>
        <td class="text-center">${s.ready}</td>
        <td class="text-center">${s.onSite}</td>
        <td class="text-center ${availClass}">${s.avail}</td>
      </tr>
    `;
  }).join("");
}

function getRequiredUnits(prodData, deliveryTotal) {
  // Prefer delivery count if it exists (that is the furniture qty)
  if (deliveryTotal > 0) return deliveryTotal;

  // Fallback for Workshop Stock (no delivery rows)
  if (prodData && prodData.panels && prodData.panels.length) {
    let maxUnits = 0;
    prodData.panels.forEach(p => {
      const per = Number(p.qtyPerUnit) || 1;
      const qtyOrder = Number(p.qtyOrder) || 0;
      const units = per ? Math.round(qtyOrder / per) : 0;
      if (units > maxUnits) maxUnits = units;
    });
    return maxUnits;
  }

  return 0;
}

function getManufacturedUnits(prodData) {
  // Panels limiting factor
  let panelUnits = Infinity;
  const panelTotals = {};

  if (prodData && prodData.panels && prodData.panels.length) {
    prodData.panels.forEach(p => {
      const per = Number(p.qtyPerUnit) || 1;
      const packed = Number(p.qtyPacked) || 0;
      const key = String(p.panelName || "");
      if (!panelTotals[key]) panelTotals[key] = { packed: 0, per };
      panelTotals[key].packed += packed;
    });
  }

  Object.keys(panelTotals).forEach(key => {
    const entry = panelTotals[key];
    const sets = Math.floor((Number(entry.packed) || 0) / (Number(entry.per) || 1));
    if (sets < panelUnits) panelUnits = sets;
  });

  if (panelUnits === Infinity) panelUnits = 0;

  // Components limiting factor (qty-based)
let compUnits = Infinity;

if (prodData && prodData.components && prodData.components.length) {
  prodData.components.forEach(c => {
    const per = Number(c.qtyPerUnit) || 1;
    const packed = Number(c.qtyPacked) || 0;
    const sets = Math.floor(packed / per);
    if (sets < compUnits) compUnits = sets;
  });
}

if (compUnits === Infinity) compUnits = 999999;

return Math.min(panelUnits, compUnits);

}

function renderBreadcrumbs() {
  const el = document.getElementById("breadcrumb-bar");
  if (!el) return;

  el.innerHTML = "";
  el.classList.toggle("active", breadcrumbs.length > 0);

  breadcrumbs.forEach((c, i) => {
    const isLast = (i === breadcrumbs.length - 1);

    if (!c.onClick || isLast) {
      const span = document.createElement("span");
      span.textContent = c.label;
      el.appendChild(span);
    } else {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = c.label;
      a.onclick = (e) => {
        e.preventDefault();
        c.onClick();
      };
      el.appendChild(a);
    }

    if (!isLast) {
      const sep = document.createElement("span");
      sep.className = "breadcrumb-sep";
      sep.textContent = "/";
      el.appendChild(sep);
    }
  });
}

// Moves breadcrumb bar into the current screen header
function mountBreadcrumb(viewId) {
  const crumb = document.getElementById("breadcrumb-bar");
  const view = document.getElementById(viewId);
  if (!crumb || !view) return;

  const slot = view.querySelector(".breadcrumb-slot");
  const header = view.querySelector(".sticky-top-bar") || view.querySelector(".app-header");
  const target = slot || header;
  if (!target) return;

  if (!target.contains(crumb)) target.appendChild(crumb);
}

  function renderJobs() {
    document.getElementById('loading').classList.add('hidden');
    const list = document.getElementById('job-list');
    list.innerHTML = '';

    // 1. Sort Orders (Newest First)
    const sortedIds = Object.keys(rawData || {}).sort((a,b) => b.localeCompare(a));

    for (const id of sortedIds) {
      const details = rawData[id];
      const custName = String(details.customer || "").trim();

      let orderManufactured = 0;
      let orderDelivered = 0;
      let orderFitted = 0;
      let lines = '';

      // 2. Calculate Totals
      for (const prodName in details.products) {
        const prodData = details.products[prodName];

        const del = getDeliveryTotals(details, prodName);
        const required = getRequiredUnits(prodData, del.total);
        const manufactured = Math.min(getManufacturedUnits(prodData), required);
        const delivered = Math.min(del.delivered, required);
        const fitted = Math.min(del.fitted || 0, required);

        orderRequired += required;
        orderManufactured += manufactured;
        orderDelivered += delivered;
        orderFitted += fitted;

        // Custom text based on type

function loadTrackingHistory() {
  const tbody = document.getElementById('tracking-table-body');
  if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Loading history...</td></tr>';

  google.script.run
    .withSuccessHandler(rows => {
      trackingData = Array.isArray(rows) ? rows : [];
      refreshTrackingSourceFilterOptions();
      applyTrackingFilters();
    })
    .withFailureHandler(err => {
      if (tbody) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Failed to load tracking history: ${err.message || err}</td></tr>`;
      }
    })
    .getTrackingHistory(2000);
}

function refreshTrackingSourceFilterOptions() {
  const selectEl = document.getElementById('tracking-filter-source');
  if (!selectEl) return;

  const previous = String(selectEl.value || '');
  const sources = Array.from(new Set((trackingData || [])
    .map(r => String(r.source || '').trim())
    .filter(Boolean)))
    .sort((a, b) => a.localeCompare(b));

  selectEl.innerHTML = '<option value="">All Sources</option>' +
    sources.map(src => `<option value="${src}">${src}</option>`).join('');

  if (previous && sources.includes(previous)) selectEl.value = previous;
}

function applyTrackingFilters() {
  const userFilter = String(document.getElementById('tracking-filter-user')?.value || '').trim().toLowerCase();
  const orderFilter = String(document.getElementById('tracking-filter-order')?.value || '').trim().toLowerCase();
  const sourceFilter = String(document.getElementById('tracking-filter-source')?.value || '').trim().toLowerCase();
  const dateFilter = String(document.getElementById('tracking-filter-date')?.value || '').trim();
  const sortField = document.getElementById('tracking-sort-field')?.value || 'date';
  const sortDir = document.getElementById('tracking-sort-dir')?.value || 'desc';

  filteredTrackingData = (trackingData || []).filter(r => {
    const userTxt = String(r.user || '').toLowerCase();
    const orderTxt = String(r.orderId || '').toLowerCase();
    const sourceTxt = String(r.source || '').toLowerCase();
    const dateTxt = String(r.dateKey || '');

    if (userFilter && !userTxt.includes(userFilter)) return false;
    if (orderFilter && !orderTxt.includes(orderFilter)) return false;
    if (sourceFilter && sourceTxt !== sourceFilter) return false;
    if (dateFilter && dateTxt !== dateFilter) return false;
    return true;
  });

  filteredTrackingData.sort((a, b) => {
    let aVal = '';
    let bVal = '';

    if (sortField === 'date') {
      aVal = Number(a.timeMs) || 0;
      bVal = Number(b.timeMs) || 0;
    } else if (sortField === 'user') {
      aVal = String(a.user || '').toLowerCase();
      bVal = String(b.user || '').toLowerCase();
    } else {
      aVal = String(a.orderId || '').toLowerCase();
      bVal = String(b.orderId || '').toLowerCase();
    }

    if (aVal < bVal) return sortDir === 'asc' ? -1 : 1;
    if (aVal > bVal) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  renderTrackingRows();
}

function renderTrackingRows() {
  const tbody = document.getElementById('tracking-table-body');
  if (!tbody) return;

  if (!filteredTrackingData.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No tracking entries found for the selected filters.</td></tr>';
    return;
  }

  tbody.innerHTML = filteredTrackingData.map(r => `
    <tr>
      <td class="ps-3">${r.dateStr || ''}</td>
      <td>${r.user || ''}</td>
      <td>${r.orderId || '—'}</td>
      <td>${r.source || ''}</td>
      <td>${r.item || ''}</td>
      <td>${r.change || ''}</td>
      <td class="pe-3">${r.reason || ''}</td>
    </tr>
  `).join('');
}

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

function getBucketQtyForCurrentOrder() {
  const bucket = rawData[currentOrder]?.delivery?.bucket || {};
  return Object.values(bucket).reduce((sum, item) => sum + (Number(item?.qty) || 0), 0);
}

function exportRoomListToGoogleSheets() {
  if (!currentOrder) {
    alert('No order selected. Please open a job first.');
    return;
  }

  const bucketQty = getBucketQtyForCurrentOrder();
  if (bucketQty > 0) {
    const proceed = confirm(
      `Not all products have been given rooms (${bucketQty} remaining in Bucket). Are you sure you want to create the room list?`
    );
    if (!proceed) return;
  }

  setRoomExportState(false, 'Exporting…');

  google.script.run
    .withSuccessHandler(result => {
      setRoomExportState(true, '📄 Export to Google Sheets');
      if (!result || !result.url) {
        alert('Room list exported, but no spreadsheet link was returned.');
        return;
      }
      window.open(result.url, '_blank');
    })
    .withFailureHandler(err => {
      setRoomExportState(true, '📄 Export to Google Sheets');
      const message = err && err.message ? err.message : 'Export failed.';
      alert(`Export failed: ${message}`);
    })
    .exportRoomListToSheets(getCurrentOrderIds());
}


  function changeStatus(selectEl, roomName, prodName, oldStatus) {
  const newStatus = selectEl.value;

  roomName = norm(roomName);
prodName = norm(prodName);
oldStatus = norm(oldStatus);

const roomArr = rawData[currentOrder].delivery.rooms[roomName] || [];
const idx = roomArr.findIndex(i => norm(i.name) === prodName && norm(i.status) === oldStatus);


  if (idx < 0) {
    alert("Could not find this item group.");
    selectEl.value = oldStatus;
    return;
  }

  const groupQty = Number(roomArr[idx].qty) || 0;
  if (groupQty <= 0) {
    selectEl.value = oldStatus;
    return;
  }

  // Ask how many to move if qty > 1
let qtyToMove = groupQty;
if (groupQty > 1) {
  const entered = prompt(`How many "${prodName}" in ${roomName} to set to "${newStatus}"? (1-${groupQty})`, "1");
  if (entered === null) { selectEl.value = oldStatus; return; }

  const n = parseInt(entered, 10);
  if (!n || n < 1 || n > groupQty) { alert("Invalid quantity."); selectEl.value = oldStatus; return; }

  qtyToMove = n;
}

// ✅ NORMALISE AFTER qtyToMove is final
roomName = norm(roomName);
prodName = norm(prodName);
oldStatus = norm(oldStatus);

// ✅ Always recompute stats
computeDeliveryStatsForCurrentOrder();
const s = deliveryStats.products ? deliveryStats.products[prodName] : null;

// Only consume "Available" when moving INTO Delivered/Fitted from a non-onsite state
const oldCountsOnSite = (oldStatus === "Delivered" || oldStatus === "Fitted");
const newCountsOnSite = (newStatus === "Delivered" || newStatus === "Fitted");

if (s && newCountsOnSite && !oldCountsOnSite) {
  if (qtyToMove > s.avail) {
    alert(
      `⛔ Not enough available to set ${qtyToMove} to "${newStatus}".\n\n` +
      `Factory ready: ${s.ready}\nOn site: ${s.onSite}\nAvailable: ${s.avail}\n\n` +
      `Wait for manufacturing or reduce quantity.`
    );
    selectEl.value = oldStatus;
    return;
  }
}
  // Return to Bucket (partial supported)
  if (newStatus === "Bucket") {
    showStatus("Returning...", false);
    const sourceOrderIds = getRoomItemSourceOrderIds(rawData[currentOrder], roomName, prodName, oldStatus);

    // Update local model
    roomArr[idx].qty -= qtyToMove;
    if (roomArr[idx].qty <= 0) roomArr.splice(idx, 1);
    if (roomArr.length === 0) delete rawData[currentOrder].delivery.rooms[roomName];

    const bucket = rawData[currentOrder].delivery.bucket;
    if (!bucket[prodName]) bucket[prodName] = { qty: 0, sourceOrderIds: [] };
    bucket[prodName].qty += qtyToMove;
    bucket[prodName].sourceOrderIds = Array.from(new Set([...(bucket[prodName].sourceOrderIds || []), ...sourceOrderIds]));

    renderRooms();
    renderDeliverySummary();
    renderBucket();
    showStatus("Returned!", true);

    google.script.run.unassignFromRoom(sourceOrderIds, roomName, prodName, qtyToMove);
    return;
  }


  // Normal status change (partial supported)
  showStatus("Checking Factory...", false);

  google.script.run
    .withSuccessHandler(res => {
      if (res === "SUCCESS") {
        const sourceOrderIds = getRoomItemSourceOrderIds(rawData[currentOrder], roomName, prodName, oldStatus);

        // Remove qty from the old group
        const curQty = Number(roomArr[idx].qty) || 0;
        roomArr[idx].qty = curQty - qtyToMove;

        // If old group is empty, remove it
        if (roomArr[idx].qty <= 0) roomArr.splice(idx, 1);

        // Add qty to the new status group (merge if exists)
        const safeNewStatus = norm(newStatus);

         let existing = roomArr.find(i => norm(i.name) === prodName && norm(i.status) === safeNewStatus);
         if (existing) {
           existing.qty += qtyToMove;
           existing.sourceOrderIds = Array.from(new Set([...(existing.sourceOrderIds || []), ...sourceOrderIds]));
         } else {
           roomArr.push({ name: prodName, qty: qtyToMove, status: safeNewStatus, sourceOrderIds: sourceOrderIds });
         }
        
        if (roomArr.length === 0) delete rawData[currentOrder].delivery.rooms[roomName];

        renderRooms();
        renderDeliverySummary();
        renderBucket();
        showStatus("Saved", true);

      } else if (res.startsWith("LIMIT_REACHED")) {
        const parts = res.split(":");
        const s = deliveryStats.products ? deliveryStats.products[norm(prodName)] : null;
const extra = s
  ? `\n\nFactory ready: ${s.ready}\nOn site: ${s.onSite}\nAvailable: ${s.avail}`
  : "";

alert(
  `⛔ SAFETY STOP ⛔\n\nFactory has only packed ${parts[1]}.\nSite has already processed ${parts[2]}.\n\nWait for manufacturing.` +
  extra
);
        selectEl.value = oldStatus;
        showStatus("Blocked", true);
      } else {
        alert("Error: " + res);
        selectEl.value = oldStatus;
      }
    })
    .withFailureHandler(err => {
      alert("Connection Error: " + err.message);
      selectEl.value = oldStatus;
    })
    .updateDeliveryStatus(getRoomItemSourceOrderIds(rawData[currentOrder], roomName, prodName, oldStatus), roomName, prodName, oldStatus, newStatus, qtyToMove);
}

  function openAssignModal() {
    const bucket = rawData[currentOrder].delivery.bucket || {};
    const rooms = rawData[currentOrder]?.delivery?.rooms || {};
    const list = document.getElementById('assign-list');
    list.innerHTML = '';
    assignQueue = {};

    const roomInput = document.getElementById('new-room-name');
    const roomSelect = document.getElementById('existing-room-select');
    roomInput.value = '';
    roomSelect.innerHTML = '<option value="">+ Create / type a new room below</option>';

    const seenRoomKeys = new Set();
    Object.keys(rooms)
      .sort((a, b) => String(a).localeCompare(String(b)))
      .forEach(room => {
        const canonical = canonicalRoomName(room);
        const key = roomKey(canonical);
        if (!key || seenRoomKeys.has(key)) return;
        seenRoomKeys.add(key);

        const opt = document.createElement('option');
        opt.value = canonical;
        opt.textContent = canonical;
        roomSelect.appendChild(opt);
      });

    roomSelect.onchange = () => {
      if (roomSelect.value) roomInput.value = roomSelect.value;
    };

    if(Object.keys(bucket).length === 0) {
        list.innerHTML = '<div class="text-center text-muted">Nothing in bucket to assign!</div>';
    } else {
        for (const [prodName, data] of Object.entries(bucket)) {
            if(data.qty > 0) {
                const row = document.createElement('div');
                row.className = 'd-flex justify-content-between align-items-center mb-3';
                row.innerHTML = `
                    <div style="flex:1;"><strong>${prodName}</strong><br><small class="text-muted">Avail: ${data.qty}</small></div>
                    <div class="d-flex align-items-center bg-light rounded px-2">
                        <div class="btn-squircle text-dark" style="font-size:1.5rem;" onclick="updateAssign('${prodName}', -1, ${data.qty})">−</div>
                        <input id="assign-${prodName}" class="qty-input bg-light mx-2" value="0" readonly>
                        <div class="btn-squircle text-dark" style="font-size:1.5rem;" onclick="updateAssign('${prodName}', 1, ${data.qty})">+</div>
                    </div>
                `;
                list.appendChild(row);
            }
        }
    }
    new bootstrap.Modal(document.getElementById('assignModal')).show();
  }

  function updateAssign(prodName, change, max) {
    let current = assignQueue[prodName] || 0;
    let next = current + change;
    if(next < 0) next = 0;
    if(next > max) next = max;
    assignQueue[prodName] = next;
    document.getElementById('assign-'+prodName).value = next;
  }

  function commitAssignment() {
    const selectedRoom = canonicalRoomName(document.getElementById('existing-room-select')?.value);
    const typedRoom = canonicalRoomName(document.getElementById('new-room-name').value);
    const roomInput = selectedRoom || typedRoom;

    if(!roomInput) { alert("Please choose an existing room or enter a new Room Name"); return; }

    const existingRoom = findExistingRoomName(roomInput);
    const roomName = existingRoom || roomInput;

    if (!selectedRoom && typedRoom && existingRoom && existingRoom !== typedRoom) {
      const confirmed = confirm(`Use existing room \"${existingRoom}\" instead of creating \"${typedRoom}\"?`);
      if (!confirmed) return;
    }

    let moves = [];
    for(const [prod, qty] of Object.entries(assignQueue)) {
        if(qty > 0) moves.push({ prod: prod, qty: qty });
    }
    if(moves.length === 0) { alert("Select at least one item."); return; }

    const modalEl = document.getElementById('assignModal');
    const modal = bootstrap.Modal.getInstance(modalEl);
    const confirmBtn = document.getElementById('assign-confirm-btn');
    if (confirmBtn) {
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Saving...';
    }
    showStatus("Assigning...", false);

    let pending = moves.length;
    let failed = false;

    const finish = () => {
      if (confirmBtn) {
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Confirm Move ➔';
      }
    };

    moves.forEach(m => {
      const safeProd = norm(m.prod);
      google.script.run
        .withSuccessHandler((res) => {
          const failedRes = typeof res === 'string' && res.toUpperCase().indexOf('ERROR') === 0;
          if (failedRes) {
            failed = true;
            console.error('assignToRoom rejected:', res);
          }

          if (!failedRes) {
            const bucket = rawData[currentOrder].delivery.bucket || {};
            const sourceOrderIds = getBucketSourceOrderIds(rawData[currentOrder], safeProd);
            if (!bucket[safeProd]) bucket[safeProd] = { qty: 0, sourceOrderIds: sourceOrderIds };
            bucket[safeProd].qty -= m.qty;
            if (bucket[safeProd].qty <= 0) delete bucket[safeProd];
            rawData[currentOrder].delivery.bucket = bucket;

            if (!rawData[currentOrder].delivery.rooms) rawData[currentOrder].delivery.rooms = {};
            if (!rawData[currentOrder].delivery.rooms[roomName]) rawData[currentOrder].delivery.rooms[roomName] = [];

            const roomItems = rawData[currentOrder].delivery.rooms[roomName];
            const existing = roomItems.find(i => norm(i.name) === safeProd && norm(i.status) === 'Pending');
            if (existing) {
              existing.qty = (Number(existing.qty) || 0) + m.qty;
              existing.sourceOrderIds = Array.from(new Set([...(existing.sourceOrderIds || []), ...sourceOrderIds]));
            } else {
              roomItems.push({ name: safeProd, qty: m.qty, status: 'Pending', sourceOrderIds: sourceOrderIds });
            }
          }

          pending--;
          if (pending === 0) {
            finish();
            if (failed) {
              showStatus('Assignment failed. Refreshing data...', false);
              google.script.run.withSuccessHandler(onDataLoad).getDataTree();
              alert('Some assignments failed to save. Data has been refreshed from server.');
              return;
            }

            modal.hide();
            showStatus('Assigned!', true);
            renderBucket();
            renderRooms();
            renderDeliverySummary();
          }
        })
        .withFailureHandler((err) => {
          failed = true;
          console.error('assignToRoom error:', err);
          pending--;
          if (pending === 0) {
            finish();
            showStatus('Assignment failed. Refreshing data...', false);
            google.script.run.withSuccessHandler(onDataLoad).getDataTree();
            alert('Some assignments failed to save. Data has been refreshed from server.');
          }
        })
        .assignToRoom(getBucketSourceOrderIds(rawData[currentOrder], safeProd), safeProd, m.qty, roomName);
    });
  }

  // NEW: FILTER LIST FUNCTION
  function filterList(inputId, itemClass) {
    const filter = document.getElementById(inputId).value.toUpperCase();
    // Get all rows with the class
    const rows = document.getElementsByClassName(itemClass);
    
    for (let i = 0; i < rows.length; i++) {
      // For tables, we look at the whole row text
      const txtValue = rows[i].textContent || rows[i].innerText;
      if (txtValue.toUpperCase().indexOf(filter) > -1) {
        rows[i].style.display = ""; // Show
      } else {
        rows[i].style.display = "none"; // Hide

        // If we are filtering panels, hide any material groups that now have no visible cards
      if (itemClass === 'panel-row-menu') {
  document.querySelectorAll('.material-group').forEach(g => {
    const cards = g.querySelectorAll('.panel-row-menu');
    const anyVisible = Array.from(cards).some(c => c.style.display !== "none");
    g.style.display = anyVisible ? "" : "none";
  });
}

      }
    }
  }

  // NEW: BATCH COMPLETE (FILL MAX)
  function fillMax(rowIdx, type) {
    if(!confirm("Mark ALL as complete for this stage?")) return;

    let panelData = null;
    const productObj = rawData[currentOrder].products[currentProduct];
    if (productObj && productObj.panels) {
        productObj.panels.forEach(p => { if(p.rowIndex == rowIdx) panelData = p; });
    }
    if (!panelData) return;

    const input = document.getElementById(type + '-' + rowIdx);
    if(!input) return;
    
    const currentVal = parseInt(input.value) || 0;
    const maxVal = panelData.qtyOrder; 
    const diff = maxVal - currentVal;
    
    if(diff > 0) {
        update(rowIdx, type, diff);
    } else {
        alert("Already full!");
    }
  }

  // --- REPLACED: openPanels (Now renders a Menu) ---
  function openPanels() {
  document.getElementById('panel-prod-name').innerText = currentProduct;
  const list = document.getElementById('panel-list');
  list.innerHTML = '';

  const productObj = rawData[currentOrder]?.products?.[currentProduct];
  const panels = productObj?.panels || [];
  if (!panels.length) {
    list.innerHTML = `<div class="text-center text-muted py-4">No panels for this product.</div>`;
    showView('view-panels');
    return;
  }

  // Group by material
  const groups = {};
  panels.forEach(p => {
    const mat = norm(p.material) || "Unspecified Material";
    if (!groups[mat]) groups[mat] = [];
    groups[mat].push(p);
  });

  // Sort material groups A→Z
  const mats = Object.keys(groups).sort((a, b) => a.localeCompare(b));

  mats.forEach(mat => {
    // Group wrapper (important: class material-group used for search tidy)
    const groupWrap = document.createElement('div');
    groupWrap.className = "material-group mb-4";

    // Group header
    const header = document.createElement('div');
    header.className = "px-2 mb-2";
    header.innerHTML = `
      <div class="fw-bold text-dark">${mat}</div>
      <div class="small text-muted">${groups[mat].length} panel type(s)</div>
    `;
    groupWrap.appendChild(header);

    // Sort panels inside each group by name
    groups[mat].sort((a, b) => String(a.panelName).localeCompare(String(b.panelName)));

    // Render each panel card (same style you already had)
    groups[mat].forEach(p => {
      const req = Number(p.qtyOrder) || 0;
      const cut = Number(p.qtyCut) || 0;
      const proc = Number(p.qtyProcessed) || 0;
      const fin = Number(p.qtyEdgeFinish) || 0;
      const pack = Number(p.qtyPacked) || 0;
      const damageInfo = getPanelDamageInfo(p, productObj);

      const progressUnits = Math.min(cut, req) + Math.min(proc, req) + Math.min(fin, req) + Math.min(pack, req);
      const totalUnits = req * 4;
      const percent = totalUnits > 0 ? Math.round((progressUnits / totalUnits) * 100) : 0;
      const isDone = (req > 0 && pack >= req);

      const row = document.createElement('div');
      row.className = 'card p-3 mb-2 panel-row-menu shadow-sm border-0';
      row.style.cursor = 'pointer';
      row.onclick = () => openSinglePanel(p.rowIndex);

      // NOTE: visually-hidden makes material searchable without cluttering the UI
      row.innerHTML = `
        <span class="visually-hidden">${mat}</span>
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="fw-bold text-dark" style="font-size: 1.1rem;">${p.panelName}</div>
            <div class="small text-muted">Required: ${damageInfo.required} • Damaged: ${damageInfo.damaged} • Total: ${damageInfo.total}</div>
            <div class="small text-muted mt-1">
              ${cut} Cut — ${proc} CNC'd — ${fin} Edge Finished — ${pack} Packed
            </div>
          </div>
          <div class="d-flex align-items-center">
            <div class="panel-row-actions">
              <button class="damage-btn" title="Mark damaged" onclick="openDamageModal(event, ${p.rowIndex})">⚠️</button>
              ${isDone ? '<span class="badge bg-success rounded-pill">Packed ✅</span>' : ''}
            </div>
            <div class="text-muted ms-2" style="font-size: 1.5rem;">➔</div>
          </div>
        </div>
        <div class="progress-track mt-2" style="height: 4px;">
          <div class="progress-fill" style="width:${percent}%; background: var(--color-pack-text);"></div>
        </div>
      `;

      groupWrap.appendChild(row);
    });

    list.appendChild(groupWrap);
  });

  showView('view-panels');
}

function openDamageModal(e, rowIdx) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const productObj = rawData?.[currentOrder]?.products?.[currentProduct];
  const panelData = productObj?.panels?.find(p => String(p.rowIndex) === String(rowIdx));
  if (!panelData) {
    alert("Panel data not found.");
    return;
  }

  currentDamageRowIndex = rowIdx;
  const metaEl = document.getElementById("damage-panel-meta");
  if (metaEl) {
    metaEl.textContent = `${panelData.panelName} • ${currentProduct}`;
  }
  const qtyInput = document.getElementById("damage-qty");
  const reasonInput = document.getElementById("damage-reason");
  if (qtyInput) qtyInput.value = "1";
  if (reasonInput) reasonInput.value = "";

  new bootstrap.Modal(document.getElementById("damageModal")).show();
}

function submitDamage() {
  const qtyInput = document.getElementById("damage-qty");
  const reasonInput = document.getElementById("damage-reason");
  const qty = Number(qtyInput ? qtyInput.value : 0);
  const reason = String(reasonInput ? reasonInput.value : "").trim();

  if (!currentDamageRowIndex) {
    alert("Missing panel reference.");
    return;
  }
  if (!qty || qty <= 0) {
    alert("Enter a valid damaged quantity.");
    return;
  }

  function update(rowIdx, type, change) {
    const input = document.getElementById(type + '-' + rowIdx); 
    if (!input) return;
    
    let currentVal = parseInt(input.value) || 0; // Safety: default to 0 if empty
    let newVal = currentVal + change;
    
    let panelData = null;
    const productObj = rawData[currentOrder].products[currentProduct];
    if (productObj && productObj.panels) {
        productObj.panels.forEach(p => { if(p.rowIndex == rowIdx) panelData = p; });
    }
    if (!panelData) return; 
    
    if (newVal < 0) return; 
    if (type === 'cut' && newVal > panelData.qtyOrder) return; 

    const getVal = (id) => { 
        const el = document.getElementById(id + '-' + rowIdx); 
        return el ? parseInt(el.value) : 0; 
    };

    // 1. FORWARD LOGIC
    if (change > 0) {
        if (type === 'processed' && newVal > getVal('cut')) { alert("⚠️ Restriction: You must CUT these panels first."); return; }
        if (type === 'edgeFinish' && newVal > getVal('cut')) { alert("⚠️ Restriction: You must CUT these panels first."); return; }
        if (type === 'packed' && newVal > getVal('processed')) { alert("⚠️ Restriction: Packed quantity cannot exceed CNC'd quantity."); return; }
        if (type === 'packed' && newVal > getVal('edgeFinish')) { alert("⚠️ Restriction: Packed quantity cannot exceed Edge Finished quantity."); return; }
    }

    // 2. BACKWARD LOGIC
    if (change < 0) {
        if (type === 'cut' && newVal < getVal('processed')) { alert("⛔ Blocked: Reduce 'CNC\'d' count first."); return; }
        if (type === 'cut' && newVal < getVal('edgeFinish')) { alert("⛔ Blocked: Reduce 'Edge Finished' count first."); return; }
        if (type === 'cut' && newVal < getVal('packed')) { alert("⛔ Blocked: Reduce 'Packed' count first."); return; }
        if (type === 'processed' && newVal < getVal('packed')) { alert("⛔ Blocked: Reduce 'Packed' count first."); return; }
        if (type === 'edgeFinish' && newVal < getVal('packed')) { alert("⛔ Blocked: Reduce 'Packed' count first."); return; }
    }
    
    input.value = newVal;
    if (type === 'cut') panelData.qtyCut = newVal;
    if (type === 'processed') panelData.qtyProcessed = newVal;
    if (type === 'edgeFinish') panelData.qtyEdgeFinish = newVal;
    if (type === 'packed') panelData.qtyPacked = newVal;

    showStatus("Saving...", false);

const key = `${rowIdx}-${type}`;
if (!pendingUpdates[key]) {
  // base = value BEFORE any unsaved changes for this key
  pendingUpdates[key] = {
    rowIndex: rowIdx,
    colName: type,
    base: currentVal,
    delta: 0,
    opId: makeOpId(),
    ts: Date.now()
  };
}
pendingUpdates[key].delta = Number(pendingUpdates[key].delta || 0) + Number(change || 0);
pendingUpdates[key].ts = Date.now();

markUnsaved();

if (saveTimer) clearTimeout(saveTimer);
saveTimer = setTimeout(sendQueueToServer, 500);

  }

  function sendQueueToServer() {
  if (saveInFlight) {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(sendQueueToServer, 300);
    return;
  }

  const sending = pendingUpdates || {};
  const payload = Object.values(sending);

  if (!payload.length) {
    clearUnsavedIfEmptyQueues();
    return;
  }

  // Move current queue to in-flight buffer so new clicks don’t get deleted/overwritten
  inFlightUpdates = sending;
  pendingUpdates = {};

  saveInFlight = true;
  showStatus("Saving.", false);

  google.script.run
    .withSuccessHandler((res) => {
      saveInFlight = false;

      if (!Array.isArray(res)) {
        // Restore anything we were trying to send (unless newer edits already exist)
        for (const k in inFlightUpdates) if (!pendingUpdates[k]) pendingUpdates[k] = inFlightUpdates[k];
        inFlightUpdates = {};
        markUnsaved("Not saved: unexpected server response.");
        showStatus("Not saved", true);
        return;
      }

      res.forEach(r => {
        const key = `${r.rowIndex}-${r.colName}`;
        delete inFlightUpdates[key];

        // If user changed this again while we were saving, DON’T overwrite their newer value
        if (pendingUpdates[key]) return;

        const el = document.getElementById(`${r.colName}-${r.rowIndex}`);
        if (el && r.value !== undefined) el.value = r.value;

        // Update local model only if there’s no newer pending change
        const prod = rawData?.[currentOrder]?.products?.[currentProduct];
        const p = prod?.panels?.find(x => String(x.rowIndex) === String(r.rowIndex));
        if (p && r.value !== undefined) {
          if (r.colName === "cut") p.qtyCut = r.value;
          if (r.colName === "processed") p.qtyProcessed = r.value;
          if (r.colName === "edgeFinish") p.qtyEdgeFinish = r.value;
          if (r.colName === "packed") p.qtyPacked = r.value;
        }
      });

      // If new changes arrived while saving, flush again immediately
      if (Object.keys(pendingUpdates).length > 0) {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(sendQueueToServer, 0);
        markUnsaved();
        return;
      }

      clearUnsavedIfEmptyQueues();
      showStatus("Saved", true);
    })
    .withFailureHandler((err) => {
      saveInFlight = false;
      setHealthBadge(false);

      // Restore in-flight items that don’t have newer versions
      for (const k in inFlightUpdates) if (!pendingUpdates[k]) pendingUpdates[k] = inFlightUpdates[k];
      inFlightUpdates = {};

      markUnsaved("Not saved (connection/server issue).");
      showStatus("Not saved", true);
      console.log("processBatch failed:", err);
    })
    .processBatch(payload);
}

  function commitAdjustment() {
  const rowIndex = parseInt(document.getElementById('adj-row-index').value);
  const type = document.getElementById('adj-type').value;
  const change = parseInt(document.getElementById('adj-qty').value);
  const target = document.getElementById('adj-target') ? document.getElementById('adj-target').value : 'stock';

  const selectVal = document.getElementById('adj-reason').value;
  let finalReason = selectVal;

  if (isNaN(change) || change === 0) { alert("Please enter a valid quantity (e.g. 10 or -5)."); return; }
  if (!selectVal) { alert("Please select a Reason."); return; }

  if (selectVal === 'Other') {
    const manualText = document.getElementById('adj-reason-manual').value.trim();
    if (!manualText) { alert("Please type a reason in the text box."); return; }
    finalReason = manualText;
  }

  bootstrap.Modal.getInstance(document.getElementById('adjustStockModal')).hide();
  showStatus("Updating...", false);

  const refresh = () => {
    google.script.run.withSuccessHandler(d => {
      stockData = d;
      if (type === 'wood') openWoodStock(false);
      if (type === 'comp') openComponentStock(false);
      if (type === 'edge') openEdgeStock(false);
      showStatus("Saved", true);
    }).getInventoryData();
  };

  // WOOD
  if (type === 'wood') {
    if (target === 'onorder') {
      google.script.run.withSuccessHandler(refresh).withFailureHandler(err => alert(err.message)).adjustWoodOnOrder(rowIndex, change);
    } else {
      google.script.run.withSuccessHandler(refresh).withFailureHandler(err => alert(err.message)).adjustWoodStock(rowIndex, change, finalReason);
    }
    return;
  }

  // EDGE
  if (type === 'edge') {
    if (target === 'onorder') {
      google.script.run.withSuccessHandler(refresh).withFailureHandler(err => alert(err.message)).adjustEdgeOnOrder(rowIndex, change);
    } else {
      google.script.run.withSuccessHandler(refresh).withFailureHandler(err => alert(err.message)).adjustEdgeStock(rowIndex, change, finalReason);
    }
    return;
  }

  // COMPONENTS (always stock)
  if (type === 'comp') {
    google.script.run.withSuccessHandler(refresh).withFailureHandler(err => alert(err.message)).adjustComponentStock(rowIndex, change, finalReason);
    return;
  }

  alert("Unknown stock type");
}

  function filterStockByJob() {
  const orderId = currentOrder;
  const bannerSlot = document.getElementById('cnc-filter-banner-slot');
  if (bannerSlot) bannerSlot.innerHTML = "";

  // Safety: if stock not loaded yet
  if (!stockData.wood || !Array.isArray(stockData.wood)) {
    cncWoodViewData = [];
    renderWoodStock(cncWoodViewData, 'cnc');
    return;
  }

  // If no active order context, show all stock
  if (!orderId || !rawData[orderId]) {
    cncWoodViewData = stockData.wood;
    renderWoodStock(cncWoodViewData, 'cnc');
    return;
  }

  // 1) Materials needed for this job (from panels)
  const requiredMaterials = new Set();

  if (rawData[orderId] && rawData[orderId].products) {
    const products = rawData[orderId].products;
    for (const productKey in products) {
      if (products[productKey].panels) {
        products[productKey].panels.forEach(p => {
          if (p.material) {
            const mat = String(p.material).trim().toLowerCase();
            if (mat.length > 2) requiredMaterials.add(mat);
          }
        });
      }
    }
  }

  const reqArray = Array.from(requiredMaterials);

  // 2) Filter wood stock by material match
  const filteredList = stockData.wood.filter(item => {
    const stockMat = String(item.material).trim().toLowerCase();
    if (stockMat.length < 2) return false;

    return reqArray.some(req => stockMat.includes(req) || req.includes(stockMat));
  });

  // 3) Render + banner
  if (filteredList.length > 0) {
    cncWoodViewData = filteredList;
    renderWoodStock(cncWoodViewData, 'cnc');

    if (bannerSlot) {
      bannerSlot.innerHTML = `
        <div class="alert alert-success py-2 mb-2 small shadow-sm">
          Found ${filteredList.length} items for <strong>${rawData[orderId].customer}</strong>
        </div>`;
    }
  } else {
    cncWoodViewData = stockData.wood;
    renderWoodStock(cncWoodViewData, 'cnc');

    if (bannerSlot) {
      bannerSlot.innerHTML = `
        <div class="alert alert-warning py-2 mb-2 small shadow-sm">
          <strong>No Match Found!</strong> Showing all stock.<br>
          Job Needs: "<em>${reqArray.join(', ')}</em>"
        </div>`;
    }
  }
}

function renderShopifyOrdersModal(rows) {
  const listEl = document.getElementById("shopify-orders-list");
  if (!listEl) return;

  if (!rows.length) {
    listEl.innerHTML = `<div class="text-muted text-center py-3">No pending orders.</div>`;

    // Auto-close if nothing left
    if (shopifyOrdersModalInst) {
      setTimeout(() => shopifyOrdersModalInst.hide(), 600);
    }
    reloadAllData();
    return;
  }

  // Group by orderId + customer
  const groups = {};
  rows.forEach(r => {
    const key = `${r.orderId}|||${r.customer}`;
    if (!groups[key]) groups[key] = { orderId: r.orderId, customer: r.customer, lines: [] };
    groups[key].lines.push(r);
  });

  const keys = Object.keys(groups).sort((a,b) => {
    const A = groups[a], B = groups[b];
    return String(B.orderId).localeCompare(String(A.orderId)); // newest first
  });

  const esc = (s) => String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  const accordId = "shopify-orders-accordion";
  let html = `<div class="accordion" id="${accordId}">`;

  keys.forEach((k, idx) => {
    const g = groups[k];
    const lines = g.lines;

    const collapseId = `so-collapse-${idx}`;
    const headingId = `so-heading-${idx}`;

    // Totals for header (clear and unambiguous)
    const totalOrdered = lines.reduce((s, r) => s + (Number(r.qtyOrdered) || 0), 0);
    const totalAllocated = lines.reduce((s, r) => s + (Number(r.allocatedFromStock) || 0), 0);
    const totalToBuild = Math.max(0, totalOrdered - totalAllocated);

    const rowsHtml = lines.map(r => {
      const rowIndex = Number(r.rowIndex);
      const ordered = Number(r.qtyOrdered) || 0;
      const inStock = Number(r.availableInStock) || 0;
      const allocated = Number(r.allocatedFromStock) || 0;
      const toBuild = Math.max(0, ordered - allocated);
      const suggested = Number(r.recommendedAllocate) || 0;

      const busy = shopifyBusyRows.has(rowIndex);
      const disableAlloc = busy || (inStock <= 0) || (toBuild <= 0);
      const disableApprove = busy;

      return `
        <tr style="${busy ? "opacity:0.6;" : ""}">
          <td>
            <div class="fw-bold">${esc(r.productName)}</div>
            <div class="small text-muted">SKU ${esc(r.sku)}</div>

            <div class="small mt-1">
              <span class="badge bg-dark me-1">Ordered ${ordered}</span>
              <span class="badge bg-primary me-1">Allocated ${allocated}</span>
              <span class="badge bg-warning text-dark">To Build ${toBuild}</span>
            </div>

            <div class="small text-muted mt-2">
              ✅ Approve will <strong>import the full order</strong> but will <strong>pre-fill progress</strong> for the Allocated qty.
            </div>
          </td>

          <td class="text-center">
            <span class="badge ${inStock > 0 ? "bg-success" : "bg-secondary"}">${inStock}</span>
          </td>

          <td class="text-end" style="white-space:nowrap;">
            <button class="btn btn-outline-dark btn-sm rounded-pill me-1"
                    onclick="approveShopifyLine(${rowIndex}, this)"
                    ${disableApprove ? "disabled" : ""}>
              Import (Build ${toBuild})
            </button>

            <button class="btn btn-dark btn-sm rounded-pill"
                    onclick="allocateShopifyLine(${rowIndex}, ${inStock}, ${toBuild}, ${suggested})"
                    ${disableAlloc ? "disabled" : ""}>
              Allocate Stock
            </button>
          </td>
        </tr>
      `;
    }).join("");

    html += `
      <div class="accordion-item border-0 mb-2 room-acc">
        <h2 class="accordion-header" id="${headingId}">
          <div class="d-flex align-items-center gap-2">
            <button class="accordion-button collapsed room-acc-btn flex-grow-1"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#${collapseId}"
                  aria-expanded="false"
                  aria-controls="${collapseId}">
              <div class="d-flex w-100 justify-content-between align-items-center">
                <div class="fw-bold text-dark">${esc(g.customer)} — #${esc(g.orderId)}</div>
                <div class="d-flex gap-2 flex-wrap justify-content-end align-items-center">
                  <span class="badge bg-dark">Ordered ${totalOrdered}</span>
                  <span class="badge bg-primary">Allocated ${totalAllocated}</span>
                  <span class="badge bg-warning text-dark">To Build ${totalToBuild}</span>
                </div>
              </div>
            </button>
            <div class="d-flex gap-1 flex-shrink-0">
              <button class="btn btn-outline-dark btn-sm rounded-pill"
                      type="button"
                      onclick='openSmartOrder(${jsStr(g.orderId)})'>
                🧠 Smart Order
              </button>
            </div>
          </div>
        </h2>

        <div id="${collapseId}" class="accordion-collapse collapse"
             aria-labelledby="${headingId}"
             data-bs-parent="#${accordId}">
          <div class="accordion-body pt-2">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                  <tr class="text-secondary small">
                    <th>SKU / Breakdown</th>
                    <th class="text-center" style="width:120px;">In Stock</th>
                    <th class="text-end" style="width:260px;">Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>

            <div class="small text-muted mt-2">
              You can close this anytime and continue later — imported lines disappear automatically.
            </div>
          </div>
        </div>
      </div>
    `;
  });

  html += `</div>`;
  listEl.innerHTML = html;
}

function runSmartOrderAuthorization(orderId) {
  const bodyEl = document.getElementById("smart-order-body");

    bodyEl.innerHTML = `<div class="text-center text-muted py-4"><div class="spinner-border"></div><div class="mt-2">Checking authorization…</div></div>`;
  } else {
    alert("Running Smart Order authorization check…");
  }

  google.script.run
    .withSuccessHandler(result => {
      const statusMsg = escHtml(result && result.message ? result.message : "Authorization check completed.");
      const detail = result && result.orderId
        ? `<div class="small text-muted mt-1">Sample order used: <code>${escHtml(result.orderId)}</code></div>`
        : "";
      if (bodyEl) {
        bodyEl.innerHTML = `
          <div class="alert alert-success mb-3">${statusMsg}${detail}</div>
          <div class="text-center">
            <button class="btn btn-dark btn-sm rounded-pill" onclick='openSmartOrder(${jsStr(orderId)})'>Retry Smart Order</button>
          </div>
        `;
      } else {
        alert(`${statusMsg} Try Smart Order again.`);
      }
      openSmartOrder(orderId);
    })
    .withFailureHandler(err => {
      const message = err && err.message ? err.message : "Authorization check failed.";
      if (bodyEl) {
        bodyEl.innerHTML = `
          <div class="text-danger">${escHtml(message)}</div>

function openSmartOrder(orderId) {
  const modalEl = document.getElementById("smartOrderModal");
  const bodyEl = document.getElementById("smart-order-body");

      document.body.classList.remove("modal-open");
      document.body.style.removeProperty("padding-right");
    });
  }

  currentSmartOrderId = orderId;
  currentSmartOrderData = null;
  setSmartOrderExportState(true, "📄 Export to Google Sheets");

  titleEl.innerText = `Smart Order • #${orderId}`;
  bodyEl.innerHTML = `
    <div class="text-center text-muted py-4">
      <div class="spinner-border"></div>
      <div class="mt-2">Loading Smart Order…</div>
    </div>
    <div class="d-flex gap-2 justify-content-center mt-2">

    </div>
  `;
  smartOrderModalInst.show();

  let rpcCompleted = false;
  const authDialogTimeout = setTimeout(() => {
    if (rpcCompleted) return;
    bodyEl.innerHTML = `
      <div class="alert alert-warning mb-0">
        <strong>Still loading Smart Order…</strong><br>
        If it doesn't load, click <strong>Retry</strong> below.

        <button class="btn btn-outline-dark btn-sm rounded-pill" type="button" onclick='openSmartOrder(${jsStr(orderId)})'>Retry</button>

    `;
  }, 5000);

  console.log("[SmartOrder] requesting summary", { orderId });

  google.script.run
    .withSuccessHandler(data => {
      console.log("[SmartOrder] summary success", data);
      rpcCompleted = true;
      clearTimeout(authDialogTimeout);
      renderSmartOrderModal(data);
    })
    .withFailureHandler(err => {
      console.error("[SmartOrder] summary failed", err);
      rpcCompleted = true;
      clearTimeout(authDialogTimeout);
      const message = err && err.message ? err.message : "Unknown error.";
      const lowerMsg = String(message).toLowerCase();
      const authHint = lowerMsg.includes("authorization") || lowerMsg.includes("authorize")
        || lowerMsg.includes("access") || lowerMsg.includes("permission")
        || lowerMsg.includes("oauth");
      const hintHtml = authHint
        ? `<div class="alert alert-warning mt-3">
            <strong>Authorization needed.</strong>
            This feature reads from external sheets. Please open the Apps Script project,
            run <code>authorizeSmartOrderAccess</code> once, and complete the Google authorization flow.
            Also confirm the executing account has access to the Shopify Orders + Product Recipe sheets.
          </div>`
        : "";
      setSmartOrderExportState(true, "📄 Export to Google Sheets");
      bodyEl.innerHTML = `
        <div class="text-danger">Error: ${escHtml(message)}</div>
        ${hintHtml}
      `;
    })
    .getSmartOrderSummary(orderId);
}

function buildSmartOrderSummaryTables(totals, sheetSizes) {
  const wood = totals.wood || [];
  const edge = totals.edge || [];
  const components = totals.components || [];

  return `
    ${buildWoodTable(wood, sheetSizes)}
    ${buildEdgeTable(edge)}
    ${buildComponentsTable(components)}
  `;
}

function buildSmartOrderProducts(products, sheetSizes) {
  const accordId = "smart-order-products";
  const items = products.map((prod, idx) => {
    const collapseId = `smart-prod-${idx}`;
    const headerId = `smart-prod-head-${idx}`;
    return `
      <div class="accordion-item border-0 mb-3">

                  aria-expanded="false" aria-controls="${collapseId}">

function buildWoodTable(items, sheetSizes) {
  if (!items.length) {
    return `<div class="smart-order-empty text-muted">No sheet materials required.</div>`;
  }

  const rows = items.map(item => {
    const sheetLabel = item.type === "mdf" ? (sheetSizes?.mdf || "2800 x 2070mm")
      : item.type === "ply" ? (sheetSizes?.ply || "3050 x 1220mm")
      : "Unknown sheet";

function allocateShopifyLine(shopifyRowIndex, inStock, remainingToAllocate, suggested) {
  const maxAlloc = Math.min(Number(inStock) || 0, Number(remainingToAllocate) || 0);
  if (maxAlloc <= 0) { alert("No stock available to allocate for this line."); return; }

  const def = Math.min(Number(suggested) || maxAlloc, maxAlloc);
  const entered = prompt(`Allocate how many from stock now? (1-${maxAlloc})`, String(def));
  if (entered === null) return;

  const qty = parseInt(entered, 10);
  if (!qty || qty < 1 || qty > maxAlloc) { alert("Invalid quantity."); return; }

  shopifyBusyRows.add(shopifyRowIndex);
  showStatus("Allocating...", false);

  google.script.run
    .withSuccessHandler(() => {
      showStatus("Allocated!", true);
      shopifyBusyRows.delete(shopifyRowIndex);

      // refresh stock + orders list + app UI
      refreshShopifyOrdersModal();
      reloadAllData();
    })
    .withFailureHandler(err => {
      shopifyBusyRows.delete(shopifyRowIndex);
      alert("Allocation failed: " + err.message);
      showStatus("Error", true);
      refreshShopifyOrdersModal();
    })
    .allocateFinishedGoodsToOrder(shopifyRowIndex, qty);
}

function chooseShopifyMergeTarget(context) {
  const safe = context || {};
  const customer = norm(safe.customer) || 'This customer';
  const existingTargetId = norm(safe.existingMergeTargetId);
  const candidates = Array.isArray(safe.candidates) ? safe.candidates : [];

  if (existingTargetId) return existingTargetId;
  if (!candidates.length) return "";

  const options = ['0. Keep as a separate order'];
  candidates.forEach((candidate, idx) => {
    const label = Array.isArray(candidate.displayOrderIds) && candidate.displayOrderIds.length
      ? candidate.displayOrderIds.join(' & ')
      : candidate.targetOrderId;
    options.push(`${idx + 1}. Merge with existing order #${label}`);
  });

  const promptText = [
    `${customer} already has an active manufacturing order.`,
    '',
    ...options,
    '',
    'Enter the number of your choice:'
  ].join('\n');

  const entered = prompt(promptText, candidates.length === 1 ? '1' : '0');
  if (entered === null) return null;

  const choice = parseInt(entered, 10);
  if (Number.isNaN(choice) || choice < 0 || choice > candidates.length) {
    alert('Invalid choice. Import cancelled.');
    return null;
  }

  return choice === 0 ? '' : norm(candidates[choice - 1].targetOrderId);
}

function approveShopifyLine(shopifyRowIndex, btnElement) {
  if (!confirm("Approve & import this line into Manufacturing/Delivery now?")) return;

  if (btnElement) {
    btnElement.disabled = true;
    btnElement.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Importing...';
  }

  shopifyBusyRows.add(shopifyRowIndex);
  showStatus("Checking merge options...", false);

  const resetButton = (label = "Import (Build)") => {
    if (!btnElement) return;
    btnElement.disabled = false;
    btnElement.innerText = label;
  };

  google.script.run
    .withSuccessHandler(context => {
      const mergeTargetOrderId = chooseShopifyMergeTarget(context);
      if (mergeTargetOrderId === null) {
        shopifyBusyRows.delete(shopifyRowIndex);
        showStatus("Cancelled", true);
        resetButton();
        return;
      }

      showStatus("Importing...", false);
      google.script.run
        .withSuccessHandler(res => {
          shopifyBusyRows.delete(shopifyRowIndex);

          if (!String(res).startsWith("SUCCESS") && String(res) !== "Already imported") {
            alert("Import result: " + res);
            resetButton('Retry Import');
            return;
          }

          const importedMsg = String(res).startsWith('SUCCESS|MERGED|')
            ? `Imported and merged into Order #${String(res).split('|')[2]}.`
            : 'Imported!';
          showStatus(importedMsg, true);
          refreshShopifyOrdersModal();
          reloadAllData();
        })
        .withFailureHandler(err => {
          shopifyBusyRows.delete(shopifyRowIndex);
          alert("Approve/Import failed: " + err.message);
          showStatus("Error", true);
          resetButton('Import (Retry)');
        })
        .approveAndImportShopifyRow(shopifyRowIndex, mergeTargetOrderId || "");
    })
    .withFailureHandler(err => {
      shopifyBusyRows.delete(shopifyRowIndex);
      alert("Could not check merge options: " + err.message);
      showStatus("Error", true);
      resetButton('Import (Retry)');
    })
    .getShopifyMergeOptions(shopifyRowIndex);
}

    delivery: { bucket: {}, rooms: {} },
    memberOrderIds: [],
    displayOrderIds: [wsKey],

  };

function findComponentGlobally(rowIndex) {
  if (!rawData) return null;
  // Search every order -> every product -> every component list
  for (const ord of Object.values(rawData)) {
    if (!ord.products) continue;
    for (const prod of Object.values(ord.products)) {

function queueCompDelta(rowIndex, delta) {
  const key = String(rowIndex);

  if (!pendingCompUpdates[key]) {
    pendingCompUpdates[key] = {
      rowIndex,
      mode: "inc",
      delta: 0,
      opId: makeOpId(),
      ts: Date.now()
    };
  }

  // If a SET is already queued, don’t switch modes; just adjust the target
  if (pendingCompUpdates[key].mode === "set") {
    pendingCompUpdates[key].value = Number(pendingCompUpdates[key].value || 0) + Number(delta || 0);
  } else {
    pendingCompUpdates[key].delta = Number(pendingCompUpdates[key].delta || 0) + Number(delta || 0);
  }

  pendingCompUpdates[key].ts = Date.now();
  showStatus("Saving...", false);
  markUnsaved();

  if (compSaveTimer) clearTimeout(compSaveTimer);
  compSaveTimer = setTimeout(sendCompQueueToServer, 400);
}

function queueCompSet(rowIndex, base, value) {
  const key = String(rowIndex);

  pendingCompUpdates[key] = {
    rowIndex,
    mode: "set",
    base: Number(base || 0),
    value: Number(value || 0),
    opId: makeOpId(),
    ts: Date.now()
  };

  showStatus("Saving...", false);
  markUnsaved();

  if (compSaveTimer) clearTimeout(compSaveTimer);
  compSaveTimer = setTimeout(sendCompQueueToServer, 400);
}


function sendCompQueueToServer() {
  if (compSaveInFlight) {
    if (compSaveTimer) clearTimeout(compSaveTimer);
    compSaveTimer = setTimeout(sendCompQueueToServer, 300);
    return;
  }

  const sending = pendingCompUpdates || {};
  const payload = Object.values(sending);

  if (!payload.length) {
    clearUnsavedIfEmptyQueues();
    return;
  }

  inFlightCompUpdates = sending;
  pendingCompUpdates = {};

  compSaveInFlight = true;
  showStatus("Saving.", false);

  google.script.run
    .withSuccessHandler((res) => {
      compSaveInFlight = false;

      if (!Array.isArray(res)) {
        for (const k in inFlightCompUpdates) if (!pendingCompUpdates[k]) pendingCompUpdates[k] = inFlightCompUpdates[k];
        inFlightCompUpdates = {};
        markUnsaved("Not saved: unexpected server response.");
        showStatus("Not saved", true);
        return;
      }

      res.forEach(r => {
        const key = String(r.rowIndex);
        delete inFlightCompUpdates[key];

        if (r.conflict) {
          // Re-queue what we attempted if there’s no newer edit already
          if (!pendingCompUpdates[key]) pendingCompUpdates[key] = sending[key];
          markUnsaved("Conflict: someone else updated components. Reload & retry.");
          return;
        }

        if (r.outOfStock) {
          const available = (r.available !== undefined) ? ` Available: ${r.available}.` : "";
          alert(`Out of stock for this component.${available}`);
          const el = document.getElementById(`comp-packed-${r.rowIndex}`);
          if (el && r.current !== undefined) el.value = r.current;

          const c = getCompByRow(r.rowIndex);
          if (c && r.current !== undefined) c.qtyPacked = r.current;
          return;
        }

        // If user changed again while saving, don't overwrite UI
        if (pendingCompUpdates[key]) return;

        const el = document.getElementById(`comp-packed-${r.rowIndex}`);
        if (el && r.value !== undefined) el.value = r.value;

        const c = getCompByRow(r.rowIndex);
        if (c && r.value !== undefined) c.qtyPacked = r.value;
      });

      if (Object.keys(pendingCompUpdates).length > 0) {
        if (compSaveTimer) clearTimeout(compSaveTimer);
        compSaveTimer = setTimeout(sendCompQueueToServer, 0);
        markUnsaved();
        return;
      }

      clearUnsavedIfEmptyQueues();
      showStatus("Saved", true);
    })
    .withFailureHandler((err) => {
      compSaveInFlight = false;
      setHealthBadge(false);

      for (const k in inFlightCompUpdates) if (!pendingCompUpdates[k]) pendingCompUpdates[k] = inFlightCompUpdates[k];
      inFlightCompUpdates = {};

      markUnsaved("Not saved (connection/server issue).");
      showStatus("Not saved", true);
      console.log("Component save failed:", err);
    })
    .processComponentBatch(payload);
}



function compStep(e, rowIndex, dir) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const c = getCompByRow(rowIndex);
  if (!c) return;

  const per = Number(c.qtyPerUnit) || 1;
  const req = Number(c.qtyRequired) || 0;
  const cur = Number(c.qtyPacked) || 0;

  let next = cur + (dir * per);
  if (next < 0) next = 0;
  if (req > 0 && next > req) next = req;

  c.qtyPacked = next;

  const input = document.getElementById('comp-packed-' + rowIndex);
  if (input) input.value = next;

  queueCompDelta(rowIndex, next - cur);

}

function compSetExact(e, rowIndex, rawVal) {
  if (e) { e.stopPropagation(); }

  const c = getCompByRow(rowIndex);
  if (!c) return;

  const req = Number(c.qtyRequired) || 0;
  const cur = Number(c.qtyPacked) || 0;

  let next = parseInt(rawVal, 10);
  if (isNaN(next)) next = 0;

  if (next < 0) next = 0;
  if (req > 0 && next > req) next = req;

  c.qtyPacked = next;
  queueCompSet(rowIndex, cur, next);
}


function calcPanelGate(prodData, requiredUnits) {
  const panels = (prodData && prodData.panels) ? prodData.panels : [];
  let minUnits = Infinity;
  let limiter = null;

  const lines = panels.map(p => {
    const per = Number(p.qtyPerUnit) || 1;
    const packed = Number(p.qtyPacked) || 0;
    const required = Number(p.qtyOrder) || 0;
    const units = Math.floor(packed / per);

    if (units < minUnits) {
      minUnits = units;
      limiter = { name: p.panelName, packed, required, per, units };
    }

    return { type: "Panel", name: p.panelName, packed, required, per, units };
  });

  if (minUnits === Infinity) minUnits = 0;
  const ready = Math.min(minUnits, requiredUnits);

  return { ready, limiter, lines };
}

function calcCompGate(prodData, requiredUnits) {
  const comps = (prodData && prodData.components) ? prodData.components : [];
  let minUnits = Infinity;
  let limiter = null;

  const lines = comps.map(c => {
    const per = Number(c.qtyPerUnit) || 1;
    const packed = Number(c.qtyPacked) || 0;
    const required = Number(c.qtyRequired) || 0;
    const units = Math.floor(packed / per);

    if (units < minUnits) {
      minUnits = units;
      limiter = { name: c.compName, packed, required, per, units };
    }

    return { type: "Component", name: c.compName, packed, required, per, units };
  });

  // If no components exist, treat as "not limiting"
  if (minUnits === Infinity) minUnits = 999999;
  const ready = Math.min(minUnits, requiredUnits);

  return { ready, limiter, lines };
}

function openGateModal(evt, prodName) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }

  const orderObj = rawData[currentOrder];
  if (!orderObj || !orderObj.products || !orderObj.products[prodName]) return;

  const prodData = orderObj.products[prodName];

  // Required units for this product
  const del = getDeliveryTotals(orderObj, prodName);
  const requiredUnits = getRequiredUnits(prodData, del.total);

  const panelGate = calcPanelGate(prodData, requiredUnits);
  const compGate = calcCompGate(prodData, requiredUnits);

  // Build "blockers" list (only items below requiredUnits)
  const blockers = []
    .concat(panelGate.lines, compGate.lines)
    .filter(x => x.units < requiredUnits)
    .sort((a, b) => a.units - b.units)
    .slice(0, 3);

  // UI text
  document.getElementById("gateTitle").innerText = `${prodName} (Req: ${requiredUnits})`;

  const panelLine = panelGate.limiter
    ? `${panelGate.ready} / ${requiredUnits} (limiting: ${panelGate.limiter.name})`
    : `${panelGate.ready} / ${requiredUnits}`;

  const compLine = compGate.limiter && compGate.ready < requiredUnits
    ? `${compGate.ready} / ${requiredUnits} (limiting: ${compGate.limiter.name})`
    : `${compGate.ready} / ${requiredUnits}${(prodData.components && prodData.components.length) ? "" : " (no components tracked)"}`;

  let blockersHtml = "";
  if (!blockers.length) {
    blockersHtml = `<div class="text-success fw-bold">✅ No blockers — fully manufactured</div>`;
  } else {
    blockersHtml = blockers.map(b => {
      const label = (b.type === "Panel") ? "Panels" : "Components";
      return `
        <div class="border rounded-3 p-2 mb-2">
          <div class="fw-bold">${label}: ${b.name}</div>
          <div class="small text-muted">
            Packed ${b.packed} / Required ${b.required}  •  ${b.units} unit(s)
          </div>
        </div>
      `;
    }).join("");
  }

  document.getElementById("gateBody").innerHTML = `
    <div class="mb-3">
      <div class="fw-bold">Panels ready:</div>
      <div class="text-muted">${panelLine}</div>
    </div>

    <div class="mb-3">
      <div class="fw-bold">Components ready:</div>
      <div class="text-muted">${compLine}</div>
    </div>

    <hr>

    <div class="fw-bold mb-2">Top blockers:</div>
    ${blockersHtml}
  `;

  new bootstrap.Modal(document.getElementById("gateModal")).show();
}

function findProductKey(orderId, productName) {
