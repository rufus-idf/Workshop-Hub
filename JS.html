// POLLING FOR NEW ORDERS
function summarizePendingOrders(rows) {
  const safeRows = Array.isArray(rows) ? rows : [];
  const unique = new Set();

  safeRows.forEach(r => {
    const orderId = String((r && r.orderId) || "").trim().toLowerCase();
    const customer = String((r && r.customer) || "").trim().toLowerCase();
    if (!orderId) return;
    unique.add(`${orderId}|||${customer}`);
  });

  return {
    orderCount: unique.size,
    lineCount: safeRows.length
  };
}

function setOrderPendingIndicator(summary) {
  const orderCount = Number(summary && summary.orderCount) || 0;
  const lineCount = Number(summary && summary.lineCount) || 0;
  const hasPending = orderCount > 0;

  const badge = document.getElementById("order-badge");
  if (badge) badge.classList.toggle("hidden", !hasPending);

  const pill = document.getElementById("order-pending-pill");
  if (pill) {
    if (hasPending) {
      const orderWord = orderCount === 1 ? "order" : "orders";
      pill.textContent = `${orderCount} ${orderWord} waiting`;
      pill.classList.remove("hidden");
    } else {
      pill.classList.add("hidden");
    }
  }

  const banner = document.getElementById("orders-pending-banner");
  const countEl = document.getElementById("orders-pending-count");
  const linesEl = document.getElementById("orders-pending-lines");
  if (banner && countEl) {
    countEl.textContent = String(orderCount);
    banner.classList.toggle("hidden", !hasPending);
  }
  if (linesEl) {
    const lineWord = lineCount === 1 ? "line item" : "line items";
    linesEl.textContent = `(${lineCount} ${lineWord})`;
  }

  const btn = document.getElementById("orders-btn");
  if (btn) btn.classList.toggle("pending-attention", hasPending);
}

// Normalise strings (kills weird spaces + trims)
const norm = (v) => String(v ?? "").replace(/\u00A0/g, " ").trim();
const squeezeSpaces = (v) => norm(v).replace(/\s+/g, " ");
const roomKey = (v) => squeezeSpaces(v).toLowerCase().replace(/[^a-z0-9]/g, "");
const canonicalRoomName = (v) => {
  const cleaned = squeezeSpaces(v);
  if (!cleaned) return "";

  const roomWithDigits = cleaned.match(/^room\s*([a-z0-9-]+)$/i);
  if (roomWithDigits) return `Room ${roomWithDigits[1].toUpperCase()}`;

  return cleaned.replace(/\b\w/g, ch => ch.toUpperCase());
};

}

function getOffcutGeometryMetrics(item) {
  const vertices = Array.isArray(item?.vertices) ? item.vertices : [];
  if (!vertices.length) {
    return { points: [], minX: 0, minY: 0, width: 1, height: 1, edges: [] };
  }

  const points = vertices.map(pair => [Number(pair?.[0]) || 0, Number(pair?.[1]) || 0]);
  let minX = points[0][0];
  let minY = points[0][1];
  let maxX = points[0][0];
  let maxY = points[0][1];
  points.forEach(([x, y]) => {
    minX = Math.min(minX, x);
    minY = Math.min(minY, y);
    maxX = Math.max(maxX, x);
    maxY = Math.max(maxY, y);
  });

  const edges = points.map((point, idx) => {
    const next = points[(idx + 1) % points.length];
    const dx = next[0] - point[0];
    const dy = next[1] - point[1];
    const length = Math.sqrt(dx * dx + dy * dy);
    return {
      x1: point[0], y1: point[1], x2: next[0], y2: next[1],
      midX: (point[0] + next[0]) / 2,
      midY: (point[1] + next[1]) / 2,
      length
    };
  });

  return {
    points,
    minX,
    minY,
    width: Math.max(1, maxX - minX),
    height: Math.max(1, maxY - minY),
    edges
  };
}

function buildOffcutPreviewSvg(item) {
  const metrics = getOffcutGeometryMetrics(item);
  if (!metrics.points.length) return '<div class="text-center text-muted py-5">No geometry available for this offcut.</div>';

  const padding = 120;
  const viewBoxWidth = metrics.width + padding * 2;
  const viewBoxHeight = metrics.height + padding * 2;
  const offsetX = padding - metrics.minX;
  const offsetY = padding - metrics.minY;
  const outlinePoints = metrics.points.map(([x, y]) => `${x + offsetX},${y + offsetY}`).join(' ');
  const holes = (Array.isArray(item?.holes) ? item.holes : []).filter(poly => Array.isArray(poly) && poly.length >= 3);

  const holeMarkup = holes.map(poly => {
    const pts = poly.map(([x, y]) => `${(Number(x) || 0) + offsetX},${(Number(y) || 0) + offsetY}`).join(' ');
    return `<polygon class="offcut-preview-hole" points="${pts}"></polygon>`;
  }).join('');

  const edgeLabels = metrics.edges.map(edge => {
    const x = edge.midX + offsetX;
    const y = edge.midY + offsetY;
    return `<text class="offcut-preview-label" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${fmtNum(edge.length, 1)}</text>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${viewBoxWidth} ${viewBoxHeight}" role="img" aria-label="Offcut ${escHtml(item?.offcutId || '')} preview">
      <rect x="0" y="0" width="${viewBoxWidth}" height="${viewBoxHeight}" fill="#ffffff"></rect>
      <polygon class="offcut-preview-shape" points="${outlinePoints}"></polygon>
      ${holeMarkup}
      ${edgeLabels}
    </svg>`;
}

let deliveryStats = { order: { ready: 0, onSite: 0, avail: 0 }, products: {} };

function computeDeliveryStatsForCurrentOrder() {
  const orderObj = rawData[currentOrder];
  if (!orderObj || !orderObj.products) {
    deliveryStats = { order: { ready: 0, onSite: 0, avail: 0 }, products: {} };
    return deliveryStats;
  }

  const stats = { order: { ready: 0, onSite: 0, avail: 0 }, products: {} };

  for (const prodKey in orderObj.products) {
  const prodName = norm(prodKey);
  const prodData = orderObj.products[prodKey];

  const del = getDeliveryTotals(orderObj, prodName);
  const required = getRequiredUnits(prodData, del.total);

  const ready = Math.min(getManufacturedUnits(prodData), required);
  const onSite = Math.min(del.delivered, required);
  const avail = Math.max(0, ready - onSite);

  stats.products[prodName] = { required, ready, onSite, avail };

  stats.order.ready += ready;
  stats.order.onSite += onSite;
  stats.order.avail += avail;
}


  deliveryStats = stats;
  return stats;
}

function renderDeliverySummary() {
  if (!currentOrder) return;
  const stats = computeDeliveryStatsForCurrentOrder();
  renderDeliveryProductSummary(stats); // ✅ only per-product table now
}



function getDeliveryTotals(orderObj, prodName) {
  prodName = norm(prodName);
  let total = 0;
  let delivered = 0;
  let fitted = 0;
  const del = (orderObj && orderObj.delivery) ? orderObj.delivery : { bucket: {}, rooms: {} };

  if (del.bucket && del.bucket[prodName]) {
    total += Number(del.bucket[prodName].qty) || 0;
  }

  if (del.rooms) {
    for (const room in del.rooms) {
      del.rooms[room].forEach(item => {
        if (norm(item.name) === prodName) {
          const q = Number(item.qty) || 0;
          total += q;
          if (item.status === "Delivered" || item.status === "Fitted") delivered += q;
          if (item.status === "Fitted") fitted += q;
        }
      });
    }
  }

  return { total, delivered, fitted };
}

function renderDeliveryProductSummary(stats) {
  const tbody = document.getElementById("deliv-prod-summary-body");
  if (!tbody) return;

  const products = stats && stats.products ? stats.products : {};
  const keys = Object.keys(products);

  if (!keys.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">No delivery items.</td></tr>`;
    return;
  }

  // Sort: most available first, then by name
  keys.sort((a, b) => {
    const A = products[a], B = products[b];
    if ((B.avail || 0) !== (A.avail || 0)) return (B.avail || 0) - (A.avail || 0);
    return String(a).localeCompare(String(b));
  });

  tbody.innerHTML = keys.map(name => {
    const s = products[name] || { required:0, ready:0, onSite:0, avail:0 };
    const availClass = (s.avail > 0) ? "text-success fw-bold" : "text-muted";

    return `
      <tr>
        <td class="ps-3 fw-bold text-dark">${name}</td>
        <td class="text-center">${s.required}</td>
        <td class="text-center">${s.ready}</td>
        <td class="text-center">${s.onSite}</td>
        <td class="text-center ${availClass}">${s.avail}</td>
      </tr>
    `;
  }).join("");
}

function getRequiredUnits(prodData, deliveryTotal) {
  // Prefer delivery count if it exists (that is the furniture qty)
  if (deliveryTotal > 0) return deliveryTotal;

  // Fallback for Workshop Stock (no delivery rows)
  if (prodData && prodData.panels && prodData.panels.length) {
    let maxUnits = 0;
    prodData.panels.forEach(p => {
      const per = Number(p.qtyPerUnit) || 1;
      const qtyOrder = Number(p.qtyOrder) || 0;
      const units = per ? Math.round(qtyOrder / per) : 0;
      if (units > maxUnits) maxUnits = units;
    });
    return maxUnits;
  }

  return 0;
}

function getManufacturedUnits(prodData) {
  // Panels limiting factor
  let panelUnits = Infinity;
  const panelTotals = {};

  if (prodData && prodData.panels && prodData.panels.length) {
    prodData.panels.forEach(p => {
      const per = Number(p.qtyPerUnit) || 1;
      const packed = Number(p.qtyPacked) || 0;
      const key = String(p.panelName || "");
      if (!panelTotals[key]) panelTotals[key] = { packed: 0, per };
      panelTotals[key].packed += packed;
    });
  }

  Object.keys(panelTotals).forEach(key => {
    const entry = panelTotals[key];
    const sets = Math.floor((Number(entry.packed) || 0) / (Number(entry.per) || 1));
    if (sets < panelUnits) panelUnits = sets;
  });

  if (panelUnits === Infinity) panelUnits = 0;

  // Components limiting factor (qty-based)
let compUnits = Infinity;

if (prodData && prodData.components && prodData.components.length) {
  prodData.components.forEach(c => {
    const per = Number(c.qtyPerUnit) || 1;
    const packed = Number(c.qtyPacked) || 0;
    const sets = Math.floor(packed / per);
    if (sets < compUnits) compUnits = sets;
  });
}

if (compUnits === Infinity) compUnits = 999999;

return Math.min(panelUnits, compUnits);

}

function renderBreadcrumbs() {
  const el = document.getElementById("breadcrumb-bar");
  if (!el) return;

  el.innerHTML = "";
  el.classList.toggle("active", breadcrumbs.length > 0);

  breadcrumbs.forEach((c, i) => {
    const isLast = (i === breadcrumbs.length - 1);

    if (!c.onClick || isLast) {
      const span = document.createElement("span");
      span.textContent = c.label;
      el.appendChild(span);
    } else {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = c.label;
      a.onclick = (e) => {
        e.preventDefault();
        c.onClick();
      };
      el.appendChild(a);
    }

    if (!isLast) {
      const sep = document.createElement("span");
      sep.className = "breadcrumb-sep";
      sep.textContent = "/";
      el.appendChild(sep);
    }
  });
}

  const slot = view.querySelector(".breadcrumb-slot");

  if (!target.contains(crumb)) target.appendChild(crumb);

  // --- 1. JOB LIST (Updated for Stock Split) ---
  // --- 1. JOB LIST (Updated: Split Stock/Client, Clean History) ---
  function renderJobs() {
    document.getElementById('loading').classList.add('hidden');
    const list = document.getElementById('job-list');
    list.innerHTML = '';

    // 1. Sort Orders (Newest First)
    const sortedIds = Object.keys(rawData || {}).sort((a,b) => b.localeCompare(a));

    let visibleCount = 0;

    for (const id of sortedIds) {
      const details = rawData[id];
      const custName = String(details.customer || "").trim();

      // Identify type
      const isWorkshop = (custName.toLowerCase() === 'workshop stock');

      let orderRequired = 0;
      let orderManufactured = 0;
      let orderDelivered = 0;
      let orderFitted = 0;
      let lines = '';

      // 2. Calculate Totals
      for (const prodName in details.products) {
        const prodData = details.products[prodName];

        const del = getDeliveryTotals(details, prodName);
        const required = getRequiredUnits(prodData, del.total);
        const manufactured = Math.min(getManufacturedUnits(prodData), required);
        const delivered = Math.min(del.delivered, required);
        const fitted = Math.min(del.fitted || 0, required);

        orderRequired += required;
        orderManufactured += manufactured;
        orderDelivered += delivered;
        orderFitted += fitted;

        // Custom text based on type
        const lineText = isWorkshop
           ? `${required}x ${prodName} — ${manufactured} ready`
           : `${required}x ${prodName}`;

        if (isWorkshop) {
          lines += `
            <div class="d-flex justify-content-between align-items-center mt-1">
              <div class="fw-semibold">${lineText}</div>
              <div class="text-muted small">${manufactured} ready</div>
            </div>
          `;
        } else {
          lines += `
            <div class="d-flex justify-content-between align-items-center mt-1">
              <div class="fw-semibold">${lineText}</div>
              <div class="text-muted small">${manufactured} manufactured • ${delivered} delivered</div>
            </div>
          `;
        }
      }

      // 3. Check Completion
      let isComplete = false;
      if (orderRequired > 0) {
          if (isWorkshop) isComplete = (orderManufactured >= orderRequired);
          else isComplete = (orderFitted >= orderRequired);
      }

      // --- 4. THE FILTERING LOGIC (Your Request) ---

      if (currentTab === 'active') {
          // Client Jobs: Must be Client AND Not Complete
          if (isWorkshop || isComplete) continue;
      }
      else if (currentTab === 'stock') {
          // Stock Builds: Must be Workshop AND Not Complete
          // (If complete, it disappears from app entirely)
          if (!isWorkshop || isComplete) continue;
      }
      else if (currentTab === 'history') {
          // History: Must be Client AND Complete
          // (Workshop jobs never appear here)
          if (isWorkshop || !isComplete) continue;
      }

      visibleCount++;

      // 5. Render Card
      const card = document.createElement('div');
      card.className = 'card p-3';

      if (currentTab === 'stock') {
          // --- STOCK CARD STYLE (Purple, Direct to Manufacturing) ---
          const manufPercent = orderRequired > 0 ? Math.round((orderManufactured / orderRequired) * 100) : 0;

          card.style.borderLeft = "5px solid #764ba2"; // Distinct purple marker
          card.onclick = () => {
              // Open Dashboard (with hidden delivery)
              openStockDashboard(id);
          };

          card.innerHTML = `
            <div class="d-flex justify-content-between mb-2">
              <div>
                <h5 class="mb-0 fw-bold" style="color:#764ba2">Batch #${id}</h5>
                <small class="text-muted">Workshop Stock</small>
              </div>
              <span class="badge bg-light text-dark border rounded-pill">
                ${orderManufactured}/${orderRequired} Built
              </span>
            </div>
            ${lines}
            <div class="progress-track mt-2">
              <div class="progress-fill" style="width:${manufPercent}%; background: #764ba2;"></div>
            </div>
          `;

      } else {
          // --- CLIENT CARD STYLE (Standard) ---
          const manufPercent = orderRequired > 0 ? Math.round((orderManufactured / orderRequired) * 100) : 0;
          const barColor = isComplete ? 'var(--status-fitted)' : 'var(--status-deliv)';

          card.onclick = () => openOrder(id); // Goes to Dashboard

          card.innerHTML = `
            <div class="d-flex justify-content-between mb-2">
              <div>
                <h5 class="mb-0">${escHtml(getOrderDisplayTitle(details, id))}</h5>
                <small class="text-muted">${details.isMerged ? 'Combined manufacturing view' : `Order ${escHtml(getOrderDisplayIdText(details, id))}`}</small>
              </div>
              <span class="badge bg-light text-dark rounded-pill">
                ${orderDelivered}/${orderRequired} Delivered
              </span>
            </div>
            ${lines}
            <div class="progress-track mt-2">
              <div class="progress-fill" style="width:${manufPercent}%; background:${barColor};"></div>
            </div>
            <div class="small text-muted mt-2">
              ${orderManufactured}/${orderRequired} Manufactured
            </div>
          `;
      }

      list.appendChild(card);
    }

    if (visibleCount === 0) {
        list.innerHTML = `<div class="text-center text-muted py-5">No orders found in this tab.</div>`;
    }
  }

function loadTrackingHistory() {
  const tbody = document.getElementById('tracking-table-body');
  if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Loading history...</td></tr>';

  google.script.run
    .withSuccessHandler(rows => {
      trackingData = Array.isArray(rows) ? rows : [];
      refreshTrackingSourceFilterOptions();
      applyTrackingFilters();
    })
    .withFailureHandler(err => {
      if (tbody) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Failed to load tracking history: ${err.message || err}</td></tr>`;
      }
    })

}

function refreshTrackingSourceFilterOptions() {
  const selectEl = document.getElementById('tracking-filter-source');
  if (!selectEl) return;

  const previous = String(selectEl.value || '');
  const sources = Array.from(new Set((trackingData || [])
    .map(r => String(r.source || '').trim())
    .filter(Boolean)))
    .sort((a, b) => a.localeCompare(b));

  selectEl.innerHTML = '<option value="">All Sources</option>' +
    sources.map(src => `<option value="${src}">${src}</option>`).join('');

  if (previous && sources.includes(previous)) selectEl.value = previous;
}

function applyTrackingFilters() {
  const userFilter = String(document.getElementById('tracking-filter-user')?.value || '').trim().toLowerCase();
  const orderFilter = String(document.getElementById('tracking-filter-order')?.value || '').trim().toLowerCase();
  const sourceFilter = String(document.getElementById('tracking-filter-source')?.value || '').trim().toLowerCase();
  const dateFilter = String(document.getElementById('tracking-filter-date')?.value || '').trim();
  const sortField = document.getElementById('tracking-sort-field')?.value || 'date';
  const sortDir = document.getElementById('tracking-sort-dir')?.value || 'desc';

  filteredTrackingData = (trackingData || []).filter(r => {
    const userTxt = String(r.user || '').toLowerCase();
    const orderTxt = String(r.orderId || '').toLowerCase();
    const sourceTxt = String(r.source || '').toLowerCase();
    const dateTxt = String(r.dateKey || '');

    if (userFilter && !userTxt.includes(userFilter)) return false;
    if (orderFilter && !orderTxt.includes(orderFilter)) return false;
    if (sourceFilter && sourceTxt !== sourceFilter) return false;
    if (dateFilter && dateTxt !== dateFilter) return false;
    return true;
  });

  filteredTrackingData.sort((a, b) => {
    let aVal = '';
    let bVal = '';

    if (sortField === 'date') {
      aVal = Number(a.timeMs) || 0;
      bVal = Number(b.timeMs) || 0;
    } else if (sortField === 'user') {
      aVal = String(a.user || '').toLowerCase();
      bVal = String(b.user || '').toLowerCase();
    } else {
      aVal = String(a.orderId || '').toLowerCase();
      bVal = String(b.orderId || '').toLowerCase();
    }

    if (aVal < bVal) return sortDir === 'asc' ? -1 : 1;
    if (aVal > bVal) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  renderTrackingRows();
}

function renderTrackingRows() {
  const tbody = document.getElementById('tracking-table-body');
  if (!tbody) return;

  if (!filteredTrackingData.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No tracking entries found for the selected filters.</td></tr>';
    return;
  }

  tbody.innerHTML = filteredTrackingData.map(r => `
    <tr>
      <td class="ps-3">${r.dateStr || ''}</td>
      <td>${r.user || ''}</td>
      <td>${r.orderId || '—'}</td>
      <td>${r.source || ''}</td>
      <td>${r.item || ''}</td>
      <td>${r.change || ''}</td>
      <td class="pe-3">${r.reason || ''}</td>
    </tr>
  `).join('');
}

  if (type === 'wood') {

      google.script.run.withSuccessHandler(refresh).withFailureHandler(err => alert(err.message)).adjustEdgeStock(rowIndex, change, finalReason);

  function filterStockByJob() {
  const orderId = currentOrder;
  const bannerSlot = document.getElementById('cnc-filter-banner-slot');
  if (bannerSlot) bannerSlot.innerHTML = "";

  // Safety: if stock not loaded yet
  if (!stockData.wood || !Array.isArray(stockData.wood)) {
    cncWoodViewData = [];
    renderWoodStock(cncWoodViewData, 'cnc');
    return;
  }

  // If no active order context, show all stock
  if (!orderId || !rawData[orderId]) {
    cncWoodViewData = stockData.wood;
    renderWoodStock(cncWoodViewData, 'cnc');
    return;
  }

  // 1) Materials needed for this job (from panels)
  const requiredMaterials = new Set();

  if (rawData[orderId] && rawData[orderId].products) {
    const products = rawData[orderId].products;
    for (const productKey in products) {
      if (products[productKey].panels) {
        products[productKey].panels.forEach(p => {
          if (p.material) {
            const mat = String(p.material).trim().toLowerCase();
            if (mat.length > 2) requiredMaterials.add(mat);
          }
        });
      }
    }
  }

  const reqArray = Array.from(requiredMaterials);

  // 2) Filter wood stock by material match
  const filteredList = stockData.wood.filter(item => {
    const stockMat = String(item.material).trim().toLowerCase();
    if (stockMat.length < 2) return false;

    return reqArray.some(req => stockMat.includes(req) || req.includes(stockMat));
  });

  // 3) Render + banner
  if (filteredList.length > 0) {
    cncWoodViewData = filteredList;
    renderWoodStock(cncWoodViewData, 'cnc');

    if (bannerSlot) {
      bannerSlot.innerHTML = `
        <div class="alert alert-success py-2 mb-2 small shadow-sm">
          Found ${filteredList.length} items for <strong>${rawData[orderId].customer}</strong>
        </div>`;
    }
  } else {
    cncWoodViewData = stockData.wood;
    renderWoodStock(cncWoodViewData, 'cnc');

    if (bannerSlot) {
      bannerSlot.innerHTML = `
        <div class="alert alert-warning py-2 mb-2 small shadow-sm">
          <strong>No Match Found!</strong> Showing all stock.<br>
          Job Needs: "<em>${reqArray.join(', ')}</em>"
        </div>`;
    }
  }
}

function renderShopifyOrdersModal(rows) {
  const listEl = document.getElementById("shopify-orders-list");
  if (!listEl) return;

  if (!rows.length) {
    listEl.innerHTML = `<div class="text-muted text-center py-3">No pending orders.</div>`;

    // Auto-close if nothing left
    if (shopifyOrdersModalInst) {
      setTimeout(() => shopifyOrdersModalInst.hide(), 600);
    }
    reloadAllData();
    return;
  }

  // Group by orderId + customer
  const groups = {};
  rows.forEach(r => {
    const key = `${r.orderId}|||${r.customer}`;
    if (!groups[key]) groups[key] = { orderId: r.orderId, customer: r.customer, lines: [] };
    groups[key].lines.push(r);
  });

  const keys = Object.keys(groups).sort((a,b) => {
    const A = groups[a], B = groups[b];
    return String(B.orderId).localeCompare(String(A.orderId)); // newest first
  });

  const esc = (s) => String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  const accordId = "shopify-orders-accordion";
  let html = `<div class="accordion" id="${accordId}">`;

  keys.forEach((k, idx) => {
    const g = groups[k];
    const lines = g.lines;

    const collapseId = `so-collapse-${idx}`;
    const headingId = `so-heading-${idx}`;

    // Totals for header (clear and unambiguous)
    const totalOrdered = lines.reduce((s, r) => s + (Number(r.qtyOrdered) || 0), 0);
    const totalAllocated = lines.reduce((s, r) => s + (Number(r.allocatedFromStock) || 0), 0);
    const totalToBuild = Math.max(0, totalOrdered - totalAllocated);

    const noteList = Array.from(new Set(lines.map(r => norm(r.notes)).filter(Boolean)));
    const notesHtml = noteList.length
      ? `<div class="alert alert-light border small text-secondary mb-3"><strong class="text-dark">Notes:</strong><div class="mt-1" style="white-space:pre-wrap;">${noteList.map(note => esc(note)).join('<hr class="my-2">')}</div></div>`
      : "";

    const rowsHtml = lines.map(r => {
      const rowIndex = Number(r.rowIndex);
      const ordered = Number(r.qtyOrdered) || 0;
      const inStock = Number(r.availableInStock) || 0;
      const allocated = Number(r.allocatedFromStock) || 0;
      const toBuild = Math.max(0, ordered - allocated);
      const suggested = Number(r.recommendedAllocate) || 0;

      const busy = shopifyBusyRows.has(rowIndex);
      const disableAlloc = busy || (inStock <= 0) || (toBuild <= 0);
      const disableApprove = busy;

      return `
        <tr style="${busy ? "opacity:0.6;" : ""}">
          <td>
            <div class="fw-bold">${esc(r.productName)}</div>
            <div class="small text-muted">SKU ${esc(r.sku)}</div>

            <div class="small mt-1">
              <span class="badge bg-dark me-1">Ordered ${ordered}</span>
              <span class="badge bg-primary me-1">Allocated ${allocated}</span>
              <span class="badge bg-warning text-dark">To Build ${toBuild}</span>
            </div>

            <div class="small text-muted mt-2">
              ✅ Approve will <strong>import the full order</strong> but will <strong>pre-fill progress</strong> for the Allocated qty.
            </div>
          </td>

          <td class="text-center">
            <span class="badge ${inStock > 0 ? "bg-success" : "bg-secondary"}">${inStock}</span>
          </td>

          <td class="text-end" style="white-space:nowrap;">
            <button class="btn btn-outline-dark btn-sm rounded-pill me-1"
                    onclick="approveShopifyLine(${rowIndex}, this)"
                    ${disableApprove ? "disabled" : ""}>

function openSmartOrder(orderId) {
  const modalEl = document.getElementById("smartOrderModal");
  const bodyEl = document.getElementById("smart-order-body");
  const titleEl = document.getElementById("smart-order-title");

  if (!modalEl || !bodyEl || !titleEl) {

    return;
  }

  if (!smartOrderModalInst) {
    smartOrderModalInst = new bootstrap.Modal(modalEl, { backdrop: true, keyboard: true });

    modalEl.addEventListener("hidden.bs.modal", () => {
      document.querySelectorAll(".modal-backdrop").forEach(b => b.remove());
      document.body.classList.remove("modal-open");
      document.body.style.removeProperty("padding-right");
    });
  }

  currentSmartOrderId = orderId;
  currentSmartOrderData = null;
  setSmartOrderExportState(true, "📄 Export to Google Sheets");

  titleEl.innerText = `Smart Order • #${orderId}`;
  bodyEl.innerHTML = `
    <div class="text-center text-muted py-4">
      <div class="spinner-border"></div>
      <div class="mt-2">Loading Smart Order…</div>
    </div>
    <div class="d-flex gap-2 justify-content-center mt-2">
      <button class="btn btn-outline-dark btn-sm rounded-pill" type="button" onclick='openSmartOrder(${jsStr(orderId)})'>Retry</button>
    </div>
  `;
  smartOrderModalInst.show();

  let rpcCompleted = false;
  const authDialogTimeout = setTimeout(() => {
    if (rpcCompleted) return;
    bodyEl.innerHTML = `
      <div class="alert alert-warning mb-0">
        <strong>Still loading Smart Order…</strong><br>
        If it doesn't load, click <strong>Retry</strong> below.
      </div>
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-outline-dark btn-sm rounded-pill" type="button" onclick='openSmartOrder(${jsStr(orderId)})'>Retry</button>
      </div>
    `;
  }, 5000);

  console.log("[SmartOrder] requesting summary", { orderId });

  google.script.run
    .withSuccessHandler(data => {
      console.log("[SmartOrder] summary success", data);
      rpcCompleted = true;
      clearTimeout(authDialogTimeout);
      renderSmartOrderModal(data);
    })
    .withFailureHandler(err => {
      console.error("[SmartOrder] summary failed", err);
      rpcCompleted = true;
      clearTimeout(authDialogTimeout);
      const message = err && err.message ? err.message : "Unknown error.";
      const lowerMsg = String(message).toLowerCase();
      const authHint = lowerMsg.includes("authorization") || lowerMsg.includes("authorize")
        || lowerMsg.includes("access") || lowerMsg.includes("permission")
        || lowerMsg.includes("oauth");
      const hintHtml = authHint
        ? `<div class="alert alert-warning mt-3">
            <strong>Authorization needed.</strong>
            This feature reads from external sheets. Please open the Apps Script project,
            run <code>authorizeSmartOrderAccess</code> once, and complete the Google authorization flow.
            Also confirm the executing account has access to the Shopify Orders + Product Recipe sheets.
          </div>`
        : "";
      setSmartOrderExportState(true, "📄 Export to Google Sheets");
      bodyEl.innerHTML = `
        <div class="text-danger">Error: ${escHtml(message)}</div>
        ${hintHtml}
      `;
    })
    .getSmartOrderSummary(orderId);
}

function allocateShopifyLine(shopifyRowIndex, inStock, remainingToAllocate, suggested) {
  const maxAlloc = Math.min(Number(inStock) || 0, Number(remainingToAllocate) || 0);
  if (maxAlloc <= 0) { alert("No stock available to allocate for this line."); return; }

  const def = Math.min(Number(suggested) || maxAlloc, maxAlloc);
  const entered = prompt(`Allocate how many from stock now? (1-${maxAlloc})`, String(def));
  if (entered === null) return;

  const qty = parseInt(entered, 10);
  if (!qty || qty < 1 || qty > maxAlloc) { alert("Invalid quantity."); return; }

  shopifyBusyRows.add(shopifyRowIndex);
  showStatus("Allocating...", false);

  google.script.run
    .withSuccessHandler(() => {
      showStatus("Allocated!", true);
      shopifyBusyRows.delete(shopifyRowIndex);

      // refresh stock + orders list + app UI
      refreshShopifyOrdersModal();
      reloadAllData();
    })
    .withFailureHandler(err => {
      shopifyBusyRows.delete(shopifyRowIndex);
      alert("Allocation failed: " + err.message);
      showStatus("Error", true);
      refreshShopifyOrdersModal();
    })
    .allocateFinishedGoodsToOrder(shopifyRowIndex, qty);
}

function chooseShopifyMergeTarget(context) {
  const safe = context || {};
  const customer = norm(safe.customer) || 'This customer';
  const existingTargetId = norm(safe.existingMergeTargetId);
  const candidates = Array.isArray(safe.candidates) ? safe.candidates : [];

  const getCandidateLabel = (candidate) => Array.isArray(candidate?.displayOrderIds) && candidate.displayOrderIds.length
    ? candidate.displayOrderIds.join(' & ')
    : norm(candidate?.targetOrderId);

  if (existingTargetId) {
    const existingCandidate = candidates.find(candidate => norm(candidate.targetOrderId) === existingTargetId)
      || { targetOrderId: existingTargetId, displayOrderIds: [existingTargetId] };
    const label = getCandidateLabel(existingCandidate);
    const keepMerged = confirm(
      `This Shopify order is already linked to existing order #${label}.

` +
      `Press OK to keep importing it into #${label}, or Cancel to stop this import.`
    );
    return keepMerged ? existingTargetId : null;
  }

  if (!candidates.length) return "";

  if (candidates.length === 1) {
    const label = getCandidateLabel(candidates[0]);
    const shouldMerge = confirm(
      `${customer} already has an active manufacturing order (#${label}).

` +
      `Press OK to merge this into order #${label}, or Cancel to keep it as a separate order.`
    );
    return shouldMerge ? norm(candidates[0].targetOrderId) : "";
  }

  const options = ['0. Keep as a separate order'];
  candidates.forEach((candidate, idx) => {
    options.push(`${idx + 1}. Merge with existing order #${getCandidateLabel(candidate)}`);
  });

  const promptText = [
    `${customer} already has active manufacturing orders.`,
    '',
    ...options,
    '',
    'Enter the number of your choice:'
  ].join('\n');

  const entered = prompt(promptText, '0');
  if (entered === null) return null;

  const choice = parseInt(entered, 10);
  if (Number.isNaN(choice) || choice < 0 || choice > candidates.length) {
    alert('Invalid choice. Import cancelled.');
    return null;
  }

  return choice === 0 ? '' : norm(candidates[choice - 1].targetOrderId);
}

function approveShopifyLine(shopifyRowIndex, btnElement) {
  if (!confirm("Approve & import this line into Manufacturing/Delivery now?")) return;

  if (btnElement) {
    btnElement.disabled = true;
    btnElement.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Importing...';
  }

  shopifyBusyRows.add(shopifyRowIndex);
  showStatus("Checking merge options...", false);

  const resetButton = (label = "Import (Build)") => {
    if (!btnElement) return;
    btnElement.disabled = false;
    btnElement.innerText = label;
  };

  google.script.run
    .withSuccessHandler(context => {
      const mergeTargetOrderId = chooseShopifyMergeTarget(context);
      if (mergeTargetOrderId === null) {
        shopifyBusyRows.delete(shopifyRowIndex);
        showStatus("Cancelled", true);
        resetButton();
        return;
      }

      showStatus("Importing...", false);
      google.script.run
        .withSuccessHandler(res => {
          shopifyBusyRows.delete(shopifyRowIndex);

          if (!String(res).startsWith("SUCCESS") && String(res) !== "Already imported") {
            alert("Import result: " + res);
            resetButton('Retry Import');
            return;
          }

          const importedMsg = String(res).startsWith('SUCCESS|MERGED|')
            ? `Imported and merged into Order #${String(res).split('|')[2]}.`
            : 'Imported!';
          showStatus(importedMsg, true);
          refreshShopifyOrdersModal();
          reloadAllData();
        })
        .withFailureHandler(err => {
          shopifyBusyRows.delete(shopifyRowIndex);
          alert("Approve/Import failed: " + err.message);
          showStatus("Error", true);
          resetButton('Import (Retry)');
        })
        .approveAndImportShopifyRow(shopifyRowIndex, mergeTargetOrderId || "");
    })
    .withFailureHandler(err => {
      shopifyBusyRows.delete(shopifyRowIndex);
      alert("Could not check merge options: " + err.message);
      showStatus("Error", true);
      resetButton('Import (Retry)');
    })
    .getShopifyMergeOptions(shopifyRowIndex);
}

  function mergeWorkshopStockOrders() {
  const wsKey = "WORKSHOP";
  const ws = {
    id: wsKey,
    customer: "Workshop Stock",
    products: {},
    delivery: { bucket: {}, rooms: {} },
    memberOrderIds: [],
    displayOrderIds: [wsKey],
    mergeTargetOrderId: wsKey,
    isMerged: false
  };

  const keys = Object.keys(rawData || {});
  const toRemove = [];

  keys.forEach(orderId => {
    const o = rawData[orderId];
    if (!o) return;

    if (norm(o.customer).toLowerCase() === "workshop stock") {
      toRemove.push(orderId);
      ws.memberOrderIds = Array.from(new Set([...(ws.memberOrderIds || []), ...(o.memberOrderIds || [orderId])].map(id => norm(id)).filter(Boolean)));

      for (const prodKey in (o.products || {})) {
        if (!ws.products[prodKey]) ws.products[prodKey] = { panels: [], components: [], sourceOrderIds: [] };

        const src = o.products[prodKey];
        if (src.panels && src.panels.length) ws.products[prodKey].panels.push(...src.panels);
        if (src.components && src.components.length) ws.products[prodKey].components.push(...src.components);
        ws.products[prodKey].sourceOrderIds = Array.from(new Set([
          ...(ws.products[prodKey].sourceOrderIds || []),
          ...((src && src.sourceOrderIds) || [orderId])
        ].map(id => norm(id)).filter(Boolean)));
      }
    }
  });

  toRemove.forEach(k => delete rawData[k]);

  if (Object.keys(ws.products).length) rawData[wsKey] = ws;
}

  for (const ord of Object.values(rawData)) {
    if (!ord.products) continue;
    for (const prod of Object.values(ord.products)) {
      if (prod.components) {
        const found = prod.components.find(c => String(c.rowIndex) === String(rowIndex));
        if (found) return found;
      }
    }
  }
  return null;
}

function queueCompDelta(rowIndex, delta) {
  const key = String(rowIndex);

  if (!pendingCompUpdates[key]) {
    pendingCompUpdates[key] = {
      rowIndex,
      mode: "inc",
      delta: 0,
      opId: makeOpId(),
      ts: Date.now()
    };
  }

  // If a SET is already queued, don’t switch modes; just adjust the target
  if (pendingCompUpdates[key].mode === "set") {
    pendingCompUpdates[key].value = Number(pendingCompUpdates[key].value || 0) + Number(delta || 0);
  } else {
    pendingCompUpdates[key].delta = Number(pendingCompUpdates[key].delta || 0) + Number(delta || 0);
  }

  pendingCompUpdates[key].ts = Date.now();
  showStatus("Saving...", false);
  markUnsaved();

  if (compSaveTimer) clearTimeout(compSaveTimer);
  compSaveTimer = setTimeout(sendCompQueueToServer, 400);
}

function queueCompSet(rowIndex, base, value) {
  const key = String(rowIndex);

  pendingCompUpdates[key] = {
    rowIndex,
    mode: "set",
    base: Number(base || 0),
    value: Number(value || 0),
    opId: makeOpId(),
    ts: Date.now()
  };

  showStatus("Saving...", false);
  markUnsaved();

  if (compSaveTimer) clearTimeout(compSaveTimer);
  compSaveTimer = setTimeout(sendCompQueueToServer, 400);
}


function sendCompQueueToServer() {
  if (compSaveInFlight) {
    if (compSaveTimer) clearTimeout(compSaveTimer);
    compSaveTimer = setTimeout(sendCompQueueToServer, 300);
    return;
  }

  const sending = pendingCompUpdates || {};
  const payload = Object.values(sending);

  if (!payload.length) {
    clearUnsavedIfEmptyQueues();
    return;
  }

  inFlightCompUpdates = sending;
  pendingCompUpdates = {};

  compSaveInFlight = true;
  showStatus("Saving.", false);

  google.script.run
    .withSuccessHandler((res) => {
      compSaveInFlight = false;

      if (!Array.isArray(res)) {
        for (const k in inFlightCompUpdates) if (!pendingCompUpdates[k]) pendingCompUpdates[k] = inFlightCompUpdates[k];
        inFlightCompUpdates = {};
        markUnsaved("Not saved: unexpected server response.");
        showStatus("Not saved", true);
        return;
      }

      res.forEach(r => {
        const key = String(r.rowIndex);
        delete inFlightCompUpdates[key];

        if (r.conflict) {
          // Re-queue what we attempted if there’s no newer edit already
          if (!pendingCompUpdates[key]) pendingCompUpdates[key] = sending[key];
          markUnsaved("Conflict: someone else updated components. Reload & retry.");
          return;
        }

        if (r.outOfStock) {
          const available = (r.available !== undefined) ? ` Available: ${r.available}.` : "";
          alert(`Out of stock for this component.${available}`);
          const el = document.getElementById(`comp-packed-${r.rowIndex}`);
          if (el && r.current !== undefined) el.value = r.current;

          const c = getCompByRow(r.rowIndex);
          if (c && r.current !== undefined) c.qtyPacked = r.current;
          return;
        }

        // If user changed again while saving, don't overwrite UI
        if (pendingCompUpdates[key]) return;

        const el = document.getElementById(`comp-packed-${r.rowIndex}`);
        if (el && r.value !== undefined) el.value = r.value;

        const c = getCompByRow(r.rowIndex);
        if (c && r.value !== undefined) c.qtyPacked = r.value;
      });

      if (Object.keys(pendingCompUpdates).length > 0) {
        if (compSaveTimer) clearTimeout(compSaveTimer);
        compSaveTimer = setTimeout(sendCompQueueToServer, 0);
        markUnsaved();
        return;
      }

      clearUnsavedIfEmptyQueues();
      showStatus("Saved", true);
    })
    .withFailureHandler((err) => {
      compSaveInFlight = false;
      setHealthBadge(false);

      for (const k in inFlightCompUpdates) if (!pendingCompUpdates[k]) pendingCompUpdates[k] = inFlightCompUpdates[k];
      inFlightCompUpdates = {};

      markUnsaved("Not saved (connection/server issue).");
      showStatus("Not saved", true);
      console.log("Component save failed:", err);
    })
    .processComponentBatch(payload);
}



function compStep(e, rowIndex, dir) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const c = getCompByRow(rowIndex);
  if (!c) return;

  const per = Number(c.qtyPerUnit) || 1;
  const req = Number(c.qtyRequired) || 0;
  const cur = Number(c.qtyPacked) || 0;

  let next = cur + (dir * per);
  if (next < 0) next = 0;
  if (req > 0 && next > req) next = req;

  c.qtyPacked = next;

  const input = document.getElementById('comp-packed-' + rowIndex);
  if (input) input.value = next;

  queueCompDelta(rowIndex, next - cur);

}

function compSetExact(e, rowIndex, rawVal) {
  if (e) { e.stopPropagation(); }

  const c = getCompByRow(rowIndex);
  if (!c) return;

  const req = Number(c.qtyRequired) || 0;
  const cur = Number(c.qtyPacked) || 0;

  let next = parseInt(rawVal, 10);
  if (isNaN(next)) next = 0;

  if (next < 0) next = 0;
  if (req > 0 && next > req) next = req;

  c.qtyPacked = next;
  queueCompSet(rowIndex, cur, next);
}


function calcPanelGate(prodData, requiredUnits) {
  const panels = (prodData && prodData.panels) ? prodData.panels : [];
  let minUnits = Infinity;
  let limiter = null;

  const lines = panels.map(p => {
    const per = Number(p.qtyPerUnit) || 1;
    const packed = Number(p.qtyPacked) || 0;
    const required = Number(p.qtyOrder) || 0;
    const units = Math.floor(packed / per);

    if (units < minUnits) {
      minUnits = units;
      limiter = { name: p.panelName, packed, required, per, units };
    }

    return { type: "Panel", name: p.panelName, packed, required, per, units };
  });

  if (minUnits === Infinity) minUnits = 0;
  const ready = Math.min(minUnits, requiredUnits);

  return { ready, limiter, lines };
}

function calcCompGate(prodData, requiredUnits) {
  const comps = (prodData && prodData.components) ? prodData.components : [];
  let minUnits = Infinity;
  let limiter = null;

  const lines = comps.map(c => {
    const per = Number(c.qtyPerUnit) || 1;
    const packed = Number(c.qtyPacked) || 0;
    const required = Number(c.qtyRequired) || 0;
    const units = Math.floor(packed / per);

    if (units < minUnits) {
      minUnits = units;
      limiter = { name: c.compName, packed, required, per, units };
    }

    return { type: "Component", name: c.compName, packed, required, per, units };
  });

  // If no components exist, treat as "not limiting"
  if (minUnits === Infinity) minUnits = 999999;
  const ready = Math.min(minUnits, requiredUnits);

  return { ready, limiter, lines };
}

function openGateModal(evt, prodName) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }

  const orderObj = rawData[currentOrder];
  if (!orderObj || !orderObj.products || !orderObj.products[prodName]) return;

  const prodData = orderObj.products[prodName];

  // Required units for this product
  const del = getDeliveryTotals(orderObj, prodName);
  const requiredUnits = getRequiredUnits(prodData, del.total);

  const panelGate = calcPanelGate(prodData, requiredUnits);
  const compGate = calcCompGate(prodData, requiredUnits);

  // Build "blockers" list (only items below requiredUnits)
  const blockers = []
    .concat(panelGate.lines, compGate.lines)
    .filter(x => x.units < requiredUnits)
    .sort((a, b) => a.units - b.units)
    .slice(0, 3);

  // UI text
  document.getElementById("gateTitle").innerText = `${prodName} (Req: ${requiredUnits})`;

  const panelLine = panelGate.limiter
    ? `${panelGate.ready} / ${requiredUnits} (limiting: ${panelGate.limiter.name})`
    : `${panelGate.ready} / ${requiredUnits}`;

  const compLine = compGate.limiter && compGate.ready < requiredUnits
    ? `${compGate.ready} / ${requiredUnits} (limiting: ${compGate.limiter.name})`
    : `${compGate.ready} / ${requiredUnits}${(prodData.components && prodData.components.length) ? "" : " (no components tracked)"}`;

  let blockersHtml = "";
  if (!blockers.length) {
    blockersHtml = `<div class="text-success fw-bold">✅ No blockers — fully manufactured</div>`;
  } else {
    blockersHtml = blockers.map(b => {
      const label = (b.type === "Panel") ? "Panels" : "Components";
      return `
        <div class="border rounded-3 p-2 mb-2">
          <div class="fw-bold">${label}: ${b.name}</div>
          <div class="small text-muted">
            Packed ${b.packed} / Required ${b.required}  •  ${b.units} unit(s)
          </div>
        </div>
      `;
    }).join("");
  }

  document.getElementById("gateBody").innerHTML = `
    <div class="mb-3">
      <div class="fw-bold">Panels ready:</div>
      <div class="text-muted">${panelLine}</div>
    </div>

    <div class="mb-3">
      <div class="fw-bold">Components ready:</div>
      <div class="text-muted">${compLine}</div>
    </div>

    <hr>

    <div class="fw-bold mb-2">Top blockers:</div>
    ${blockersHtml}
  `;

  new bootstrap.Modal(document.getElementById("gateModal")).show();
}

function rerenderCurrentView() {
  // Always refresh job list in background
  renderJobs();

  if (!currentOrder) return;

  // If you're in delivery screens, refresh their UI too
  if (currentViewId === 'view-delivery') {
    renderDeliverySummary();
    // refresh whichever tab is visible
    if (!document.getElementById('deliv-bucket-view').classList.contains('hidden')) renderBucket();
    if (!document.getElementById('deliv-rooms-view').classList.contains('hidden')) renderRooms();
  }

  // If you're in manufacturing list, re-render it
  if (currentViewId === 'view-manuf-list') openManufacturing();

  // If you're inside a product view, refresh that view
  if (currentViewId === 'view-panels') openPanels();
  if (currentViewId === 'view-comps') openComponents();
}

function reloadAllData() {
  showStatus("Refreshing...", false);

  let gotData = false;
  let gotStock = false;

  const done = () => {
    if (gotData && gotStock) {
      rerenderCurrentView();
      showStatus("Updated", true);
    }
  };

  google.script.run
    .withSuccessHandler(d => { rawData = d || {}; gotData = true; done(); })
    .withFailureHandler(err => { alert("Refresh failed (jobs): " + err.message); gotData = true; done(); })
    .getDataTree();

  google.script.run
    .withSuccessHandler(d => { stockData = d || {}; gotStock = true; done(); })
    .withFailureHandler(err => { alert("Refresh failed (stock): " + err.message); gotStock = true; done(); })
    .getInventoryData();
}

// ------------------------
// CNC CUT SESSION (after allocate)
// ------------------------
let cncCutCtx = null; // { orderId, productKey, prodData }
let pendingCncCutUpdates = {};
let cncSaveTimer = null; // <--- MATCHES THE FUNCTION USAGE

function findProductKey(orderId, productName) {
  const orderObj = rawData[orderId];
  if (!orderObj || !orderObj.products) return null;

  const target = norm(productName);
  for (const key in orderObj.products) {
    if (norm(key) === target) return key;
  }
  return null;
}

function getCutUnits(prodData) {
  let minUnits = Infinity;
  const panels = (prodData && prodData.panels) ? prodData.panels : [];

  if (!panels.length) return 0;

  panels.forEach(p => {
    const per = Number(p.qtyPerUnit) || 1;
    const cut = Number(p.qtyCut) || 0;
    const units = Math.floor(cut / per);
    if (units < minUnits) minUnits = units;
  });

  if (minUnits === Infinity) return 0;
  return minUnits;
}

function updateCncCutSummary() {
  if (!cncCutCtx) return;

  const orderObj = rawData[cncCutCtx.orderId];
  const prodData = cncCutCtx.prodData;

  const del = getDeliveryTotals(orderObj, cncCutCtx.productKey);
  const requiredUnits = getRequiredUnits(prodData, del.total);
  const cutUnits = Math.min(getCutUnits(prodData), requiredUnits);

  const el = document.getElementById("cncCutSummary");
  if (el) el.innerText = `Cut progress: ${cutUnits} / ${requiredUnits} furniture item(s)`;
}

function openCncCutModal(orderId, productName) {
  orderId = norm(orderId);
  productName = norm(productName);

  const productKey = findProductKey(orderId, productName);
  if (!productKey) {
    alert("Could not find this product in rawData. Try ↻ Refresh first.");
    return;
  }

  const prodData = rawData[orderId].products[productKey];
  cncCutCtx = { orderId, productKey, prodData };

  // Title
  const titleEl = document.getElementById("cncCutTitle");
  if (titleEl) titleEl.innerText = `Order ${orderId} • ${productKey}`;

  // Render list
  const listEl = document.getElementById("cncCutList");
  const panels = (prodData && prodData.panels) ? prodData.panels : [];

  if (!listEl) return;

  if (!panels.length) {
    listEl.innerHTML = `<div class="text-muted text-center py-3">No panels found for this product.</div>`;
  } else {
    listEl.innerHTML = panels.map(p => {
      const req = Number(p.qtyOrder) || 0;
      const cut = Number(p.qtyCut) || 0;
      const rem = Math.max(0, req - cut);

      return `
  <div class="card p-3 mb-2 border-0 shadow-sm">
    <div class="d-flex justify-content-between align-items-center">
      <div style="flex:1; padding-right:12px;">
        <div class="fw-bold text-dark">${p.panelName}</div>
        <div class="small text-muted">
          Required: ${req} • Cut: <span id="cnc-cut-${p.rowIndex}">${cut}</span> • Remaining: <span id="cnc-rem-${p.rowIndex}">${rem}</span>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="button"
                class="btn btn-outline-secondary btn-sm rounded-pill"
                onclick="cncCutAdd(${p.rowIndex}, -1)">
          UNDO
        </button>

        <button type="button"
                class="btn btn-dark btn-sm rounded-pill"
                onclick="cncCutAdd(${p.rowIndex}, 1)">
          CUT +1
        </button>
      </div>
    </div>
  </div>
`;

    }).join("");
  }

  updateCncCutSummary();

  new bootstrap.Modal(document.getElementById("cncCutModal"), { backdrop: 'static', keyboard: false }).show();
}

function cncCutAdd(rowIndex, inc) {
  if (!cncCutCtx) return;

  const panels = cncCutCtx.prodData.panels || [];
  const p = panels.find(x => Number(x.rowIndex) === Number(rowIndex));
  if (!p) return;

  const req = Number(p.qtyOrder) || 0;
  const cur = Number(p.qtyCut) || 0;

  // Safety: you can't set Cut below any later stage
  const minAllowed = Math.max(
    Number(p.qtyProcessed) || 0,
    Number(p.qtyEdgeFinish) || 0,
    Number(p.qtyPacked) || 0
  );

  let next = cur + (Number(inc) || 0);

  if (next > req) {
    showStatus("Max reached", true);
    return;
  }

  if (next < minAllowed) {
    showStatus("Blocked: reduce later stages first", true);
    return;
  }

  if (next < 0) next = 0;

  // update local model
  p.qtyCut = next;

  // update UI for that row
  const cutEl = document.getElementById("cnc-cut-" + rowIndex);
  const remEl = document.getElementById("cnc-rem-" + rowIndex);
  if (cutEl) cutEl.innerText = next;
  if (remEl) remEl.innerText = Math.max(0, req - next);

  updateCncCutSummary();

  // queue save
  const key = `${rowIndex}-cut`;
if (!pendingCncCutUpdates[key]) {
  pendingCncCutUpdates[key] = {
    rowIndex,
    colName: "cut",
    base: cur,
    delta: 0,
    opId: makeOpId(),
    ts: Date.now()
  };
}
pendingCncCutUpdates[key].delta = Number(pendingCncCutUpdates[key].delta || 0) + Number(inc || 0);
pendingCncCutUpdates[key].ts = Date.now();

showStatus("Saving...", false);
markUnsaved();

if (cncSaveTimer) clearTimeout(cncSaveTimer);
cncSaveTimer = setTimeout(sendCncCutQueueToServer, 500);

}


function sendCncCutQueueToServer() {
  if (cncSaveInFlight) {
    if (cncSaveTimer) clearTimeout(cncSaveTimer);
    cncSaveTimer = setTimeout(sendCncCutQueueToServer, 300);
    return;
  }

  const sending = pendingCncCutUpdates || {};
  const payload = Object.values(sending);

  if (!payload.length) {
    clearUnsavedIfEmptyQueues();
    return;
  }

  inFlightCncCutUpdates = sending;
  pendingCncCutUpdates = {};

  cncSaveInFlight = true;
  showStatus("Saving.", false);

  google.script.run
    .withSuccessHandler((res) => {
      cncSaveInFlight = false;

      if (!Array.isArray(res)) {
        for (const k in inFlightCncCutUpdates) if (!pendingCncCutUpdates[k]) pendingCncCutUpdates[k] = inFlightCncCutUpdates[k];
        inFlightCncCutUpdates = {};
        markUnsaved("Not saved: unexpected server response.");
        showStatus("Not saved", true);
        return;
      }

      res.forEach(r => {
        const key = `${r.rowIndex}-cut`;
        delete inFlightCncCutUpdates[key];

        if (pendingCncCutUpdates[key]) return; // newer click exists

        const el = document.getElementById(`cnc-cut-${r.rowIndex}`);
        if (el && r.value !== undefined) el.innerText = r.value;

        const p = cncCutCtx?.prodData?.panels?.find(x => String(x.rowIndex) === String(r.rowIndex));
        if (p && r.value !== undefined) p.qtyCut = r.value;
      });

      if (Object.keys(pendingCncCutUpdates).length > 0) {
        if (cncSaveTimer) clearTimeout(cncSaveTimer);
        cncSaveTimer = setTimeout(sendCncCutQueueToServer, 0);
        markUnsaved();
        return;
      }

      clearUnsavedIfEmptyQueues();
      showStatus("Saved", true);
    })
    .withFailureHandler((err) => {
      cncSaveInFlight = false;
      setHealthBadge(false);

      for (const k in inFlightCncCutUpdates) if (!pendingCncCutUpdates[k]) pendingCncCutUpdates[k] = inFlightCncCutUpdates[k];
      inFlightCncCutUpdates = {};

      markUnsaved("Not saved (connection/server issue).");
      showStatus("Not saved", true);
      console.log("CNC save failed:", err);
    })
    .processBatch(payload);
}



function switchCncWoodSubTab(tab) {
  currentCncWoodSubTab = tab;

  document.getElementById('tab-cnc-wood-sheets')?.classList.toggle('active', tab === 'sheets');
  document.getElementById('tab-cnc-wood-offcuts')?.classList.toggle('active', tab === 'offcuts');

  document.getElementById('wood-stock-list-sheets')?.classList.toggle('hidden', tab !== 'sheets');
  document.getElementById('wood-stock-list-offcuts')?.classList.toggle('hidden', tab !== 'offcuts');
}



  // --- BARCODE SCANNER LISTENER ---
  let scanBuffer = "";
  let scanTimer = null;

  document.addEventListener('keydown', (e) => {
    // 1. If we are typing in a search box, don't interfere (unless it's Enter)
    const activeTag = document.activeElement.tagName;
    if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') {
        if (e.key === 'Enter') {
            // If the user hit Enter in a search box, they might be scanning into it.
            // We grab the value, process it, and clear the input.
            const val = document.activeElement.value.trim();
            if (val.length > 5) { // Assuming barcodes are long
                processBarcode(val);
                document.activeElement.value = "";
                document.activeElement.blur(); // Unfocus
            }
        }
        return;
    }

    // 2. Buffer the keystrokes
    if (e.key === 'Enter') {
      if (scanBuffer.length > 3) {
        processBarcode(scanBuffer);
      }
      scanBuffer = "";
    } else {
      // Ignore control keys (Shift, Ctrl, etc.)
      if (e.key.length === 1) {
        scanBuffer += e.key;
      }
    }

    // 3. Clear buffer if typing is too slow (manual typing vs scanner speed)
    if (scanTimer) clearTimeout(scanTimer);
    scanTimer = setTimeout(() => { scanBuffer = ""; }, 300); // 300ms timeout
  });

  function processBarcode(scannedId) {
    showStatus("Scanning...", false);

    // Clean the scan (some scanners add spaces or special chars)
    scannedId = scannedId.trim();

    // --- SEARCH ALGORITHM ---
    // We look for a Panel where: OrderID + "-" + SKU + "-" + PanelName(Safe) === scannedId

    let found = false;

    // Loop through Orders
    for (const [ordId, ordData] of Object.entries(rawData)) {

        // Loop through Products
        for (const [prodName, prodData] of Object.entries(ordData.products)) {

            // We need the SKU.
            // NOTE: Assuming your rawData tree has SKU.
            // If not, we try to reconstruct it or check partial match.
            // Let's assume the SKU is stored in the product object.
            // If it's missing, we grab it from the first component or panel row if available.
            // But for now, let's look at the PANELS.

            if (prodData.panels) {
                for (const p of prodData.panels) {

                    // We reconstruct the ID the same way the Sheet does:
                    // Sheet Formula: Order + "-" + SKU + "-" + PanelName(with _ for spaces)

                    // Note: We need the SKU for this panel.
                    // In your getDataTree(), ensure 'sku' is passed in the panel object or product object.
                    // Assuming 'p.sku' exists or 'prodData.sku' exists.
                    // Let's try to match strict pattern first.

                    // Fallback: If we don't have SKU easily, we can try to match the TAIL of the string.
                    // Scanned: "1006-CAB600-Side_Panel"
                    // Target: PanelName = "Side Panel" -> "Side_Panel"
                    // Order: 1006

                    const safeName = p.panelName.replace(/ /g, "_");

                    // Check if the Scanned ID *ENDS WITH* "-[SafeName]" AND *STARTS WITH* "[OrderId]-"
                    // This is safer than guessing the SKU position if we aren't sure of data structure.

                    if (scannedId.endsWith("-" + safeName) && scannedId.startsWith(ordId + "-")) {
                         found = true;

                         // 1. Set Context
                         currentOrder = ordId;
                         currentProduct = prodName;

                         // 2. Set UI Text
                         document.getElementById('dash-customer').innerText = getOrderDisplayTitle(rawData[ordId], ordId);
                         document.getElementById('manuf-customer').innerText = getOrderDisplayTitle(rawData[ordId], ordId);
                         document.getElementById('fork-product-name').innerText = prodName;
                         document.getElementById('panel-prod-name').innerText = prodName;

                         // 3. Navigate
                         showStatus("Found: " + p.panelName, true);
                         openSinglePanel(p.rowIndex);
                         return;
                    }
                }
            }
        }
    }

    if (!found) {
        alert("❌ Barcode not found:\n" + scannedId);
        showStatus("Not Found", true);
    }
  }

  function run(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)[fnName](...args);
  });
}
